name: V2 Source Adapter Bulk Validation
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/source_adapter_service_health.py'
      - 'v2/test_source_adapter_service_health.py'
      - 'v2/github_source_discovery.py'
      - 'v2/run_forge_source_discovery.py'
      - 'v2/forge_source_discovery.py'
      - 'v2/config/sources.json'
      - 'v2/config/live-pages.json'
      - 'v2/test_run_live_page_discovery.py'
      - 'v2/orphan_source_only_recheck.py'
      - 'v2/test_orphan_source_only_recheck.py'
      - 'v2/orphan_targeted_github_code.py'
      - 'v2/history/orphan-10-no-candidate-public-hashes.json'
      - '.github/workflows/v2-source-adapter-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    name: Source adapters - grouped offline tests and source-only live health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm protected IBO playlist has immutable blob
        shell: bash
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Install pinned encrypted-evidence dependency for grouped source tests
        run: python -m pip install cryptography==44.0.2
      - name: Run related source adapter tests in one batch
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_adapter_pagination_coverage \
            test_source_adapter_service_health \
            test_source_adapter_matrix \
            test_source_adapters_batch \
            test_forge_adapter_integration \
            test_forge_source_runner \
            test_forge_source_discovery \
            test_forge_source_review \
            test_forge_api_safety \
            test_partial_source_coverage \
            test_github_source_safety \
            test_github_source_approval \
            test_github_partial_discovery \
            test_gist_filename_discovery \
            test_source_inventory_contract \
            test_webpage_source_discovery \
            test_source_availability_audit \
            test_run_live_page_discovery \
            test_orphan_source_only_recheck \
            test_orphan_targeted_github_code \
            2>&1 | tee v2/reports/ci/source-adapter-batch.log
      - name: Probe six public source/API entrypoints, no channel discovery
        run: python v2/source_adapter_service_health.py --audit-source-services
      - name: Targeted source remainder recheck in one live group - no AV or IBO writes
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s python v2/source_availability_audit.py --audit-public-sources
          timeout 480s python v2/run_forge_source_discovery.py --scan-public-forges
          timeout 480s python v2/run_live_page_discovery.py --scan-approved-live-pages
          timeout 480s python v2/document_platform_discovery.py --scan-public-documents
          PYTHONPATH=v2 python - <<'PY'
          import json
          from pathlib import Path

          base = Path("v2/reports")
          static = json.loads((base / "source-availability-audit.json").read_text())
          forge = json.loads((base / "forge-source-discovery.json").read_text())
          pages = json.loads((base / "live-page-references.json").read_text())
          docs = json.loads((base / "document-platform-references.json").read_text())

          def public_project(row):
              try:
                  return json.loads(row.get("project", "{}")).get("id")
              except (ValueError, TypeError):
                  return None

          report = {
              "kind": "V2_TARGETED_READ_ONLY_SOURCE_RECHECK",
              "static_checked": static["source_count"],
              "static_reachable": static["reachable_source_count"],
              "static_failures": [
                  {"id": x["source_id"], "status": x["status"],
                   "http_status": x.get("http_status"), "error": x.get("error")}
                  for x in static["results"] if x["status"] != "HTTP_OK"
              ],
              "forge_sources": forge["source_count"],
              "forge_failures": [
                  {"forge": x.get("forge"), "error": x.get("error"),
                   "public_project_id": public_project(x)}
                  for x in forge["errors"]
              ],
              "forge_limits": forge["limits_hit"],
              "live_pages_checked": pages["pages_checked"],
              "live_page_failures": [
                  {"id": x.get("page_id"), "error": x.get("error")} for x in pages["errors"]
              ],
              "document_source_candidates": docs["source_candidates"],
              "document_failures": [
                  {"platform": x.get("platform"), "stage": x.get("stage"),
                   "error": x.get("error")} for x in docs["errors"]
              ],
              "external_source_coverage_complete": (
                  not static["unreachable_source_count"] and
                  not forge["errors"] and not forge["limits_hit"] and
                  not pages["errors"] and not docs["errors"]
              ),
              "av_verified": False, "ibo_device_verified": False,
              "protected_playlist_modified": False,
          }
          payload = json.dumps(report, ensure_ascii=False, sort_keys=True)
          assert "https://" not in payload and "http://" not in payload
          assert report["static_checked"] == 46
          dest = base / "ci" / "source-recheck-anonymous.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print("TARGETED_SOURCE_RECHECK", payload)
          PY
      - name: One-off exact 10 public M3U and M3U8 source search (NO media probe)
        if: >-
          github.event_name == 'push' &&
          github.event.head_commit.message == 'fix(v2): one-shot orphan M3U8 source-only recheck'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 900s python v2/orphan_source_only_recheck.py --source-only \
            --report v2/reports/ci/orphan-10-source-only-anonymous.json \
            --sealed v2/reports/ci/orphan-10-new-candidates.sealed
      - name: Upload grouped source service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-service-health-${{ github.run_id }}
          path: |
            v2/reports/ci/source-adapter-batch.log
            v2/reports/source-adapter-service-health.json
            v2/reports/ci/source-recheck-anonymous.json
            v2/reports/ci/orphan-10-source-only-anonymous.json
            v2/reports/ci/orphan-10-new-candidates.sealed
          if-no-files-found: warn
          retention-days: 30
