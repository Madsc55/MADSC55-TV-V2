name: V2 Source Integration Batch
# Read-only grouped source, historical recovery and AV acceptance; protected IBO unchanged.
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/source_integration_gate.py'
      - 'v2/master_engine.py'
      - 'v2/test_master_engine.py'
      # Task ledger and scheduler edits are not live-source changes.
      # Keep the expensive AV workflow restricted to actual scanner inputs.
      - 'v2/orphan_m3u_recovery.py'
      - 'v2/orphan_iptv_org_registry.py'
      - 'v2/orphan_baseline_guard.py'
      - 'v2/historical_targeted_playback.py'
      - 'v2/secure_archive.py'
      - 'v2/traz_api_m3u_bridge.py'
      - 'v2/traz_hls_codec_stability.py'
      - 'v2/test_traz_hls_codec_stability.py'
      - 'v2/traz_gap_crosswalk.py'
      - 'v2/traz_official_feed_variant_gap.py'
      - 'v2/traz_name_leads_real_av.py'
      - 'v2/traz_extra_xmltv_review.py'
      - 'v2/test_traz_extra_xmltv_review.py'
      - 'v2/test_traz_name_leads_real_av.py'
      - 'v2/test_traz_official_feed_variant_gap.py'
      - 'v2/traz_missing_name_xmltv_review.py'
      - 'v2/traz_transient_av_recovery.py'
      - 'v2/test_traz_transient_av_recovery.py'
      - 'v2/test_traz_missing_name_xmltv_review.py'
      - 'v2/test_traz_gap_crosswalk.py'
      - 'v2/traz_combined_private_ibo.py'
      - 'v2/test_traz_combined_private_ibo.py'
      - 'v2/av_verified_sealed_ibo_export.py'
      - 'v2/test_av_verified_sealed_ibo_export.py'
      - 'v2/test_traz_api_m3u_bridge.py'
      - 'v2/tests/test_source_integration_gate.py'
      - 'v2/run_all_discovery.py'
      - 'v2/test_run_all_discovery.py'
      - 'v2/discover.py'
      - 'v2/channel_watchlist.py'
      - 'v2/test_channel_watchlist.py'
      - 'v2/public_source_handoff.py'
      - 'v2/test_public_source_handoff.py'
      - 'v2/source_availability_audit.py'
      - 'v2/test_source_availability_audit.py'
      - 'v2/github_source_discovery.py'
      - 'v2/run_forge_source_discovery.py'
      - 'v2/document_platform_discovery.py'
      - 'v2/run_live_page_discovery.py'
      - 'v2/historical_url_recovery.py'
      - 'v2/test_historical_url_recovery.py'
      - 'v2/historical_inventory_guard.py'
      - 'v2/test_historical_inventory_guard.py'
      - 'v2/archive_acceptance_gate.py'
      - 'v2/test_archive_acceptance_gate.py'
      - 'v2/independent_s3_restore.py'
      - 'v2/test_independent_s3_restore.py'
      - 'v2/official_page_audit_guard.py'
      - 'v2/test_official_page_audit_guard.py'
      - 'v2/reports/official-page-http-audit-20261109.json'
      - 'v2/youtube_discovery.py'
      - 'v2/youtube_official_live_api.py'
      - 'v2/test_platform_verification_batch.py'
      - 'v2/test_source_resilience_batch.py'
      - 'v2/final_batch_acceptance.py'
      - 'v2/test_final_batch_acceptance.py'
      - 'v2/final_worldwide_report_gate.py'
      - 'v2/test_final_worldwide_report_gate.py'
      - 'v2/advisory_channel_identity_bridge.py'
      - 'v2/test_advisory_channel_identity_bridge.py'
      - 'v2/config/sources.json'
      - '.github/workflows/v2-source-integration-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Ordinary pushes run offline acceptance only. Live jobs require manual dispatch
# or a deliberate [run-source-acceptance] commit; never repeat a scan for test edits.
# Serialize expensive AV scans without cancelling an active evidence-producing run.
concurrency:
  group: v2-source-integration-bulk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-source-safety:
    name: All source adapter regressions - no false acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected development IBO snapshot is immutable
        run: test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Install pinned encryption dependency for grouped offline acceptance tests
        run: python -m pip install cryptography==44.0.2
      - name: Run related source and handoff tests in one offline batch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_master_engine \
            test_source_adapters_batch \
            test_advisory_channel_identity_bridge \
            test_public_source_handoff \
            test_source_availability_audit \
            test_document_platform_discovery \
            test_source_inventory_contract \
            test_run_all_discovery \
            test_discovery_offline_regressions \
            test_channel_watchlist \
            test_source_integrity \
            test_source_loss_audit \
            test_live_page_discovery \
            test_run_live_page_discovery \
            test_official_page_audit_guard \
            test_historical_url_recovery \
            test_historical_inventory_guard \
            test_archive_acceptance_gate \
            test_independent_s3_restore \
            test_run_webpage_playlist_discovery \
            test_github_source_approval \
            test_forge_source_review \
            test_source_resilience_batch \
            test_platform_verification_batch \
            test_traz_gap_crosswalk \
            test_traz_official_feed_variant_gap \
            test_traz_name_leads_real_av \
            test_traz_extra_xmltv_review \
            test_traz_missing_name_xmltv_review \
            test_traz_transient_av_recovery \
            test_traz_hls_codec_stability \
            test_traz_api_source_batch \
            test_traz_api_m3u_bridge \
            test_av_verified_sealed_ibo_export \
            test_traz_combined_private_ibo
          PYTHONPATH=v2 python -m unittest -v test_final_batch_acceptance test_final_worldwide_report_gate
          python -m unittest discover -s v2/tests -p 'test_source_integration_gate.py' -v
      - name: Preserve fail-closed status without fabricated live reports
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python - <<'PY'
          import json
          from pathlib import Path
          from source_integration_gate import audit
          result = audit()
          Path('v2/reports/ci/source-handoff-offline.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert result['status'] == 'INCOMPLETE', result
          assert 'INCOMPLETE_ADAPTER_HANDOFF' in result['errors'], result
          assert result['av_verified'] is False
          assert result['ibo_device_verified'] is False
          print('OFFLINE_GUARD_PASS: real source handoff is not claimed without adapter reports')
          PY
      - name: Upload anonymous offline source safety result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-offline-guard-${{ github.run_id }}
          path: v2/reports/ci/source-handoff-offline.json
          if-no-files-found: warn
          retention-days: 30

  live-source-handoff:
    name: Explicit live source reports and acceptance - no IBO playlist writes
    if: >-
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-source-acceptance]'))) &&
      github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' &&
      github.repository == 'Madsc55/MADSC55-TV-V2'
    needs: offline-source-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube source discovery dependency
        run: python -m pip install yt-dlp
      - name: Verify immutable playlist and historical identity baseline
        shell: bash
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Audit 46 active static M3U entrypoints, preserving disabled historical metadata
        run: timeout 900s python v2/source_availability_audit.py --audit-public-sources
      - name: Generate real read-only GitHub and Gist report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: timeout 1200s python v2/github_source_discovery.py
      - name: Generate real public GitLab and Codeberg report
        run: timeout 900s python v2/run_forge_source_discovery.py --scan-public-forges
      - name: Generate official Turkish broadcaster directory and exact missing-name review
        run: |
          timeout 120s python v2/official_sites_discovery.py
          python v2/official_site_gap.py
      - name: Generate approved publisher live-page and playlist-index reports
        run: |
          timeout 600s python v2/run_live_page_discovery.py --scan-approved-live-pages
          timeout 600s python v2/run_webpage_playlist_discovery.py --scan-approved-index-pages
      - name: Generate advisory YouTube source report - not direct stream proof
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 1200s python v2/youtube_discovery.py
      - name: Generate public-document report and actual validated M3U source handoff
        run: timeout 1200s python v2/document_platform_discovery.py --scan-public-documents
      - name: Unified bounded channel search from static, discovered public, archive and live page M3U sources
        shell: bash
        run: >-
          timeout 4500s python v2/discover.py
          --include-original-run60-github-sources
          --include-reviewed-public-source-references
          --include-approved-live-page-indexes
      - name: Require all eleven adapter, official directory and channel-scan reports before source acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p v2/reports/ci
          python v2/source_integration_gate.py --accept-partial-routing | tee v2/reports/ci/source-integration-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("v2/reports/candidates.json").read_text())
          a = json.loads(Path("v2/reports/ci/source-integration-audit.json").read_text())
          assert a["adapter_wiring_valid"] is True, a["errors"]
          assert a["channel_candidate_scan_present"] is True
          assert a["full_av_playback_accepted"] is False
          assert a["av_verified"] is False
          assert a["ibo_device_verified"] is False
          assert len(a["source_families"]) == 13
          assert len(a["source_families"]["scribd_slideshare_internet_archive"]["platforms"]) == 3
          print("SOURCE_ROUTING_WIRED", True)
          print("EXTERNAL_SOURCE_COVERAGE_COMPLETE", a["external_source_coverage_complete"])
          print("DEGRADED_FAMILIES", a["degraded_source_families"])
          print("CHANNEL_SCAN_SOURCE_COUNT", d.get("source_count"))
          print("CHANNEL_SCAN_CANDIDATES", d.get("total_unique_candidates"))
          print("CHANNEL_SCAN_COVERAGE", d.get("coverage_status"))
          print("AV_PLAYBACK_VERIFIED", False)
          print("DEVICE_PLAYBACK_VERIFIED", False)
          PY
      - name: Upload anonymous audit only, never plaintext discovered source URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-integration-audit-${{ github.run_id }}
          path: |
            v2/reports/ci/source-integration-audit.json
            v2/reports/candidates.json
            v2/reports/official-tv-gap.json
            v2/reports/source-availability-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install real AV validation and encrypted evidence dependencies
        run: |
          python -m pip install cryptography==44.0.2
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Grouped AV and encrypted archive offline regressions
        run: |
          PYTHONPATH=v2 python -m unittest -v test_final_batch_acceptance test_final_worldwide_report_gate
      - name: Restore verified anonymous AV evidence when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/reports/ci/prior
          # The historical run can be unfinished, expired, or missing artifacts.
          # In that case do a fresh real AV scan rather than falsely claim reuse.
          if gh run download 42077381839 --repo Madsc55/MADSC55-TV-V2 --name v2-grouped-av-evidence-42077381839 --dir v2/reports/ci/prior; then
            if test -s v2/reports/ci/prior/final-worldwide-acceptance.json && PYTHONPATH=v2 python v2/final_worldwide_report_gate.py --report v2/reports/ci/prior/final-worldwide-acceptance.json --allow-unprobed; then
              echo "Verified prior anonymous evidence; resume enabled"
            else
              rm -f v2/reports/ci/prior/final-worldwide-acceptance.json
              echo "Prior evidence invalid; scan without reuse"
            fi
          else
            echo "Prior evidence unavailable; scan without reuse"
          fi
      - name: Recover latest finished hash-only AV checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/reports/ci/prior
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("v2-av-checkpoint-")) and .workflow_run.id != (env.GITHUB_RUN_ID | tonumber))] | sort_by(.created_at) | reverse | .[0].id // empty' || true)"
          if test -n "$artifact_id"; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id/zip" > /tmp/v2-checkpoint.zip
            unzip -p /tmp/v2-checkpoint.zip final-worldwide-checkpoint.json > v2/reports/ci/prior/final-worldwide-checkpoint.json || true
            if test -s v2/reports/ci/prior/final-worldwide-checkpoint.json; then
              python -m json.tool v2/reports/ci/prior/final-worldwide-checkpoint.json >/dev/null
            fi
          fi
      - name: Real bounded video-plus-audio scan of static, reviewed public and document sources
        shell: bash
        run: |
          set -euo pipefail
          args=(--workers 32 --budget-seconds 14400 --require-public-sources)
          args+=(--checkpoint v2/reports/ci/final-worldwide-checkpoint.json)
          if test -s v2/reports/ci/prior/final-worldwide-checkpoint.json; then
            args+=(--reuse-report v2/reports/ci/prior/final-worldwide-checkpoint.json)
          elif test -s v2/reports/ci/prior/final-worldwide-acceptance.json; then
            args+=(--reuse-report v2/reports/ci/prior/final-worldwide-acceptance.json)
          fi
          timeout 16000s python v2/final_batch_acceptance.py "${args[@]}"
      - name: Require complete AV probe coverage, valid SHA256 evidence and encrypted URL archive
        run: PYTHONPATH=v2 python v2/final_worldwide_report_gate.py --report v2/reports/ci/final-worldwide-acceptance.json
      - name: Crosswalk 4955 immutable historical hashes against accepted worldwide decoded AV
        run: |
          PYTHONPATH=v2 python v2/historical_worldwide_av_crosswalk.py \
            --baseline v2/history/stage3-4955-hash-only.jsonl \
            --worldwide v2/reports/ci/final-worldwide-acceptance.json \
            --out v2/reports/ci/historical-worldwide-av-crosswalk.json
      - name: Upload recoverable hash-only checkpoint after timeout or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-av-checkpoint-${{ github.run_id }}
          path: v2/reports/ci/final-worldwide-checkpoint.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload anonymous AV report and encrypted stream evidence; no plaintext URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-grouped-av-evidence-${{ github.run_id }}
          path: |
            v2/reports/ci/final-worldwide-acceptance.json
            v2/reports/ci/historical-worldwide-av-crosswalk.json
            v2/reports/ci/final-worldwide-*.sealed
          if-no-files-found: warn
          retention-days: 30

  platform-verification-batch:
    name: Public Scribd SlideShare and YouTube live evidence, one grouped run
    if: >-
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-source-acceptance]'))) &&
      github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' &&
      github.repository == 'Madsc55/MADSC55-TV-V2'
    needs: offline-source-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected playlist and immutable historic IDs
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Install public YouTube metadata extractor
        run: python -m pip install yt-dlp
      - name: Discover and verify public YouTube live metadata in one batch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 1200s python v2/youtube_discovery.py
      - name: Inspect indexed and exact public Scribd SlideShare plus Archive documents
        run: timeout 1200s python v2/document_platform_discovery.py --scan-public-documents
      - name: Audit both platforms and preserve anonymous proof without false playback
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python - <<'PY'
          from pathlib import Path
          import json
          y=json.loads(Path("v2/reports/youtube-live-candidates.json").read_text())
          d=json.loads(Path("v2/reports/document-platform-references.json").read_text())
          assert y["policy"]=="ADVISORY_ONLY_NO_PLAYLIST_WRITES_NO_AUTOMATIC_IBO_IMPORT"
          assert y["metadata_unattempted_count"]==0
          assert d["playback_verified"] is False
          assert set(("scribd","slideshare","internet-archive")) <= set(d["platforms"])
          assert d["validated_m3u_source_count"]<=d["source_candidates"]
          assert d["reference_accounting"]["reviewed_references_are_not_playback_evidence"] is True
          assert d["reviewed_public_reference_evidence"]["reviewed_reference_count"] == 4
          assert d["reviewed_public_reference_evidence"]["platforms"]["scribd"]["reviewed_reference_count"] == 2
          assert d["reviewed_public_reference_evidence"]["platforms"]["slideshare"]["reviewed_reference_count"] == 2
          assert d["reference_accounting"]["reviewed_document_historical_url_updates"] == 2
          assert d["reviewed_public_reference_evidence"]["validated_resolved_historical_citations"] <= 2
          assert d["reviewed_public_reference_evidence"]["verified_video_audio"] is False
          assert d["reviewed_public_reference_evidence"]["ibo_device_verified"] is False
          platform={x:{
            "public_queries":d["platforms"][x]["queries"],
            "documents_checked":d["platforms"][x]["documents_checked"],
            "public_m3u_references":d["platforms"][x]["candidate_sources"],
            "source_errors":d["platforms"][x]["errors"]
          } for x in ("scribd","slideshare","internet-archive")}
          report={
            "kind":"V2_PUBLIC_PLATFORM_EVIDENCE_ONLY",
            "youtube_video_candidates":len(y["results"]),
            "youtube_live_metadata_verified":y["live_verified"],
            "youtube_unverified":y["metadata_unverified_count"],
            "youtube_query_errors":len(y["errors"]),
            "youtube_error_classes":y["anonymous_metadata_reason_counts"],
            "youtube_official_api_status":y["official_youtube_api_status"],
            "youtube_official_api_classified":y["official_youtube_api_classified"],
            "youtube_official_live_search_status":y["official_live_search_status"],
            "youtube_official_live_search_new_candidates":y["official_live_search_new_candidates"],
            "youtube_verification_status":y["verification_status"],
            "platforms":platform,
            "document_m3u_source_candidates":d["source_candidates"],
            "document_m3u_sources_parsed":d["validated_m3u_source_count"],
            "document_reference_accounting":d["reference_accounting"],
            "reviewed_document_source_validation":d["reviewed_public_reference_evidence"],
            "av_verified":False,
            "ibo_device_verified":False,
            "playlist_modified":False
          }
          p=Path("v2/reports/ci/platform-verification-anonymous.json")
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload anonymous source status; no video IDs, API key or source URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-platform-verification-${{ github.run_id }}
          path: v2/reports/ci/platform-verification-anonymous.json
          if-no-files-found: warn
          retention-days: 30

  unified-read-only-channel-search:
    name: Unified TR AZ source search - all adapters no IBO writes
    if: >-
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-source-acceptance]'))) &&
      github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' &&
      github.repository == 'Madsc55/MADSC55-TV-V2'
    needs: offline-source-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no production playlist or history changes
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Install public YouTube search dependency
        run: python -m pip install yt-dlp
      - name: Execute all source adapters and centralized TR AZ candidate discovery in order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 10000s python v2/run_all_discovery.py --run-all --source-only
      - name: Cross-check 309 streamless IDs and 344 guide gaps against real M3U and XMLTV sources in one batch
        run: timeout 180s python v2/traz_gap_crosswalk.py
      - name: Review remaining missing identities using exact and unambiguous authoritative names and real XMLTV feeds
        run: timeout 180s python v2/traz_missing_name_xmltv_review.py
      - name: Validate complete adapter wiring and preserve honest incomplete source status
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=v2 python - <<'PY'
          import json
          from pathlib import Path
          from source_integration_gate import audit
          result=audit()
          assert result["adapter_wiring_valid"] is True, result["errors"]
          assert result["channel_candidate_scan_present"] is True
          assert result["av_verified"] is False
