name: V2 Drive Independent Production Restore
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drive-production-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated archive dependencies
        run: python -m pip install 'cryptography>=42,<47'
      - name: Retrieve original Drive archives and authenticate restore
        env:
          DRIVE_TOKEN: ${{ secrets.V2_DRIVE_RESTORE_ACCESS_TOKEN }}
          ORIGINAL_AES_KEY_B64: ${{ secrets.V2_PRODUCTION_AES_KEY_METADATA_B64 }}
          ORIGINAL_RSA_KEY_B64: ${{ secrets.V2_HISTORY_RSA_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,os,pathlib,subprocess,sys,tempfile,urllib.request
          token=os.environ.get('DRIVE_TOKEN','')
          aes=os.environ.get('ORIGINAL_AES_KEY_B64','')
          rsa=os.environ.get('ORIGINAL_RSA_KEY_B64','')
          if not token or not aes or not rsa:
              raise SystemExit('BLOCKED: Drive OAuth token and original production AES/RSA private key secrets must be configured securely')
          expected=[
              ('1nSKpgpkHh_iNihtZBIEqF9YzNpWy6tUJ','production.enc','38db9b094c48e49eb0b5b1234ddc6a109f215d6d9fa732a1a4d0cf592673fe4c'),
              ('1fXVZCHU-3jgcCOf5BNkMMrP35Uegnj9d','stage3.zip','808152d71ae5bc81aaf594e151753272dadcdd3495c9231bb781598bd934a7b3'),
              ('1UrYiXfC74MXWivcBV7reF9xCa_Nk3uWm','orphan.zip','09b71f108e0d6dc59e8b148196725a26deb9f823eab7a231a054807f96a9f58b')]
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)
              for fileid,name,sha in expected:
                  req=urllib.request.Request('https://www.googleapis.com/drive/v3/files/'+fileid+'?alt=media',headers={'Authorization':'Bearer '+token})
                  with urllib.request.urlopen(req,timeout=90) as response:
                      data=response.read(12_000_000)
                  if hashlib.sha256(data).hexdigest()!=sha:
                      raise SystemExit('Independent Google Drive download checksum mismatch: '+name)
                  (p/name).write_bytes(data)
              try:
                  (p/'aes-key.json').write_bytes(base64.b64decode(aes,validate=True))
                  (p/'rsa-key.pem').write_bytes(base64.b64decode(rsa,validate=True))
              except Exception:
                  raise SystemExit('Original key metadata secret encoding invalid')
              cmd=[sys.executable,'v2/verify_drive_sealed_evidence.py','--stage3',str(p/'stage3.zip'),'--orphan',str(p/'orphan.zip'),'--rsa-private-key',str(p/'rsa-key.pem'),'--production-aes',str(p/'production.enc'),'--production-aes-key',str(p/'aes-key.json'),'--production-aes-sha256',expected[0][2]]
              subprocess.run(cmd,check=True)
              print('PASS: independent Drive readback and authenticated original-key production restore')
          PY
