name: Move Turkish backup channels
on:
  push:
    paths:
      - '.github/workflows/move-turkish-backups.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Turkish channels into YENI TURK
        run: python v2/move_turkish_backups.py
      - name: Commit playlist update
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Move Turkish backups into YENI TURK category'
          git push
