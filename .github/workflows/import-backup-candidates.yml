name: Backup candidates import
on:
  push:
    paths:
      - '.github/workflows/import-backup-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download scan results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40758418496 -n unified-private-playback-snapshot -D v2/reports
          gh run download 40758418496 -n turkish-stream-review -D /tmp/scan61\n          cp /tmp/scan61/v2/reports/all-source-playback-aggregate.json v2/reports/
      - name: Prepare backup candidates
        run: python v2/add_scan61_to_backups.py
      - name: Save playlist
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Add verified decoded candidates to backups'
          git push
