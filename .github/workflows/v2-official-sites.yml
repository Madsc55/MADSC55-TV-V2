name: V2 Official Turkish TV Site Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/official_sites_discovery.py'
      - 'v2/official_site_gap.py'
      - '.github/workflows/v2-official-sites.yml'
  schedule:
    - cron: '12 6 * * 1'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m py_compile v2/official_sites_discovery.py
      - name: Discover broadcaster websites
        run: python v2/official_sites_discovery.py
      - name: Compare official sites with existing playlist
        run: python v2/official_site_gap.py
      - name: Save review-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-tv-sites
          path: |
            v2/reports/official-tv-sites.json
            v2/reports/official-tv-gap.json
          if-no-files-found: ignore
