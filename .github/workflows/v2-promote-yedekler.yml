name: V2 One-Time YEDEKLER Promotion
on:
  push:
    paths:
      - '.github/workflows/v2-promote-yedekler.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier
        run: python -m pip install "yt-dlp>=2026.1"
      - name: Ensure ffprobe
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Discover and decode candidates
        run: python3 v2/turkish_tv_health.py
      - name: Promote only verified Turkish candidates, preserving originals
        run: python3 v2/promote_yedekler.py
      - name: Commit playlist update
        run: |
          git config user.name "madsc55-v2-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git diff --cached --check
          git commit -m "feat: add decoder-verified Turkish streams to YEDEKLER preserving original two"
          git push
