name: V2 TR AZ Private IBO Test Export Grouped Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grouped-private-ibo-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptographic evidence parser
        run: python -m pip install cryptography==44.0.2
      - name: Keep protected main IBO and historical identity bytes immutable
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Test real dual AV positive and negative evidence plus private IBO export as one batch
        run: |
          python -m compileall -q v2
          PYTHONPATH=v2 python -m unittest -v test_traz_api_source_batch test_traz_api_av_batch test_export_traz_verified_ibo test_run_all_discovery
