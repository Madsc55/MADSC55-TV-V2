name: Build clean 838 IBO playlist
on:
  pull_request:
    paths:
      - 'v2/tools/build_clean_ibo_838.py'
      - '.github/workflows/build-clean-ibo-838.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Create clean playlist
        run: python3 v2/tools/build_clean_ibo_838.py
      - name: Commit clean playlist to dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MADSC55_TV_IBO_TEMIZ_838.m3u8
          if ! git diff --cached --quiet; then
            git commit -m "Generate clean 838-channel IBO playlist"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Upload clean playlist
        uses: actions/upload-artifact@v4
        with:
          name: clean-ibo-838
          path: MADSC55_TV_IBO_TEMIZ_838.m3u8
          retention-days: 30
