name: V2 Stage 5 Real History & Orphan Archive Final Acceptance
on:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - 'v2/production_real_url_archive.py'
      - 'v2/production_full_stage5_archive.py'
      - 'v2/test_production_stage5_archive.py'
      - 'v2/history/stage5-production-acceptance-20261103.json'
      - '.github/workflows/v2-stage5-final-production-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage5-batch:
    name: All archive acceptance, history and orphan immutable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Install pinned encryption dependency
        run: python -m pip install cryptography==44.0.2
      - name: Confirm protected main playlist blob
        run: test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Execute all Stage 5 archive security regressions in ONE batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python -m unittest -v \
            test_production_stage5_archive \
            test_durable_evidence_archive \
            test_archive_acceptance_gate \
            test_archive_backup_restore_drill \
            test_encrypted_archive \
            test_restore_evidence_safety \
            test_independent_s3_restore \
            test_stage3_archive_lineage \
            test_stage3_immutable_history \
            test_offsite_sealed_evidence \
            test_orphan_baseline_guard \
            2>&1 | tee v2/reports/ci/stage5-final-archive-regressions.log
      - name: Pin external AES production-restore evidence without publishing private key
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('v2/history/stage5-production-acceptance-20261103.json').read_text())
          assert v['status']=='STAGE5_ENCRYPTED_ARCHIVE_PRODUCTION_ACCEPTED'
          assert v['archive_sha256']=='38db9b094c48e49eb0b5b1234ddc6a109f215d6d9fa732a1a4d0cf592673fe4c'
          assert v['historical_original_real_url_records']==4955
          assert v['orphan_historically_proven_real_url_records']==107
          assert v['private_rsa_decryption_completed_for_real_4955_and_107']
          assert v['private_aes_decryption_from_independent_persistent_storage_completed']
          assert not v['IBO_player_device_playback_verified']
          assert not v['overall_live_stream_production_accepted']
          print('PASS: independently authenticated private 4955+107 archive evidence is pinned; no key in public repo')
          print('NOT CLAIMED: live device playback or newly verified stream audio/video')
          PY
      - name: Upload grouped tests and acceptance log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-stage5-final-archive-${{ github.run_id }}
          path: v2/reports/ci/stage5-final-archive-regressions.log
          retention-days: 30
          if-no-files-found: warn
