name: V2 IBO Package Infrastructure Offline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/ibo_package_acceptance.py'
      - 'v2/test_ibo_package_acceptance.py'
      - 'v2/ibo_final_acceptance.py'
      - 'v2/test_ibo_final_acceptance.py'
      - '.github/workflows/v2-ibo-package-infrastructure.yml'
  push:
    paths:
      - 'v2/ibo_package_acceptance.py'
      - 'v2/test_ibo_package_acceptance.py'
      - 'v2/ibo_final_acceptance.py'
      - 'v2/test_ibo_final_acceptance.py'
      - '.github/workflows/v2-ibo-package-infrastructure.yml'
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive crypto dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile and offline regression
        run: |
          python -m py_compile v2/ibo_package_acceptance.py v2/test_ibo_package_acceptance.py v2/ibo_final_acceptance.py v2/test_ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
