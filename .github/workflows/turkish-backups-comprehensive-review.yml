name: YEDEKLER comprehensive Turkish audit (read only)
on:
  push:
    branches:
      - audit/turkish-backups-comprehensive-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit Turkish candidates without changing playlists
        run: |
          python v2/audit_turkish_backups_comprehensive.py
          python - <<'PY'
          import json
          p='v2/reports/turkish-backups-comprehensive.json'
          r=json.load(open(p))
          print('TOTAL',r['total_entries'],'BACKUPS',r['backup_entries'])
          print('STRONG',r['strong_candidates'],'REVIEW',r['review_candidates'])
          for f in r['findings']:
              print(f['level'],f['entry_index'],f['name'],','.join(f['reasons']))
          PY
      - name: Save review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-backups-comprehensive-review
          path: v2/reports/turkish-backups-comprehensive.json
          if-no-files-found: warn
