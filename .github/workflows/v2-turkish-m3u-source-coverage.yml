name: V2 Turkish M3U Source Coverage and Historical Loss
on:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - 'v2/source_loss_audit.py'
      - 'v2/test_source_loss_audit.py'
      - 'v2/turkish_m3u_source_audit.py'
      - 'v2/test_turkish_m3u_source_audit.py'
      - 'v2/config/sources.json'
      - 'v2/source_failover.py'
      - 'v2/test_source_failover.py'
      - 'v2/discover.py'
      - 'v2/m3u_source_content_audit.py'
      - 'v2/test_m3u_source_content_audit.py'
      - 'v2/history/run60-dynamic-source-ledger.json'
      - 'v2/run60_source_ledger.py'
      - 'v2/test_run60_source_ledger.py'
      - 'v2/test_run60_source_discovery.py'
      - 'v2/historical_exact_real_av.py'
      - 'v2/test_historical_exact_real_av.py'
      - 'v2/historical_world_av_bridge.py'
      - 'v2/test_historical_world_av_bridge.py'
      - 'v2/orphan_world_av_bridge.py'
      - 'v2/test_orphan_world_av_bridge.py'
      - '.github/workflows/v2-world-discovery.yml'
      - '.github/workflows/v2-turkish-m3u-source-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  turkish-m3u-loss-batch:
    name: Turkish M3U source-only audit, genuine 60/72 loss and grouped regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encrypted-evidence and FFmpeg acceptance dependency
        run: python -m pip install cryptography==44.0.2
      - name: Protect immutable IBO playlist and all 4955 historical URL identities
        shell: bash
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Batch source losses, source integrity, failover and audit regressions
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_source_loss_audit \
            test_turkish_m3u_source_audit \
            test_m3u_source_content_audit \
            test_run60_source_ledger \
            test_run60_source_discovery \
            test_source_integrity \
            test_source_failover \
            test_source_availability_audit \
            test_source_inventory_contract \
            test_historical_targeted_playback \
            test_historical_exact_real_av \
            test_historical_world_av_bridge \
            test_orphan_world_av_bridge \
            2>&1 | tee v2/reports/ci/turkish-m3u-loss-tests.log
      - name: Download real #60 and #72 aggregate evidence without scanning channel streams
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/madsc-60" "$RUNNER_TEMP/madsc-72"
          gh run download 40743765437 -n turkish-stream-review -D "$RUNNER_TEMP/madsc-60"
          gh run download 40743765437 -n unified-source-snapshot -D "$RUNNER_TEMP/madsc-60"
          gh run download 40948768782 -n turkish-stream-review -D "$RUNNER_TEMP/madsc-72"
      - name: Verify original 4955 URL hash losses and full M3U source content coverage
        shell: bash
        run: |
          PYTHONPATH=v2 python v2/turkish_m3u_source_audit.py \
            --sources v2/config/sources.json \
            --workers 8 \
            --audit-full-source-content \
            --historical-dynamic-ledger v2/history/run60-dynamic-source-ledger.json \
            --run60-source-snapshot "$RUNNER_TEMP/madsc-60/github-source-discovery.json" \
            --historical-old "$RUNNER_TEMP/madsc-60/v2/reports/all-source-playback-aggregate.json" \
            --historical-new "$RUNNER_TEMP/madsc-72/v2/reports/all-source-playback-aggregate.json" \
            --baseline v2/history/stage3-4955-hash-only.jsonl \
            --output v2/reports/ci/turkish-m3u-source-loss.json
      - name: Probe the exact historical URL hashes still absent from all 63 current M3U source feeds
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          timeout 900s python v2/historical_targeted_playback.py \
            --missing-report v2/reports/ci/turkish-m3u-source-loss.json \
            --baseline v2/history/stage3-4955-hash-only.jsonl \
            --output v2/reports/ci/historical-current-missing-ffprobe-anonymous.json
          python - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path("v2/reports/ci/turkish-m3u-source-loss.json").read_text())
          probe=json.loads(Path("v2/reports/ci/historical-current-missing-ffprobe-anonymous.json").read_text())
          sample=full["source_content_audit"]["historical_identifiers_absent_sha256_sample"]
          assert len(sample)==full["source_content_audit"]["historical_identifiers_absent_from_current_sources"]
          assert probe["requested_historical_url_sha256"]==len(sample)
          assert probe["exact_git_history_urls_recovered"]+probe["not_found_in_git_history_count"]==len(sample)
          assert probe["no_plaintext_stream_urls"]
          assert probe["main_playlist_modified"] is False and probe["ibo_device_verified"] is False
          print("HISTORICAL_EXACT_CURRENT_MISSING",json.dumps({
            "missing_hashes":len(sample),
            "actual_exact_git_urls":probe["exact_git_history_urls_recovered"],
            "unrecoverable_from_local_history":probe["not_found_in_git_history_count"],
            "ffprobe_statuses":probe["status_counts"]},sort_keys=True))
          PY
      - name: Verify actual one-second video and audio decoding of all exact recovered historical URLs in one batch
        shell: bash
        run: |
          command -v ffprobe
          command -v ffmpeg
          timeout 900s python v2/historical_exact_real_av.py --real-av-batch \
            --missing-report v2/reports/ci/turkish-m3u-source-loss.json \
            --baseline v2/history/stage3-4955-hash-only.jsonl \
            --output v2/reports/ci/historical-current-missing-real-ffmpeg-anonymous.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("v2/reports/ci/historical-current-missing-ffprobe-anonymous.json").read_text())
          b=json.loads(Path("v2/reports/ci/historical-current-missing-real-ffmpeg-anonymous.json").read_text())
          assert a["requested_historical_url_sha256"]==b["original_historical_url_hashes_requested"]
          assert a["exact_git_history_urls_recovered"]==b["exact_git_history_url_hashes_found"]
          assert b["no_plaintext_urls"] and b["protected_playlist_modified"] is False
          assert b["ibo_device_verified"] is False
          assert b["current_real_ffmpeg_video_audio_decoded_count"]<=b["ffprobe_video_audio_both_streams_count"]
          print("HISTORICAL_CURRENT_REAL_AV_ACCEPTANCE",json.dumps({
            "requested":b["original_historical_url_hashes_requested"],
            "real_ffmpeg_decoded":b["current_real_ffmpeg_video_audio_decoded_count"],
            "unverified":b["url_hashes_unverified_after_real_probe"]},sort_keys=True))
          PY
      - name: Reconcile all 4955 immutable URL hashes with the earlier 33657-stream real FFmpeg worldwide proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/madsc-world"
          gh run download 41715476184 -n v2-final-worldwide-acceptance-41715476184 -D "$RUNNER_TEMP/madsc-world"
          python v2/historical_world_av_bridge.py \
            --prior-world-report "$RUNNER_TEMP/madsc-world/final-worldwide-acceptance.json" \
            --current-source-report v2/reports/ci/turkish-m3u-source-loss.json \
            --historical-baseline v2/history/stage3-4955-hash-only.jsonl \
            --output v2/reports/ci/historical-4955-prior-world-av-anonymous.json
      - name: Bridge exact orphan 50 SHA evidence with 33,657-world prior real FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/madsc-orphan"
          gh run download 42005831377 -n v2-three-source-orphan-evidence-42005831377 -D "$RUNNER_TEMP/madsc-orphan"
          python v2/orphan_world_av_bridge.py \
            --current-orphan "$RUNNER_TEMP/madsc-orphan/ci/three-source-orphan-anonymous.json" \
            --previous-world "$RUNNER_TEMP/madsc-world/final-worldwide-acceptance.json" \
            --output v2/reports/ci/orphan-50-prior-world-anonymous.json
      - name: Upload single grouped evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-m3u-source-loss-${{ github.run_id }}
          path: |
            v2/reports/ci/turkish-m3u-loss-tests.log
            v2/reports/ci/turkish-m3u-source-loss.json
            v2/reports/ci/historical-current-missing-ffprobe-anonymous.json
            v2/reports/ci/historical-current-missing-real-ffmpeg-anonymous.json
            v2/reports/ci/historical-4955-prior-world-av-anonymous.json
            v2/reports/ci/orphan-50-prior-world-anonymous.json
          if-no-files-found: warn
          retention-days: 30

  orphan-50-pinned-main-batch:
    name: 50 original orphan identities - pinned 876 plus 3964 source and real AV
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted evidence dependency and real FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install cryptography==44.0.2
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
          command -v ffmpeg
      - name: Verify protected playlist and historical inventory without writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Grouped orphan, original snapshots, exact SHA and AV acceptance regressions
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_main_playlist_candidate_bridge \
            test_orphan_m3u_recovery \
            test_orphan_resolution_gate \
            test_orphan_workflow_wiring \
            test_orphan_world_av_bridge \
            test_orphan_source_only_recheck \
            test_orphan_targeted_github_code \
            test_orphan_iptv_org_registry \
            test_source_adapters_batch \
            test_document_platform_discovery \
            test_orphan_baseline_guard \
            test_historical_exact_real_av \
            2>&1 | tee v2/reports/ci/orphan-50-pinned-main-regressions.log
      - name: Read original main and 3964 foreign records by exact immutable blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orphan-pinned-sources"
          if ! git cat-file blob 165c726cd9211f9f51c31f1c718e0911bab79e1b > "$RUNNER_TEMP/orphan-pinned-sources/main-876.m3u8" 2>/dev/null; then
            gh api repos/Madsc55/MADSC55-TV-V2/git/blobs/165c726cd9211f9f51c31f1c718e0911bab79e1b --jq .content | base64 --decode > "$RUNNER_TEMP/orphan-pinned-sources/main-876.m3u8"
          fi
          if ! git cat-file blob c54272e97f711c3074303cec74739d6d0ec806b2 > "$RUNNER_TEMP/orphan-pinned-sources/foreign-3964.m3u8" 2>/dev/null; then
            gh api repos/Madsc55/MADSC55-TV-V2/git/blobs/c54272e97f711c3074303cec74739d6d0ec806b2 --jq .content | base64 --decode > "$RUNNER_TEMP/orphan-pinned-sources/foreign-3964.m3u8"
          fi
          PYTHONPATH=v2 python - <<'PY'
          import os
          from pathlib import Path
          from main_playlist_candidate_bridge import validated_v2_main_catalog
          d=Path(os.environ["RUNNER_TEMP"])/"orphan-pinned-sources"
          _,report=validated_v2_main_catalog(d/"main-876.m3u8",d/"foreign-3964.m3u8")
          assert report["immutable_blobs_verified"] and report["playlist_modified"] is False
          print("ORPHAN_PINNED_SOURCE_CONTRACT",{
            k:report[k] for k in ("active_main_channels","active_yedekler",
             "fixed_anchor_channels","separate_archived_yabancilar")})
          PY
      - name: One grouped public source discovery, no playlist writes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 240s python v2/document_platform_discovery.py --scan-public-documents
          timeout 240s env PYTHONPATH=v2 python v2/github_source_discovery.py
          timeout 240s env PYTHONPATH=v2 python v2/run_forge_source_discovery.py --scan-public-forges
      - name: Probe all original 50 identities against pinned snapshots and public sources using FFprobe and FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python v2/orphan_m3u_recovery.py \
            --history-revisions 300 \
            --v2-main-playlist-snapshot "$RUNNER_TEMP/orphan-pinned-sources/main-876.m3u8" \
            --v2-main-foreign-archive-snapshot "$RUNNER_TEMP/orphan-pinned-sources/foreign-3964.m3u8" \
            --include-public-discovery \
            --include-targeted-code-search \
            --include-public-registry \
            --public-key v2/config/stage3_transit_public.pem \
            --report v2/reports/ci/orphan-50-pinned-main-anonymous.json \
            --sealed v2/reports/ci/orphan-50-pinned-main-av.sealed \
            --all-candidates-sealed v2/reports/ci/orphan-50-pinned-main-all-candidates.sealed \
            --immutable-orphan-baseline v2/history/m3u-orphan-50-hash-baseline.json
      - name: Strict 50-channel FFmpeg AV acceptance - fail if any are unverified
        shell: bash
        run: |
          PYTHONPATH=v2 python v2/orphan_resolution_gate.py \
            --report v2/reports/ci/orphan-50-pinned-main-anonymous.json \
            --output v2/reports/ci/orphan-50-pinned-main-resolution.json
      - name: Always preserve anonymous results and encrypted real URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphan-50-pinned-main-evidence-${{ github.run_id }}
          path: |
            v2/reports/ci/orphan-50-pinned-main-regressions.log
            v2/reports/ci/orphan-50-pinned-main-anonymous.json
            v2/reports/ci/orphan-50-pinned-main-resolution.json
            v2/reports/ci/orphan-50-pinned-main-av.sealed
            v2/reports/ci/orphan-50-pinned-main-all-candidates.sealed
            v2/reports/document-platform-references.json
          if-no-files-found: warn
          retention-days: 30
