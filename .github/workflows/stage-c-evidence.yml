name: Stage C evidence gate checks
on:
  pull_request:
    paths:
      - 'v2/scripts/verify_stage_c_evidence.py'
      - 'v2/scripts/test_verify_stage_c_evidence.py'
      - '.github/workflows/stage-c-evidence.yml'
  workflow_dispatch:
jobs:
  verify-stage-c-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run negative evidence-gate regression tests
        run: python -m unittest -v v2/scripts/test_verify_stage_c_evidence.py
      - name: Missing real evidence must fail closed
        run: |
          mkdir -p /tmp/stage-c-empty
          if python v2/scripts/verify_stage_c_evidence.py --evidence-dir /tmp/stage-c-empty; then
            echo 'ERROR: missing evidence accepted'
            exit 1
          fi
          echo 'Missing real evidence correctly rejected; no task state changes.'
