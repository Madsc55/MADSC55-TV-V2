name: V2 YEDEKLER Verified Logos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-yedekler-logos.yml'
  schedule:
    - cron: '41 5 * * 0'
permissions:
  contents: write
concurrency:
  group: v2-yedekler-logos
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify playlist before changes
        run: python3 v2/test_playlist_invariants.py
      - name: Resolve real logos from channel metadata
        run: python3 v2/enrich_yedekler_logos.py
      - name: Verify playlist after changes
        run: python3 v2/test_playlist_invariants.py
      - name: Commit only validated logo metadata
        shell: bash
        run: |
          set -euo pipefail
          target="MADSC55_TV_IBO_CALISANLAR_TEST.m3u8"
          if git diff --quiet -- "$target"; then
            echo "No new verified logos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git commit -m "Add verified YEDEKLER channel logos"
          git push origin HEAD:main
