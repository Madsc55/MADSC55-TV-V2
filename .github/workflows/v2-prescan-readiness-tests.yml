name: V2 Pre-scan Readiness Unit Tests

on:
  pull_request:
    paths:
      - 'v2/prescan_readiness_gate.py'
      - 'v2/test_prescan_readiness_gate.py'
      - '.github/workflows/v2-prescan-readiness-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline gate unit tests (no discovery or playlist writes)
        run: python -m unittest discover -s v2 -p 'test_prescan_readiness_gate.py' -v
