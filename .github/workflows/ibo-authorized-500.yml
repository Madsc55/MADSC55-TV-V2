name: One-time authorized IBO 1000 YEDEKLER transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ibo-authorized-500.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14136864383/zip" -o /tmp/scan.zip
          unzip -p /tmp/scan.zip IBO_YENI_ADAYLAR_PART1.m3u8 > /tmp/candidates.m3u8
      - name: Add 1000 unique candidates only to YEDEKLER
        run: |
          python3 v2/import_scan_backup_batch.py --source /tmp/candidates.m3u8 --count 1000
          python3 v2/test_playlist_invariants.py
          python3 v2/main_actions_security_gate.py
      - name: Create protected-branch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b ibo-1000-import-${{ github.run_id }}
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/test_playlist_invariants.py v2/ibo_authorized_change.json
          git commit -m 'Append 1000 scan candidates to IBO YEDEKLER'
          git push -u origin HEAD
          gh pr create --base main --head ibo-500-import-${{ github.run_id }} --title 'IBO: Append 1000 new YEDEKLER candidates' --body 'Preserve 838 protected channels and 285 existing YEDEKLER entries; append 1000 unique untested candidates.'
