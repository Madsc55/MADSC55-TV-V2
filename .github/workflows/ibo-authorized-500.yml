name: One-time authorized IBO earlier scan remainder transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ibo-authorized-500.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14136864383/zip" -o /tmp/scan.zip
          unzip -p /tmp/scan.zip IBO_YENI_ADAYLAR_PART1.m3u8 > /tmp/candidates.m3u8
      - name: Extract all scan candidates and import legacy archive
        run: |
          mkdir -p /tmp/all-scan
          unzip -j /tmp/scan.zip 'IBO_YENI_ADAYLAR*.m3u8' -d /tmp/all-scan
          mkdir -p /tmp/all-scan/earlier
          curl -fLsS --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14033805492/zip" -o /tmp/earlier-scan.zip
          unzip -j /tmp/earlier-scan.zip 'IBO_YENI_ADAYLAR*.m3u8' -d /tmp/all-scan/earlier
          python3 v2/import_all_available_candidates.py --scan-dir /tmp/all-scan
          python3 v2/test_playlist_invariants.py
          python3 v2/main_actions_security_gate.py
      - name: Create protected-branch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b ibo-earlier-import-${{ github.run_id }}
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/test_playlist_invariants.py v2/ibo_authorized_change.json
          git commit -m 'Import all accessible scan and legacy candidates to YEDEKLER'
          git push -u origin HEAD
          gh pr create --base main --head ibo-1000-import-${{ github.run_id }} --title 'IBO: Import all remaining accessible YEDEKLER candidates' --body 'Preserve 838 protected channels and 1285 existing backups; exclude archived and duplicate URLs; import all accessible scan and legacy candidates.'
