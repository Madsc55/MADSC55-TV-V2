name: One-time authorized IBO complete old and V2 archives transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ibo-authorized-500.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@v4
      - name: Download scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14136864383/zip" -o /tmp/scan.zip
          unzip -l /tmp/scan.zip | tail -n 5
      - name: Extract all scan candidates and import legacy archive
        run: |
          mkdir -p /tmp/all-scan
          unzip -j -o /tmp/scan.zip 'IBO_YENI_ADAYLAR*.m3u8' -d /tmp/all-scan || echo 'Latest scan artifact contains no matching playlist'
          mkdir -p /tmp/all-scan/earlier
          curl -fLsS --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14033805492/zip" -o /tmp/earlier-scan.zip
          unzip -j -o /tmp/earlier-scan.zip 'IBO_YENI_ADAYLAR*.m3u8' -d /tmp/all-scan/earlier || echo 'Earlier scan artifact contains no matching playlist'
          if ! git clone --depth 1 https://github.com/Madsc55/madsc-tv.git /tmp/old-madsc-tv; then
            echo 'Legacy repository unavailable; preserving current V2 and scan imports'
            mkdir -p /tmp/old-madsc-tv
          fi
          test -d /tmp/old-madsc-tv
          find /tmp/all-scan -type f -name '*.m3u8' -printf '%p %s bytes\n'
          python3 v2/import_every_archive_both_systems.py --old-repo /tmp/old-madsc-tv --scan-dir /tmp/all-scan
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 v2/test_playlist_invariants.py
          python3 v2/main_actions_security_gate.py
      - name: Create protected-branch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b ibo-every-archive-import-${{ github.run_id }}
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/test_playlist_invariants.py v2/ibo_authorized_change.json
          if git diff --cached --quiet; then
            echo 'All accessible channel URLs already imported; no new PR needed.'
            exit 0
          fi
          git commit -m 'Import all accessible scan and legacy candidates to YEDEKLER'
          git push -u origin HEAD
          echo 'Branch pushed; pull request is created by authorized maintainer after CI review.'
