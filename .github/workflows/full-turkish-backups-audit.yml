name: Full Turkish backups audit (production writer suspended)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-read-only-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected IBO playlist without changing it
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = "4b1c3cea4b5107a425abab60f62d41f9f81e05a7"
          python v2/test_playlist_invariants.py
          echo "Production publisher is suspended: read-only token, no git writes, no automatic triggers."
