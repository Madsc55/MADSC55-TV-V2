name: Full Turkish backups audit
on:
  push:
    paths:
      - '.github/workflows/full-turkish-backups-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all remaining backup channel records
        run: python v2/turkish_backups_full_audit.py
      - name: Commit audited playlist
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Classify remaining identified Turkish backup stations'
          git push
