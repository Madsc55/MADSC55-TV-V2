name: V2 Stage 4 Acceptance Gate Regression (NOT production acceptance)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/stage4_acceptance_gate.py'
      - 'v2/test_stage4_acceptance_gate.py'
      - '.github/workflows/v2-stage4-gate.yml'
permissions:
  contents: read
jobs:
  gate-regression-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check gate syntax
        run: python -m py_compile v2/stage4_acceptance_gate.py v2/test_stage4_acceptance_gate.py
      - name: Verify missing evidence blocks acceptance
        run: python v2/test_stage4_acceptance_gate.py
