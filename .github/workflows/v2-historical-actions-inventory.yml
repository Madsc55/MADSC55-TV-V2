name: Historical Actions Artifact Inventory
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Inventory both repositories (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,csv,json,time,urllib.request,urllib.error,pathlib
          root=pathlib.Path("historical-actions-inventory");root.mkdir(exist_ok=True)
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429,500,502,503,504) and attempt<4:
                          time.sleep(2**attempt*3);continue
                      raise
          def pages(url,key):
              page=1
              while True:
                  data=get(url+("&" if "?" in url else "?")+f"per_page=100&page={page}")
                  rows=data.get(key,[])
                  for row in rows: yield row
                  if len(rows)<100: break
                  page+=1
          runs=[];artifacts=[];errors=[]
          for repo in ("Madsc55/madsc-tv","Madsc55/MADSC55-TV-V2"):
              api=f"https://api.github.com/repos/{repo}/actions"
              try:
                  for run in pages(api+"/runs","workflow_runs"):
                      runs.append({"repo":repo,"run_id":run["id"],"name":run.get("name"),"status":run.get("status"),"conclusion":run.get("conclusion"),"created_at":run.get("created_at"),"url":run.get("html_url")})
                      try:
                          for a in pages(api+f"/runs/{run['id']}/artifacts","artifacts"):
                              artifacts.append({"repo":repo,"run_id":run["id"],"artifact_id":a["id"],"name":a.get("name"),"size_in_bytes":a.get("size_in_bytes"),"expired":a.get("expired"),"created_at":a.get("created_at"),"expires_at":a.get("expires_at"),"digest":a.get("digest")})
                      except Exception as e: errors.append({"repo":repo,"run_id":run["id"],"error":str(e)})
              except Exception as e: errors.append({"repo":repo,"run_id":"","error":str(e)})
          for name,rows,fields in [
              ("runs.csv",runs,["repo","run_id","name","status","conclusion","created_at","url"]),
              ("artifacts.csv",artifacts,["repo","run_id","artifact_id","name","size_in_bytes","expired","created_at","expires_at","digest"]),
              ("errors.csv",errors,["repo","run_id","error"])]:
              with (root/name).open("w",newline="",encoding="utf-8") as f:
                  writer=csv.DictWriter(f,fieldnames=fields);writer.writeheader();writer.writerows(rows)
          (root/"summary.json").write_text(json.dumps({"runs":len(runs),"artifacts":len(artifacts),"expired":sum(a["expired"] is True for a in artifacts),"errors":len(errors)},indent=2))
          print((root/"summary.json").read_text())
          if errors: raise SystemExit("Partial inventory: inspect errors.csv")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-actions-inventory
          path: historical-actions-inventory/
          retention-days: 30
