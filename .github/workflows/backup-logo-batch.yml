name: YEDEKLER batch original logo discovery
on:
  push:
    branches:
      - fix/backup-original-logos-20261117
    paths:
      - scripts/backup_logo_batch_iptvorg.py
      - .github/workflows/backup-logo-batch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backup-original-logos-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match and validate original logos
        run: python scripts/backup_logo_batch_iptvorg.py
      - name: Commit batch results on PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 backup_logo_report.json
          if ! git diff --cached --quiet; then
            git commit -m "YEDEKLER: apply verified batch original logos"
            git push origin HEAD:fix/backup-original-logos-20261117
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backup-logo-report
          path: backup_logo_report.json
