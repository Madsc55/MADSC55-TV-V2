name: Turkish backups fourth audit
on:
  push:
    paths:
      - '.github/workflows/turkish-backups-fourth-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move remaining regional Turkish stations
        run: python v2/turkish_backups_fourth_pass.py
      - name: Save category counts
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Move regional Turkish channels from backups'
          git push
