name: V2 Worldwide Channel Discovery (read-only)
# No development-branch auto-discovery before the final user-authorized scan.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover without changing playlist
        run: python v2/discover.py --include-original-run60-github-sources
      - name: Print failed source identifiers from discovery report
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v2/reports/candidates.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('FAILED_SOURCE_AUDIT',json.dumps(d.get('errors',[]),ensure_ascii=False))
          PY
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-channel-candidates
          path: v2/reports/candidates.json
          if-no-files-found: warn
          retention-days: 14
