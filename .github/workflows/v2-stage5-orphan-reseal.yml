name: V2 Stage5 Orphan 107 Independent RSA Re-Seal
on:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - '.github/workflows/v2-stage5-orphan-reseal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-sources-one-batch:
    name: Four verified sources, deduped broken records; grouped tests and AV audit
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption dependency and FFprobe
        run: |
          python -m pip install cryptography==44.0.2
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Protect immutable IBO playlist and existing historical metadata
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: One grouped orphan, exact history and source preservation regression suite
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_orphan_m3u_recovery \
            test_orphan_baseline_guard \
            test_m3u_source_content_audit \
            test_historical_targeted_playback \
            test_run60_source_ledger \
            test_run60_source_discovery \
            test_source_loss_audit \
            test_turkish_m3u_source_audit \
            2>&1 | tee v2/reports/ci/three-source-orphan-regressions.log
      - name: Compare four original M3U sources, immutable orphan identities, and known historical feeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=v2 python v2/orphan_m3u_recovery.py \
            --history-revisions 300 \
            --public-key v2/config/stage5_recovery_public.pem \
            --report v2/reports/ci/three-source-orphan-anonymous.json \
            --sealed v2/reports/ci/three-source-av-verified.sealed \
            --all-candidates-sealed v2/reports/ci/three-source-all-historical-candidates.sealed \
            --immutable-orphan-baseline v2/history/m3u-orphan-50-hash-baseline.json
      - name: Require exactly 107 historical URL candidate proofs and 55 original broken occurrences
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('v2/reports/ci/three-source-orphan-anonymous.json')
          result=json.loads(p.read_text(encoding='utf-8'))
          assert result['orphan_entries']==55
          assert result['unique_orphan_metadata_identities']==50
          assert result['all_proven_url_candidates_sealed_for_future_retest']==107
          print('PASS: 107 original RSA-sealed URL candidates and 55/50 immutable orphan identities')
          PY
      - name: Upload anonymized evidence and RSA-encrypted verified plus unverified URL candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-stage5-107-orphan-resealed-${{ github.run_id }}
          path: |
            v2/reports/ci/three-source-orphan-anonymous.json
            v2/reports/ci/three-source-av-verified.sealed
            v2/reports/ci/three-source-all-historical-candidates.sealed
            v2/reports/ci/three-source-orphan-regressions.log
          if-no-files-found: warn
          retention-days: 30
