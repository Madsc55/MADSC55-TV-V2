name: Manual 685 archive move PR publisher
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  preview-685:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download historical 685 identity manifest
        uses: actions/download-artifact@v4
        with:
          name: v2-497-existing-audit-preview
          run-id: 44842556117
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/move-685
      - name: Generate proposed playlist in temporary directory only
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/move-685/output"
          cp MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 "${RUNNER_TEMP}/move-685/output/"
          python3 v2/unlock_and_move_685.py \
            --playlist "${RUNNER_TEMP}/move-685/output/MADSC55_TV_IBO_CALISANLAR_TEST.m3u8" \
            --manifest "${RUNNER_TEMP}/move-685/manifest.json" \
            --report "${RUNNER_TEMP}/move-685/output/move-685-report.json"
          git diff --exit-code -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
      - name: Publish proposed playlist and move report
        uses: actions/upload-artifact@v4
        with:
          name: move-685-playlist-preview
          path: ${{ runner.temp }}/move-685/output/
          if-no-files-found: error
      - name: Open reviewed 685 migration PR (never write main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="owner/685-archive-move-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          cp "${RUNNER_TEMP}/move-685/output/MADSC55_TV_IBO_CALISANLAR_TEST.m3u8" MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git add -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m "Move exact 685 historical YEDEKLER entries to ANA ARŞİV"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Move verified 685 historical entries to ANA ARŞİV" \
            --body "Generated from immutable historical manifest by manual workflow. 685 exact identities moved, total 18,337 retained. Review Offline CI and Production Security Gate before merge. Source run: ${GITHUB_RUN_ID}."
