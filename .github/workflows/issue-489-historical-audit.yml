name: Issue 489 historical inventory audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare historical and current inventories without changing playlists
        run: python3 v2/audit_489_historical_inventory.py --report issue-489-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue-489-inventory-audit
          path: issue-489-audit.json
          retention-days: 7
