name: V2 Independent EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'
permissions:
  contents: write
concurrency:
  group: v2-epg-publish
  cancel-in-progress: false
jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate independent V2 EPG
        run: python v2/build_epg.py
      - name: Publish only validated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add madsc-epg.xml v2/epg-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh V2 XMLTV guide"
            git push
          fi
