name: V2 Stage 3 Real Historical 4955 Evidence
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/real_historical_stage3.py'
      - 'v2/test_real_historical_stage3.py'
      - '.github/workflows/v2-stage3-real-history.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-real-data-batch:
    name: Real #60 vs #72 hash-only recovery plus Stage 3 grouped regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned archive dependency for offline regression suite
        run: python -m pip install cryptography==44.0.2
      - name: Protect original main IBO playlist
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Run one grouped historical archive, dedup and TR/AZ regression batch
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_real_historical_stage3 \
            test_historical_inventory_guard \
            test_historical_region_collisions \
            test_historical_url_recovery \
            test_stage3_master_integration \
            test_stage3_legacy_importers \
            test_source_loss_audit \
            test_archive_incremental_dedup \
            test_archive_backup_restore_drill \
            test_encrypted_archive \
            test_cross_source_archive_parity \
            test_master_engine \
            2>&1 | tee v2/reports/ci/stage3-real-evidence-tests.log
      - name: Download actual #60 and #72 artifacts — no source or playback scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/madsc-old" "$RUNNER_TEMP/madsc-new"
          gh run download 40743765437 --repo "$GITHUB_REPOSITORY" -n turkish-stream-review -D "$RUNNER_TEMP/madsc-old"
          gh run download 40948768782 --repo "$GITHUB_REPOSITORY" -n turkish-stream-review -D "$RUNNER_TEMP/madsc-new"
      - name: Preserve real 4955 anonymous historical identities and validate TR/AZ evidence
        shell: bash
        run: |
          python v2/real_historical_stage3.py \
            --old "$RUNNER_TEMP/madsc-old/v2/reports/all-source-playback-aggregate.json" \
            --new "$RUNNER_TEMP/madsc-new/v2/reports/all-source-playback-aggregate.json" \
            --old-candidates "$RUNNER_TEMP/madsc-old/v2/reports/candidates.json" \
            --expected-missing 4955 \
            --index v2/reports/ci/stage3-4955-hash-only.jsonl \
            --report v2/reports/ci/stage3-real-history-summary.json
          python - <<'PY'
          import json
          p='v2/reports/ci/stage3-real-history-summary.json'
          report=json.load(open(p))
          assert report["previously_decoded_not_in_new"] == 4955
          assert report["hash_only_records_preserved"] == 4955
          assert report["real_stream_url_records_recovered"] == 0
          assert report["region_candidates"]["TR"] + report["region_candidates"]["AZ"] + report["region_candidates"]["UNKNOWN"] == 4955
          print("Real #60->#72 hash-only history retained and categorized:", report["region_candidates"])
          PY
      - name: Upload real-source anonymous evidence and single grouped test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-real-history-4955-${{ github.run_id }}
          path: |
            v2/reports/ci/stage3-real-evidence-tests.log
            v2/reports/ci/stage3-4955-hash-only.jsonl
            v2/reports/ci/stage3-real-history-summary.json
          retention-days: 90
          if-no-files-found: warn
