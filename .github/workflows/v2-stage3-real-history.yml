name: V2 Stage 3 Real Historical 4955 Evidence
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/real_historical_stage3.py'
      - 'v2/test_real_historical_stage3.py'
      - 'v2/test_stage3_immutable_history.py'
      - 'v2/history/stage3-4955-hash-only.jsonl'
      - 'v2/stage3_real_complete_audit.py'
      - 'v2/stage3_git_history_forensics.py'
      - 'v2/test_stage3_git_history_forensics.py'
      - 'v2/historical_local_match.py'
      - 'v2/stage3_historical_source_recovery.py'
      - 'v2/stage3_original_configured_source_recovery.py'
      - 'v2/test_stage3_original_configured_source_recovery.py'
      - 'v2/test_stage3_historical_source_recovery.py'
      - 'v2/test_historical_local_match.py'
      - 'v2/test_stage3_hash_evidence_linkage.py'
      - 'v2/test_stage3_identity_integrity.py'
      - 'v2/test_stage3_archive_lineage.py'
      - 'v2/test_stage3_atomic_classification.py'
      - '.github/workflows/v2-stage3-real-history.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  historical-real-data-batch:
    name: Real #60 vs #72 hash-only recovery plus Stage 3 grouped regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned archive dependency for offline regression suite
        run: python -m pip install cryptography==44.0.2
      - name: Protect original main IBO playlist
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Run one grouped historical archive, dedup and TR/AZ regression batch
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_real_historical_stage3 \
            test_stage3_immutable_history \
            test_historical_local_match \
            test_stage3_historical_source_recovery \
            test_stage3_original_configured_source_recovery \
            test_historical_inventory_guard \
            test_historical_region_collisions \
            test_stage3_hash_evidence_linkage \
            test_stage3_identity_integrity \
            test_stage3_archive_lineage \
            test_stage3_atomic_classification \
            test_stage3_git_history_forensics \
            test_historical_url_recovery \
            test_stage3_master_integration \
            test_stage3_legacy_importers \
            test_source_loss_audit \
            test_archive_incremental_dedup \
            test_archive_backup_restore_drill \
            test_encrypted_archive \
            test_cross_source_archive_parity \
            test_master_engine \
            2>&1 | tee v2/reports/ci/stage3-real-evidence-tests.log
      - name: Verify complete original 4955 hash-only inventory and encrypted restore
        env:
          PYTHONPATH: v2
        run: |
          python v2/stage3_real_complete_audit.py \
            --index v2/history/stage3-4955-hash-only.jsonl \
            --report v2/reports/ci/stage3-real-4955-complete-audit.json
      - name: Fetch only V2 Git branches and inspect historical M3U/JSON blobs offline
        shell: bash
        env:
          PYTHONPATH: v2
          V2_ARCHIVE_KEY_HEX: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          args=(
            --index v2/history/stage3-4955-hash-only.jsonl
            --report v2/reports/ci/stage3-git-history-exact-url-match.json
          )
          if test -n "$V2_ARCHIVE_KEY_HEX"; then
            args+=(--encrypted-output v2/reports/ci/stage3-git-history-url-evidence.enc)
          fi
          python v2/stage3_git_history_forensics.py "${args[@]}"
      - name: Download actual #60 and #72 artifacts — no source or playback scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/madsc-old" "$RUNNER_TEMP/madsc-new"
          gh run download 40743765437 --repo "$GITHUB_REPOSITORY" -n turkish-stream-review -D "$RUNNER_TEMP/madsc-old"
          gh run download 40948768782 --repo "$GITHUB_REPOSITORY" -n turkish-stream-review -D "$RUNNER_TEMP/madsc-new"
      - name: Preserve real 4955 anonymous historical identities and validate TR/AZ evidence
        shell: bash
        run: |
          python v2/real_historical_stage3.py \
            --old "$RUNNER_TEMP/madsc-old/v2/reports/all-source-playback-aggregate.json" \
            --new "$RUNNER_TEMP/madsc-new/v2/reports/all-source-playback-aggregate.json" \
            --old-candidates "$RUNNER_TEMP/madsc-old/v2/reports/candidates.json" \
            --expected-missing 4955 \
            --index v2/reports/ci/stage3-4955-hash-only.jsonl \
            --report v2/reports/ci/stage3-real-history-summary.json
          python - <<'PY'
          import json
          p='v2/reports/ci/stage3-real-history-summary.json'
          report=json.load(open(p))
          assert report["previously_decoded_not_in_new"] == 4955
          assert report["hash_only_records_preserved"] == 4955
          assert report["real_stream_url_records_recovered"] == 0
          assert report["region_candidates"]["TR"] + report["region_candidates"]["AZ"] + report["region_candidates"]["UNKNOWN"] == 4955
          print("Real #60->#72 hash-only history retained and categorized:", report["region_candidates"])
          PY
      - name: Reconcile all 4955 real identities through loss guard and AES-GCM roundtrip
        shell: bash
        env:
          PYTHONPATH: v2
        run: |
          python - <<'PY'
          import json, os, secrets, tempfile
          from pathlib import Path
          from historical_inventory_guard import reconcile, preserve_to_new_archive
          index = Path('v2/reports/ci/stage3-4955-hash-only.jsonl')
          records = [json.loads(line) for line in index.read_text(encoding='utf-8').splitlines() if line]
          protected, candidates, report = reconcile(records, expected_historical_records=4955)
          assert len(protected) == 4955 and len(candidates) == 0
          assert report['historical_hash_only_identities'] == 4955
          assert report['historical_unique_real_urls'] == 0
          assert report['historical_tr_candidate_records'] == 50
          assert report['historical_az_candidate_records'] == 1
          assert report['historical_unknown_region_records'] == 4904
          # Verify both original SHA identity membership and complete metadata
          # against the permanent, separately checksummed real #60 baseline.
          from historical_inventory_guard import verify_historical_baseline, unpack_archive_snapshot
          from encrypted_archive import restore
          baseline_path = Path('v2/history/stage3-4955-hash-only.jsonl')
          baseline = [json.loads(line) for line in baseline_path.read_text(encoding='utf-8').splitlines() if line]
          baseline_digest = verify_historical_baseline(records, baseline)
          assert baseline_digest == 'e84cf1273ae54fc89de5d7edc3a46b4db78b91ddd7d6953dabdde30a6c3e0c83'
          with tempfile.TemporaryDirectory() as d:
              os.environ['V2_ARCHIVE_KEY_HEX'] = secrets.token_hex(32)
              archive = Path(d) / 'roundtrip.enc'
              assert preserve_to_new_archive(archive, protected, candidates)
              restored_history, restored_additions, restored_view = unpack_archive_snapshot(
                  restore(archive), 4955)
              assert restored_additions == [] and restored_view == []
              assert verify_historical_baseline(restored_history, baseline) == baseline_digest
              del os.environ['V2_ARCHIVE_KEY_HEX']
          summary_path = Path('v2/reports/ci/stage3-real-history-summary.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          summary['loss_guard_hash_only_4955_verified'] = True
          summary['ephemeral_aesgcm_restore_4955_verified'] = True
          summary['persisted_cleartext_stream_urls'] = 0
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('4955 real hash-only identities preserved and AES-GCM roundtrip verified.')
          PY
      - name: Match the 4955 genuine hashes against existing local IBO and archived playlists, no network
        shell: bash
        env:
          PYTHONPATH: v2
        run: |
          python v2/historical_local_match.py \
            --history-index v2/reports/ci/stage3-4955-hash-only.jsonl \
            --playlist MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 \
            --playlist MADSC55_IBO_NEWLISTTR_YEDEKLER_TEST.m3u8 \
            --playlist "$RUNNER_TEMP/madsc-old/v2/reports/newlisttr-decoded-only.m3u8" \
            --playlist "$RUNNER_TEMP/madsc-new/v2/reports/newlisttr-decoded-only.m3u8" \
            --playlist "$RUNNER_TEMP/madsc-old/v2/reports/short-decoded-review-only.m3u8" \
            --playlist "$RUNNER_TEMP/madsc-new/v2/reports/short-decoded-review-only.m3u8" \
            --report v2/reports/ci/stage3-local-hash-match.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('v2/reports/ci/stage3-local-hash-match.json').read_text())
          assert result['historical_hash_identities'] == 4955
          assert result['matched_real_url_identities'] + result['unmatched_hash_identities'] == 4955
          assert not result['plaintext_url_emitted']
          path = Path('v2/reports/ci/stage3-real-history-summary.json')
          old = json.loads(path.read_text())
          old['exact_existing_local_m3u_url_matches'] = result['matched_real_url_identities']
          old['still_hash_only_unmatched'] = result['unmatched_hash_identities']
          path.write_text(json.dumps(old, indent=2) + '\n')
          print('Existing local exact URL matches:', result['matched_real_url_identities'],
                'remaining hash-only:', result['unmatched_hash_identities'])
          PY
      - name: Check historical URL matches in OTHER V2 branch and archived M3U snapshots (read-only)
        shell: bash
        env:
          PYTHONPATH: v2
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/madsc/v2-encrypted-archive-20261101:refs/remotes/origin/madsc/v2-encrypted-archive-20261101'
          mkdir -p "$RUNNER_TEMP/v2-historical-branch-m3u"
          git show 'refs/remotes/origin/main:v2/arsiv/yabanci_yedekler_2026-11-02_3964.m3u8' \
            > "$RUNNER_TEMP/v2-historical-branch-m3u/main-foreign-archive.m3u8"
          git show 'refs/remotes/origin/main:MADSC55_TV_IBO_CALISANLAR_TEST.m3u8' \
            > "$RUNNER_TEMP/v2-historical-branch-m3u/main-ibo.m3u8"
          git show 'refs/remotes/origin/main:MADSC55_IBO_NEWLISTTR_YEDEKLER_TEST.m3u8' \
            > "$RUNNER_TEMP/v2-historical-branch-m3u/main-backups.m3u8"
          git show 'refs/remotes/origin/madsc/v2-encrypted-archive-20261101:MADSC55_TV_IBO_CALISANLAR_TEST.m3u8' \
            > "$RUNNER_TEMP/v2-historical-branch-m3u/other-v2-ibo.m3u8"
          git show 'refs/remotes/origin/madsc/v2-encrypted-archive-20261101:MADSC55_IBO_NEWLISTTR_YEDEKLER_TEST.m3u8' \
            > "$RUNNER_TEMP/v2-historical-branch-m3u/other-v2-backups.m3u8"
          python v2/historical_local_match.py \
            --history-index v2/history/stage3-4955-hash-only.jsonl \
            --playlist "$RUNNER_TEMP/v2-historical-branch-m3u/main-foreign-archive.m3u8" \
            --playlist "$RUNNER_TEMP/v2-historical-branch-m3u/main-ibo.m3u8" \
            --playlist "$RUNNER_TEMP/v2-historical-branch-m3u/main-backups.m3u8" \
            --playlist "$RUNNER_TEMP/v2-historical-branch-m3u/other-v2-ibo.m3u8" \
            --playlist "$RUNNER_TEMP/v2-historical-branch-m3u/other-v2-backups.m3u8" \
            --report v2/reports/ci/stage3-other-v2-branches-exact-url-matches.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('v2/reports/ci/stage3-other-v2-branches-exact-url-matches.json')
          report=json.loads(p.read_text())
          assert report['historical_hash_identities']==4955
          assert report['matched_real_url_identities']+report['unmatched_hash_identities']==4955
          assert not report['plaintext_url_emitted']
          print('Other V2 branches (five real M3U files): exact recovered URL hashes:',
                report['matched_real_url_identities'])
          PY
      - name: Recover exact SHA-256 URLs from original October 28 GitHub source snapshots only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: v2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage3-original-github-sources"
          gh run download 40743765437 --repo "$GITHUB_REPOSITORY" \
            -n unified-source-snapshot -D "$RUNNER_TEMP/stage3-original-github-sources"
          python v2/stage3_historical_source_recovery.py \
            --index v2/history/stage3-4955-hash-only.jsonl \
            --original-discovery "$RUNNER_TEMP/stage3-original-github-sources/github-source-discovery.json" \
            --report v2/reports/ci/stage3-original-github-historical-urls.json
      - name: Recheck original #60 configured IPTV-org Free-TV and Dearbulut source URL identities
        env:
          PYTHONPATH: v2
        run: |
          python v2/stage3_original_configured_source_recovery.py \
            --index v2/history/stage3-4955-hash-only.jsonl \
            --report v2/reports/ci/stage3-original-configured-source-matches.json
      - name: Combine 4,955 real historical URL matches across V2 branches and original source commits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          repo=json.loads(Path('v2/reports/ci/stage3-other-v2-branches-exact-url-matches.json').read_text())
          history=json.loads(Path('v2/reports/ci/stage3-original-github-historical-urls.json').read_text())
          original=set(repo['matched_hashes'])
          historical=set(history['matched_hashes'])
          configured=json.loads(Path('v2/reports/ci/stage3-original-configured-source-matches.json').read_text())
          original_sources=set(configured['matched_hashes'])
          total=original|historical|original_sources
          assert len(total) <= 4955
          assert len(total)+ (4955-len(total)) == 4955
          assert all(isinstance(x,str) and len(x)==64 for x in total)
          summary={
            'schema':1,
            'policy':'LOSSLESS_REAL_HISTORICAL_HASH_EXACT_URL_MATCH_NO_AUTOPUBLISH',
            'historical_hashes':4955,
            'v2_branch_matched':len(original),
            'original_source_matched':len(historical),
            'configured_original_source_matched':len(original_sources),
            'overlap_matched':len(original & historical),
            'unique_exact_original_url_matches':len(total),
            'still_without_original_url':4955-len(total),
            'matched_hashes':sorted(total),
            'source_commit_errors':history['source_files_unavailable'],
            'real_streams_playback_reverified':0,
            'device_playback_verified':False,
            'plaintext_url_emitted':False,
            'main_playlist_modified':False
          }
          Path('v2/reports/ci/stage3-combined-real-url-recovery.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('Exactly recovered historical SHA256 URL identities:',len(total),
                'still URL-less:',4955-len(total),
                'unavailable source revisions:',summary['source_commit_errors'])
          PY
      - name: Permanently preserve the real 4955 hash-only identities in V2 branch
        if: github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' && github.repository == 'Madsc55/MADSC55-TV-V2'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          p=Path('v2/reports/ci/stage3-4955-hash-only.jsonl')
          records=[json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line]
          keys=[row.get('url_sha256') for row in records]
          expected_fields={'url_sha256','source','region_candidate','classification_evidence',
                           'playback_at_run60','historical_not_reverified',
                           'spoken_language_verified','device_verified'}
          assert len(records)==len(set(keys))==4955
          assert all(isinstance(k,str) and re.fullmatch(r'[0-9a-f]{64}',k) for k in keys)
          assert all(set(row)==expected_fields for row in records)
          assert all(re.fullmatch(r'[A-Za-z0-9_.#-]{1,120}',row['source']) for row in records)
          assert all(row['region_candidate'] in ('TR','AZ','UNKNOWN') for row in records)
          assert all(row['spoken_language_verified'] is False and row['device_verified'] is False for row in records)
          digest=hashlib.sha256(''.join(sorted(keys)).encode()).hexdigest()
          assert digest=='e84cf1273ae54fc89de5d7edc3a46b4db78b91ddd7d6953dabdde30a6c3e0c83'
          print('Validated immutable anonymized 4955 historical stream identities:', digest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/madsc/v2-discovery-bulk-20261031
          git checkout -B stage3-archive FETCH_HEAD
          mkdir -p v2/history
          if test -e v2/history/stage3-4955-hash-only.jsonl; then
            cmp v2/history/stage3-4955-hash-only.jsonl v2/reports/ci/stage3-4955-hash-only.jsonl || {
              echo 'Historical immutable index mismatch; refusing overwrite'
              exit 1
            }
            echo 'Historical index already committed and matches original artifact'
          else
            cp v2/reports/ci/stage3-4955-hash-only.jsonl v2/history/stage3-4955-hash-only.jsonl
            git add v2/history/stage3-4955-hash-only.jsonl
            git commit -m "data(v2): preserve 4955 original decoded historical anonymous identities"
            git push origin HEAD:refs/heads/madsc/v2-discovery-bulk-20261031
          fi
      - name: Upload real-source anonymous evidence and single grouped test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-real-history-4955-${{ github.run_id }}
          path: |
            v2/reports/ci/stage3-real-evidence-tests.log
            v2/reports/ci/stage3-4955-hash-only.jsonl
            v2/reports/ci/stage3-real-history-summary.json
            v2/reports/ci/stage3-real-4955-complete-audit.json
            v2/reports/ci/stage3-git-history-exact-url-match.json
            v2/reports/ci/stage3-git-history-url-evidence.enc
            v2/reports/ci/stage3-local-hash-match.json
            v2/reports/ci/stage3-other-v2-branches-exact-url-matches.json
            v2/reports/ci/stage3-original-github-historical-urls.json
            v2/reports/ci/stage3-original-configured-source-matches.json
            v2/reports/ci/stage3-combined-real-url-recovery.json
          retention-days: 90
          if-no-files-found: warn
