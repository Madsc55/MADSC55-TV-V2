name: Consolidate seven backup playlists
on:
  workflow_dispatch:
  push:
    branches:
      - combine-seven-playlists-20261117
    paths:
      - .github/workflows/consolidate-seven-playlists.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: combine-seven-playlists-20261117
          persist-credentials: true
      - name: Build and verify backup playlist
        run: |
          python3 v2/build_yedekler_playlistesi.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("YEDEKLER_PLAYLISTESI.m3u8")
          data=p.read_text(encoding="utf-8")
          count=sum(x.startswith("#EXTINF:") for x in data.splitlines())
          assert count == 32488, f"expected 32488 records, got {count}"
          print("Verified",count,"records")
          PY
      - name: Commit consolidated playlist to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YEDEKLER_PLAYLISTESI.m3u8
          git commit -m "build: materialize verified 32488-entry backup playlist"
          git push origin HEAD:combine-seven-playlists-20261117
