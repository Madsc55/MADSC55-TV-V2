name: V2 Stage 5 evidence gate tests
on:
  pull_request:
    paths:
      - 'v2/stage5_evidence_export.py'
      - 'v2/test_stage5_evidence_export.py'
      - '.github/workflows/v2-stage5-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evidence gate and reject unverified delivery
        run: python -m unittest discover -s v2 -p 'test_stage5_evidence_export.py' -v
