name: V2 Turkish M3U Orphan Recovery — Exact History and AV Batch
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - v2/test_orphan_resolution_gate.py

permissions:
  contents: read

jobs:
  offline-orphan-regressions:
    name: Read-only 17-module orphan regression batch
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect immutable IBO playlist and historical metadata
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: One grouped orphan, exact history and source preservation regression suite
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_orphan_m3u_recovery \
            test_main_playlist_candidate_bridge \
            test_orphan_source_only_recheck \
            test_historical_exact_real_av \
            test_orphan_source_expansion \
            test_orphan_targeted_github_code \
            test_orphan_resolution_gate \
            test_source_adapters_batch \
            test_orphan_iptv_org_registry \
            test_document_platform_discovery \
            test_orphan_baseline_guard \
            test_m3u_source_content_audit \
            test_historical_targeted_playback \
            test_run60_source_ledger \
            test_run60_source_discovery \
            test_source_loss_audit \
            test_turkish_m3u_source_audit \
            2>&1 | tee v2/reports/ci/three-source-orphan-regressions.log
      - name: Upload grouped regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-offline-orphan-regressions-${{ github.run_id }}
          path: v2/reports/ci/three-source-orphan-regressions.log
          if-no-files-found: warn

  four-sources-one-batch:
    if: github.event_name == 'workflow_dispatch'
    name: Four original feeds plus verified public discovery; exact orphan AV batch
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption dependency and FFprobe
        run: |
          python -m pip install cryptography==44.0.2
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Protect immutable IBO playlist and existing historical metadata
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: One grouped orphan, exact history and source preservation regression suite
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_orphan_m3u_recovery \
            test_main_playlist_candidate_bridge \
            test_orphan_source_only_recheck \
            test_historical_exact_real_av \
            test_orphan_source_expansion \
            test_orphan_targeted_github_code \
            test_orphan_resolution_gate \
            test_source_adapters_batch \
            test_orphan_iptv_org_registry \
            test_document_platform_discovery \
            test_orphan_baseline_guard \
            test_m3u_source_content_audit \
            test_historical_targeted_playback \
            test_run60_source_ledger \
            test_run60_source_discovery \
            test_source_loss_audit \
            test_turkish_m3u_source_audit \
            2>&1 | tee v2/reports/ci/three-source-orphan-regressions.log
      - name: Discover public Scribd SlideShare Internet Archive sources once
        shell: bash
        run: |
          PYTHONPATH=v2 python v2/document_platform_discovery.py --scan-public-documents
          PYTHONPATH=v2 python -c "from document_platform_discovery import accepted_sources; print('Vetted public document M3U sources:', len(accepted_sources()))"
      - name: Discover reviewed GitHub Gist GitLab Codeberg public M3U sources in one batch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=v2 python v2/github_source_discovery.py
          PYTHONPATH=v2 python v2/run_forge_source_discovery.py --scan-public-forges
      - name: Read pinned protected main and 3964-entry foreign archive as sources only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2-main-snapshots"
          # Read immutable Git blobs, never touch the working or production playlist.
          if ! git cat-file blob 165c726cd9211f9f51c31f1c718e0911bab79e1b > "$RUNNER_TEMP/v2-main-snapshots/main-876.m3u8" 2>/dev/null; then
            gh api repos/Madsc55/MADSC55-TV-V2/git/blobs/165c726cd9211f9f51c31f1c718e0911bab79e1b --jq '.content' | base64 --decode > "$RUNNER_TEMP/v2-main-snapshots/main-876.m3u8"
          fi
          if ! git cat-file blob c54272e97f711c3074303cec74739d6d0ec806b2 > "$RUNNER_TEMP/v2-main-snapshots/foreign-3964.m3u8" 2>/dev/null; then
            gh api repos/Madsc55/MADSC55-TV-V2/git/blobs/c54272e97f711c3074303cec74739d6d0ec806b2 --jq '.content' | base64 --decode > "$RUNNER_TEMP/v2-main-snapshots/foreign-3964.m3u8"
          fi
          PYTHONPATH=v2 python - <<'PY'
          import os
          from pathlib import Path
          from main_playlist_candidate_bridge import validated_v2_main_catalog
          root=Path(os.environ["RUNNER_TEMP"])/"v2-main-snapshots"
          _, evidence=validated_v2_main_catalog(root/"main-876.m3u8",root/"foreign-3964.m3u8")
          assert evidence["immutable_blobs_verified"] is True
          assert evidence["playlist_modified"] is False
          print("PINNED_V2_MAIN_READ_ONLY",{
              k:evidence[k] for k in ("active_main_channels","active_yedekler",
               "fixed_anchor_channels","separate_archived_yabancilar")})
          PY
      - name: Compare four original M3U sources, immutable orphan identities, and known historical feeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=v2 python v2/orphan_m3u_recovery.py \
            --history-revisions 300 \
            --v2-main-playlist-snapshot "$RUNNER_TEMP/v2-main-snapshots/main-876.m3u8" \
            --v2-main-foreign-archive-snapshot "$RUNNER_TEMP/v2-main-snapshots/foreign-3964.m3u8" \
            --include-public-discovery \
            --include-targeted-code-search \
            --include-public-registry \
            --public-key v2/config/stage3_transit_public.pem \
            --report v2/reports/ci/three-source-orphan-anonymous.json \
            --sealed v2/reports/ci/three-source-av-verified.sealed \
            --all-candidates-sealed v2/reports/ci/three-source-all-historical-candidates.sealed \
            --immutable-orphan-baseline v2/history/m3u-orphan-50-hash-baseline.json
      - name: Fail closed if any of the original 50 identities still lacks real video and audio
        run: |
          PYTHONPATH=v2 python v2/orphan_resolution_gate.py \
            --report v2/reports/ci/three-source-orphan-anonymous.json \
            --immutable-orphan-baseline v2/history/m3u-orphan-50-hash-baseline.json \
            --output v2/reports/ci/orphan-50-resolution-anonymous.json
      - name: Upload anonymized evidence and RSA-encrypted verified plus unverified URL candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-three-source-orphan-evidence-${{ github.run_id }}
          path: |
            v2/reports/ci/three-source-orphan-anonymous.json
            v2/reports/ci/orphan-50-resolution-anonymous.json
            v2/reports/ci/three-source-av-verified.sealed
            v2/reports/ci/three-source-all-historical-candidates.sealed
            v2/reports/ci/three-source-orphan-regressions.log
            v2/reports/document-platform-references.json
          if-no-files-found: warn
          retention-days: 30
