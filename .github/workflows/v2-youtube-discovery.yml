name: V2 YouTube Turkish TV Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/youtube_discovery.py'
      - '.github/workflows/v2-youtube-discovery.yml'
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: read
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependency
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Syntax check
        run: python -m py_compile v2/youtube_discovery.py
      - name: Discover YouTube candidates and verify live metadata
        run: python v2/youtube_discovery.py
      - name: Upload review-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-candidates
          path: v2/reports/youtube-live-candidates.json
          if-no-files-found: ignore
