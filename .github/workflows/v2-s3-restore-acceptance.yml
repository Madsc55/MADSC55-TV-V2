name: V2 Independent S3 Restore Acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - '.github/workflows/v2-s3-restore-acceptance.yml'
      - 'v2/independent_s3_restore.py'
      - 'v2/archive_acceptance_gate.py'
permissions:
  contents: read
concurrency:
  group: v2-s3-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  remote-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned restore dependencies
        run: |
          python -m pip install cryptography==44.0.2
          command -v aws
          aws --version
      - name: Restore pinned version from independent S3 and validate all historical identities
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.V2_S3_RESTORE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.V2_S3_RESTORE_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.V2_S3_RESTORE_AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.V2_S3_RESTORE_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          V2_ARCHIVE_KEY_HEX: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
          V2_ARCHIVE_EXPECTED_SHA256: ${{ secrets.V2_S3_RESTORE_PINNED_SHA256 }}
          S3_BUCKET: ${{ secrets.V2_S3_RESTORE_BUCKET }}
          S3_OBJECT_KEY: ${{ secrets.V2_S3_RESTORE_OBJECT_KEY }}
          S3_VERSION_ID: ${{ secrets.V2_S3_RESTORE_VERSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION V2_ARCHIVE_KEY_HEX V2_ARCHIVE_EXPECTED_SHA256 S3_BUCKET S3_OBJECT_KEY S3_VERSION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required independent S3 restore secret missing: $name"
              exit 1
            fi
          done
          mkdir -p v2/reports/s3-restore
          PYTHONPATH=v2 python v2/independent_s3_restore.py \
            --bucket "$S3_BUCKET" --key "$S3_OBJECT_KEY" --version-id "$S3_VERSION_ID" \
            > v2/reports/s3-restore/restore-result.log 2>&1 || {
              echo "Independent S3 restore failed; inspect this job's restore-result.log artifact" >&2
              exit 1
            }
          cat v2/reports/s3-restore/restore-result.log
          grep -Fx 'PASS: independent versioned offsite AES-GCM restore; 4955 historical identities' v2/reports/s3-restore/restore-result.log
          grep -Eq '^restored_sha256=[0-9a-f]{64}
      - name: Record verifiable run identity even on failure
        if: always()
        shell: bash
        run: |
          printf 'Run: https://github.com/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
 v2/reports/s3-restore/restore-result.log
          echo "Independent versioned S3 restore and authenticated 4955-identity acceptance passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Record verifiable run identity even on failure
        if: always()
        shell: bash
        run: |
          printf 'Run: https://github.com/%s/actions/runs/%s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload independent restore result without private archive or S3 coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-s3-restore-result-${{ github.run_id }}
          path: v2/reports/s3-restore/restore-result.log
          if-no-files-found: warn
          retention-days: 30
