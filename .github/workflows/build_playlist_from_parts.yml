name: Build canonical IBO playlist from parts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/playlist_parts_manager.py'
      - 'v2/playlists/parts/**'
      - '.github/workflows/build_playlist_from_parts.yml'
permissions:
  contents: read
concurrency:
  group: canonical-ibo-parts
  cancel-in-progress: false
jobs:
  build:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed channel command and validate canonical inventory
        run: |
          set -euo pipefail
          if [ -f v2/playlists/parts/pending_command.json ]; then
            python v2/channel_command_engine.py --request v2/playlists/parts/pending_command.json --apply
            rm -- v2/playlists/parts/pending_command.json
          fi
          python v2/playlist_parts_manager.py auto
          python v2/test_playlist_invariants.py
      - name: Create validated proposal branch (never push main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/playlists/parts/
          for file in v2/ibo_authorized_change.json v2/playlists/channel_status.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "Canonical playlist and reviewed parts already match."
            exit 0
          fi
          branch="automation/ibo-parts-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "build: propose lossless canonical IBO playlist parts"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          # Repository settings forbid GitHub Actions bots from creating PRs.
          # Leave a validated, isolated proposal branch and report it explicitly;
          # an authorized GitHub identity can open a PR with required checks.
          echo "Validated proposal branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions is not permitted to create pull requests in this repository." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the authorized GitHub integration to open a PR against main and review both required checks." >> "$GITHUB_STEP_SUMMARY"
