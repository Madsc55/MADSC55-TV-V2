name: Build canonical IBO playlist from parts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/playlist_parts_manager.py'
      - 'v2/playlists/parts/**'
      - '.github/workflows/build_playlist_from_parts.yml'
permissions:
  contents: read
concurrency:
  group: canonical-ibo-parts
  cancel-in-progress: false
jobs:
  build:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical playlist and validate inventory
        run: |
          python v2/playlist_parts_manager.py auto
          python v2/test_playlist_invariants.py
      - name: Propose generated parts via reviewed pull request (never push main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/playlists/parts/
          if git diff --cached --quiet; then
            echo "Canonical playlist and reviewed parts already match."
            exit 0
          fi
          branch="automation/ibo-parts-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "build: propose lossless canonical IBO playlist parts"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Build canonical IBO playlist from reviewed parts" \
            --body "Generated by protected playlist-parts workflow run ${GITHUB_RUN_ID}. This PR preserves every channel byte and internal category order. Merge only after Offline CI and Production Security Gate PASS."
          # GITHUB_TOKEN-created PRs do not initiate pull_request workflows.
          # Explicit workflow_dispatch creates the two required CI checks on the PR head.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run v2-main-production-safety-gate.yml --ref "$branch"
