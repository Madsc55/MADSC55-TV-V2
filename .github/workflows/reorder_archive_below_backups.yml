name: Position ANA ARŞİV below YEDEKLER
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/reorder_archive_below_backups.py'
permissions:
  contents: write
  pull-requests: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reorder without altering channels
        run: python3 v2/reorder_archive_below_backups.py MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
      - name: Open playlist change PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8; then
            echo "Playlist already ordered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="owner/archive-below-backups-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m "Place ANA ARŞİV directly below YEDEKLER"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "Place 15703 ANA ARŞİV channels below YEDEKLER" --body "Only category order changes. Script verifies 1107 YEDEKLER, 15703 ANA ARŞİV and byte-identical channel blocks. Review CI and Production Security Gate before merging."
