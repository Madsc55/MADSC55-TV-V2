name: Reversible category rollback - preserve discovery archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/rollback_categories_preserve_archive.py'
      - '.github/workflows/reversible-category-rollback.yml'
permissions:
  contents: write
concurrency:
  group: category-rollback
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive category entries and retain two permanent backups
        run: python -u v2/rollback_categories_preserve_archive.py
      - name: Commit archive and updated categories
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/archives/category-rollback-2026-10-29.m3u8 v2/reports/category-rollback-2026-10-29.json
          git diff --cached --quiet || (git commit -m 'Archive discovered category entries without deleting streams' && git push)
