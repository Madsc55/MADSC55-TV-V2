name: Audit Turkish channels and remove test symbols
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/audit_turkish_categories.py'
      - 'v2/turkish_discovery.py'
      - '.github/workflows/turkish-category-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m py_compile v2/audit_turkish_categories.py v2/turkish_discovery.py
      - name: Worldwide Turkish discovery and catalog validation
        run: python -u v2/turkish_discovery.py
      - name: Commit verified playlist and report
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/reports/turkish-discovery.json
          git diff --cached --quiet || (git commit -m 'Audit Turkish channels and clean test markers' && git push)
