name: V2 Stage 3 Historical Inventory Loss Protection
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/historical_inventory_guard.py'
      - 'v2/historical_url_recovery.py'
      - 'v2/test_historical_inventory_guard.py'
      - 'v2/test_stage3_immutable_history.py'
      - 'v2/history/stage3-4955-hash-only.jsonl'
      - 'v2/test_historical_region_collisions.py'
      - 'v2/test_historical_url_recovery.py'
      - 'v2/test_master_engine.py'
      - 'v2/test_stage3_master_integration.py'
      - 'v2/test_stage3_legacy_importers.py'
      - 'v2/test_source_loss_audit.py'
      - 'v2/master_engine.py'
      - '.github/workflows/v2-stage3-historical-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-inventory-batch:
    name: Historical integrity, loss, TR/AZ, AES-GCM restore — grouped
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption dependency
        run: python -m pip install cryptography==44.0.2
      - name: Verify protected main playlist
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Run historical recovery and encrypted integrity regressions together
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_historical_inventory_guard \
            test_stage3_immutable_history \
            test_historical_region_collisions \
            test_stage3_master_integration \
            test_stage3_legacy_importers \
            test_historical_url_recovery \
            test_source_loss_audit \
            test_master_engine \
            test_archive_incremental_dedup \
            test_archive_backup_restore_drill \
            test_encrypted_archive \
            test_cross_source_archive_parity \
            test_source_provenance \
            test_reference_classifier \
            2>&1 | tee v2/reports/ci/stage3-historical-batch.log
      - name: Record absence or presence of actual historical file (no fabricated recovery)
        run: |
          python - <<'PY'
          import json, pathlib
          expected = 4955
          root = pathlib.Path('.')
          paths = [root/'ibo-candidate-inventory.jsonl.enc',
                   root/'v2'/'ibo-candidate-inventory.jsonl.enc']
          available = [p for p in paths if p.is_file()]
          result = {
              'schema': 1,
              'historical_expected_records': expected,
              'historical_dataset_present_in_checkout': bool(available),
              'historical_4955_real_records_restored': False,
              'offline_synthetic_regressions_are_not_real_history_recovery': True,
              'device_verified': False,
              'main_playlist_modified': False
          }
          p = pathlib.Path('v2/reports/ci/stage3-historical-evidence.json')
          p.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Upload grouped stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-historical-stage3-${{ github.run_id }}
          path: |
            v2/reports/ci/stage3-historical-batch.log
            v2/reports/ci/stage3-historical-evidence.json
          if-no-files-found: warn
          retention-days: 30
