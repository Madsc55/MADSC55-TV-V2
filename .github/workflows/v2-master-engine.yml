name: V2 Master Engine
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify protected playlist SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          path = 'MADSC55_TV_IBO_CALISANLAR_TEST.m3u8'
          baseline = subprocess.check_output(['git', 'show', 'HEAD:' + path])
          current = pathlib.Path(path).read_bytes()
          before = hashlib.sha256(baseline).hexdigest()
          after = hashlib.sha256(current).hexdigest()
          print(f'Protected playlist SHA-256 HEAD={before} working_tree={after}')
          immutable_blob = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          if immutable_blob != '4b1c3cea4b5107a425abab60f62d41f9f81e05a7':
              raise SystemExit('Protected playlist differs from immutable baseline')
          if before != after:
              raise SystemExit('Protected playlist SHA-256 mismatch')
          PY
      - name: Compile Master Engine modules
        run: python -m compileall -q v2
      - name: Run all offline regressions and preserve logs
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          failed=0
          PYTHONPATH=v2 python -m unittest discover -s v2 -p 'test_*.py' -v > v2/reports/master-ci/unittest.log 2>&1 || failed=1
          python v2/test_playlist_invariants.py > v2/reports/master-ci/playlist.log 2>&1 || failed=1
          cat v2/reports/master-ci/*.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' v2/reports/master-ci/unittest.log || failed=1
          exit "$failed"
      - name: Upload offline logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-master-offline-${{ github.run_id }}
          path: v2/reports/master-ci/
          retention-days: 30
      - name: Record offline test run identity
        if: always()
        run: |
          echo "Run ID: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
  master:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-master]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Offline master regressions
        run: |
          python v2/test_historical_url_recovery.py
          python v2/test_master_engine.py
          python v2/test_playlist_invariants.py
      - name: Require archive secret
        env:
          V2_ARCHIVE_KEY_HEX: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
        run: |
          if [ "${#V2_ARCHIVE_KEY_HEX}" -ne 64 ]; then
            echo "::error::V2_ARCHIVE_KEY_HEX must contain 64 hex characters"
            exit 1
          fi
      - name: Real master discovery and verification
        env:
          V2_ARCHIVE_KEY_HEX: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
        run: |
          mkdir -p v2/reports/master-run
          python v2/master_engine.py --archive v2/reports/master-run/inventory.enc --out v2/reports/master-run/output --limit 500
      - name: Record master run identity
        if: always()
        run: |
          mkdir -p v2/reports/master-run
          printf 'run_id=%s\ncommit_sha=%s\njob=master\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > v2/reports/master-run/run-identity.txt
          cat v2/reports/master-run/run-identity.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results even on partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-master-run-${{ github.run_id }}
          path: |
            v2/reports/master-run/output/
            v2/reports/master-run/inventory.enc
            v2/reports/master-run/run-identity.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Protect working tree
        if: always()
        run: |
          git diff --exit-code -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
