name: V2 Master Engine
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
  workflow_dispatch:
    inputs:
      run_live_master:
        description: 'Run real FFmpeg live master acceptance (requires archive secrets)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
# Serialize live runs; independent read-only commits must not replace each
# other's pending regressions. This is not a shared Git writer lock.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_live_master == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-master]'))) && format('v2-master-engine-{0}', github.ref) || format('v2-master-offline-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: false
  queue: max
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify current V2 continuation and canonical task files at startup
        shell: bash
        run: |
          set -euo pipefail
          for file in DEVAM_NOTU.md v2/tasks/master_tasks.json v2/tasks/state.json; do
            test -s "$file"
            git cat-file -e "HEAD:$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
            printf 'V2_STARTUP_READ commit=%s file=%s blob=%s\n' "$GITHUB_SHA" "$file" "$(git rev-parse "HEAD:$file")"
          done
          PYTHONPATH=v2/tasks python v2/tasks/task_engine.py --root state.json --manifest v2/tasks/master_tasks.json --ledger v2/tasks/state.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install cryptography==44.0.2 PyYAML==6.0.2
      - name: Install real FFmpeg for offline AV regression tests
        id: install_ffmpeg
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Verify FFmpeg audio and video decoders for AV regression coverage
        id: ffmpeg_capabilities
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          {
            command -v ffmpeg
            command -v ffprobe
            ffmpeg -hide_banner -version
            ffmpeg -hide_banner -decoders
            ffmpeg -hide_banner -filters
          } > v2/reports/master-ci/ffmpeg-capabilities.log 2>&1
          result=$?
          cat v2/reports/master-ci/ffmpeg-capabilities.log
          exit "$result"
      - name: Verify protected playlist SHA-256
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          path = 'MADSC55_TV_IBO_CALISANLAR_TEST.m3u8'
          baseline = subprocess.check_output(['git', 'show', 'HEAD:' + path])
          current = pathlib.Path(path).read_bytes()
          before = hashlib.sha256(baseline).hexdigest()
          after = hashlib.sha256(current).hexdigest()
          print(f'Protected playlist SHA-256 HEAD={before} working_tree={after}')
          immutable_blob = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          if immutable_blob != '4b1c3cea4b5107a425abab60f62d41f9f81e05a7':
              raise SystemExit('Protected playlist differs from immutable baseline')
          if before != after:
              raise SystemExit('Protected playlist SHA-256 mismatch')
          PY
      - name: Verify permanent 33-task engine and fail-closed safety in one batch
        id: task_engine_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          result=0
          PYTHONPATH=v2/tasks python -m unittest discover -s v2/tasks -p 'test_*.py' -v > v2/reports/master-ci/task-engine.log 2>&1 || result=$?
          cat v2/reports/master-ci/task-engine.log
          exit "$result"
      - name: Run grouped historical archive and transient AV acceptance regressions
        id: grouped_acceptance
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          set +e
          PYTHONPATH=v2 python -m unittest -v \
            test_archive_acceptance_gate \
            test_historical_inventory_guard \
            test_independent_s3_restore \
            test_traz_transient_av_recovery \
            > v2/reports/master-ci/acceptance-11-13-14-16.log 2>&1
          result=$?
          cat v2/reports/master-ci/acceptance-11-13-14-16.log
          printf 'Acceptance group exit=%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Compile Master Engine modules
        id: compile_modules
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          python -m compileall -q v2 > v2/reports/master-ci/compile.log 2>&1
      - name: Verify grouped test logs are not empty or falsely green
        id: grouped_log_integrity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for file in task-engine.log acceptance-11-13-14-16.log; do
            test -s "v2/reports/master-ci/$file" || {
              echo "::error::Required grouped test log missing: $file"
              exit 1
            }
          done
          echo "Grouped test logs exist; final acceptance still depends on all step outcomes" >> "$GITHUB_STEP_SUMMARY"
      - name: Run all offline regressions and preserve logs
        id: offline_regressions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p v2/reports/master-ci
          failed=0
          PYTHONPATH=v2 python -m unittest discover -s v2 -p 'test_*.py' -v > v2/reports/master-ci/unittest.log 2>&1 || failed=1
          python v2/test_playlist_invariants.py > v2/reports/master-ci/playlist.log 2>&1 || failed=1
          cat v2/reports/master-ci/*.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' v2/reports/master-ci/unittest.log || failed=1
          # Do not accept an all-green offline run if actual FFmpeg decode
          # regressions were silently skipped. Historical cross-run artifact
          # skips are tracked separately and are not fabricated as new AV proof.
          if grep -Eiq "skipped ['\"]FFmpeg not installed['\"]|skipped ['\"]ffprobe not installed['\"]" v2/reports/master-ci/unittest.log; then
            echo "::error::Real FFmpeg AV regression was skipped; offline acceptance rejected"
            failed=1
          fi
          exit "$failed"
      - name: Upload offline logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-master-offline-${{ github.run_id }}
          path: v2/reports/master-ci/
          retention-days: 30
      - name: Fail closed after collecting all offline acceptance logs
        if: always()
        shell: bash
        env:
          FFMPEG_INSTALL_RESULT: ${{ steps.install_ffmpeg.outcome }}
          FFMPEG_RESULT: ${{ steps.ffmpeg_capabilities.outcome }}
          TASK_ENGINE_RESULT: ${{ steps.task_engine_tests.outcome }}
          GROUPED_RESULT: ${{ steps.grouped_acceptance.outcome }}
          GROUPED_LOG_RESULT: ${{ steps.grouped_log_integrity.outcome }}
          COMPILE_RESULT: ${{ steps.compile_modules.outcome }}
          OFFLINE_RESULT: ${{ steps.offline_regressions.outcome }}
        run: |
          printf 'FFmpegInstall=%s FFmpeg=%s TaskEngine=%s Grouped=%s GroupedLogs=%s Compile=%s Offline=%s\n' "$FFMPEG_INSTALL_RESULT" "$FFMPEG_RESULT" "$TASK_ENGINE_RESULT" "$GROUPED_RESULT" "$GROUPED_LOG_RESULT" "$COMPILE_RESULT" "$OFFLINE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FFMPEG_INSTALL_RESULT" != "success" ] || [ "$FFMPEG_RESULT" != "success" ] || [ "$TASK_ENGINE_RESULT" != "success" ] || [ "$GROUPED_RESULT" != "success" ] || [ "$GROUPED_LOG_RESULT" != "success" ] || [ "$COMPILE_RESULT" != "success" ] || [ "$OFFLINE_RESULT" != "success" ]; then
            echo "Required offline checks failed or were skipped; acceptance rejected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Record offline test run identity
        if: always()
        run: |
          echo "Run ID: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
  master:
    needs: offline-tests
    if: github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[run-live-master]')) || (github.event_name == 'workflow_dispatch' && inputs.run_live_master == true))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify current V2 continuation and canonical task files at startup
        shell: bash
        run: |
          set -euo pipefail
          for file in DEVAM_NOTU.md v2/tasks/master_tasks.json v2/tasks/state.json; do
            test -s "$file"
            git cat-file -e "HEAD:$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
            printf 'V2_STARTUP_READ commit=%s file=%s blob=%s\n' "$GITHUB_SHA" "$file" "$(git rev-parse "HEAD:$file")"
          done
          PYTHONPATH=v2/tasks python v2/tasks/task_engine.py --root state.json --manifest v2/tasks/master_tasks.json --ledger v2/tasks/state.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned archive dependency
        run: python -m pip install cryptography==44.0.2 PyYAML==6.0.2
      - name: Install and verify real FFmpeg and FFprobe executables
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Offline master regressions
        run: |
          python v2/test_historical_url_recovery.py
          python v2/test_master_engine.py
          python v2/test_playlist_invariants.py
      - name: Resolve durable live archive key before discovery
        env:
          CONFIGURED_ARCHIVE_KEY: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
          CONFIGURED_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
        shell: bash
        run: |
          PYTHONPATH=v2 python - <<'PY'
          import os
          from live_archive_key import resolve_key
          try:
              key, source = resolve_key(os.environ.get("CONFIGURED_ARCHIVE_KEY", ""),
                                        os.environ.get("CONFIGURED_ARCHIVE_PASSPHRASE", ""))
          except ValueError as exc:
              raise SystemExit("Live master blocked: " + str(exc))
          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("V2_ARCHIVE_KEY_HEX=" + key + "\n")
          print("Durable live archive key resolved using " + source + "; historical archive keys unchanged")
          PY
      - name: Real master discovery and verification
        timeout-minutes: 105
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/reports/master-run
          timeout --signal=TERM --kill-after=20s 6000s python v2/master_engine.py --archive v2/reports/master-run/inventory.enc --out v2/reports/master-run/output --limit 500 --max-seconds 5400
      - name: Record master run identity
        if: always()
        run: |
          mkdir -p v2/reports/master-run
          printf 'run_id=%s\ncommit_sha=%s\njob=master\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > v2/reports/master-run/run-identity.txt
          cat v2/reports/master-run/run-identity.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results even on partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-master-run-${{ github.run_id }}
          path: |
            v2/reports/master-run/output/
            v2/reports/master-run/inventory.enc
            v2/reports/master-run/run-identity.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Protect working tree
        if: always()
        run: |
          git diff --exit-code -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
