name: V2 Real IBO Candidate Scan
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibo-candidate-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current protected V2 scanner from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install 'cryptography>=42,<47'
      - name: Validate archive secret and offline safety tests
        env:
          V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#V2_ARCHIVE_PASSPHRASE}" -lt 16 ]; then
            echo "::error::V2_ARCHIVE_PASSPHRASE secret missing or too short"
            exit 1
          fi
          python3 v2/test_secure_archive_roundtrip.py
          python3 v2/test_consolidate_inventory.py
          python3 v2/test_real_ibo_scan_offline.py
      - name: Scan live HTTPS sources and check HLS manifests
        env:
          V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
        run: |
          python3 v2/real_ibo_scan.py --workers 16 --timeout 8 --limit 500
      - name: Validate scanner report and archive restoration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('v2/reports/ibo-real-scan-report.json').read_text())
          if report.get('status') not in ('READY_FOR_DEVICE_TEST', 'NO_VERIFIED_CANDIDATES'):
              raise SystemExit('Scan incomplete or invalid status: ' + str(report.get('status')))
          if report.get('archive_restore_test_passed') is not True:
              raise SystemExit('Encrypted inventory restoration not verified')
          if report.get('failed_sources') or report.get('source_drops'):
              raise SystemExit('Source failures or significant source drops')
          if report.get('playback_verified_on_device') is not False:
              raise SystemExit('Device verification claim must remain false')
          if report.get('exported_part1', 0) > 500:
              raise SystemExit('Batch size exceeds 500')
          files = [Path(p) for p in report.get('written_parts', [])]
          if report.get('status') == 'READY_FOR_DEVICE_TEST' and not files:
              raise SystemExit('Verified candidates reported without batch files')
          if report.get('status') == 'READY_FOR_DEVICE_TEST' and len(files) != report.get('part_count'):
              raise SystemExit('Batch count does not match scan report')
          if report.get('status') == 'READY_FOR_DEVICE_TEST' and report.get('av_verified', 0) <= 0:
              raise SystemExit('Ready status without AV-verified candidates')
          if report.get('status') == 'NO_VERIFIED_CANDIDATES' and files:
              raise SystemExit('Unexpected batches reported for zero candidates')
          if report.get('status') == 'NO_VERIFIED_CANDIDATES' and report.get('av_verified', 0) != 0:
              raise SystemExit('Zero-candidate status contradicts verified count')
          if any(not path.is_file() for path in files):
              raise SystemExit('Reported batch file missing')
          print('PASS: scanner report and archive restoration gate')
          PY
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-real-scan-report
          path: v2/reports/ibo-real-scan-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check whether verified batches exist
        id: batches
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path('v2/reports/ibo-real-scan-report.json').read_text())
          files = report.get('written_parts', [])
          print('found=' + ('true' if files and all(Path(p).is_file() for p in files) else 'false'))
          PY
      - name: Upload candidate playlists
        if: steps.batches.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IBO_YENI_ADAYLAR_500_BATCHES
          path: |
            v2/reports/IBO_YENI_ADAYLAR_PART1.m3u8
            v2/reports/IBO_YENI_ADAYLAR_PART1_PART*.m3u8
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-candidate-inventory-encrypted
          path: v2/reports/ibo-candidate-inventory.jsonl*.enc
          if-no-files-found: warn
          retention-days: 7
