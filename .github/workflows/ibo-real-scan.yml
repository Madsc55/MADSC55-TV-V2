name: V2 Real IBO Candidate Scan
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibo-candidate-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current protected V2 scanner from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install 'cryptography>=42,<47'
      - name: Validate archive secret and offline safety tests
        env:
          V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#V2_ARCHIVE_PASSPHRASE}" -lt 16 ]; then
            echo "::error::V2_ARCHIVE_PASSPHRASE secret missing or too short"
            exit 1
          fi
          python3 v2/test_secure_archive_roundtrip.py
          python3 v2/test_consolidate_inventory.py
          python3 v2/test_real_ibo_scan_offline.py
      - name: Scan live HTTPS sources and check HLS manifests
        env:
          V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
        run: |
          python3 v2/real_ibo_scan.py --workers 16 --timeout 8 --limit 500
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-real-scan-report
          path: v2/reports/ibo-real-scan-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidate playlists
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IBO_YENI_ADAYLAR_500_BATCHES
          path: |
            v2/reports/IBO_YENI_ADAYLAR_PART1.m3u8
            v2/reports/IBO_YENI_ADAYLAR_PART1_PART*.m3u8
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-candidate-inventory-encrypted
          path: v2/reports/ibo-candidate-inventory.jsonl*.enc
          if-no-files-found: warn
          retention-days: 7
