name: V2 Real IBO Candidate Scan
on:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - .github/workflows/ibo-real-scan.yml
      - v2/real_ibo_scan.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Scan live HTTPS sources and check HLS manifests
        id: scan
        continue-on-error: true
        run: |
          python3 v2/real_ibo_scan.py --workers 16 --timeout 8 --limit 2000
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-real-scan-report
          path: v2/reports/ibo-real-scan-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidate playlist when scan succeeds
        if: steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: IBO_YENI_ADAYLAR_2000_PART1
          path: v2/reports/IBO_YENI_ADAYLAR_2000_PART1.m3u8
          if-no-files-found: error
          retention-days: 7
      - name: Propagate scan failure
        if: steps.scan.outcome != 'success'
        run: exit 1
