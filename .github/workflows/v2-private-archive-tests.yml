name: V2 Private Archive Tests
on:
  push:
    branches:
      - madsc/v2-encrypted-archive-20261101
    paths:
      - 'v2/private_archive.py'
      - 'v2/test_private_archive.py'
      - '.github/workflows/v2-private-archive-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: Run archive regression tests
        run: python v2/test_private_archive.py
