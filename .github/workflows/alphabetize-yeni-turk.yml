name: Alphabetize YENI TURK
on:
  push:
    paths:
      - '.github/workflows/alphabetize-yeni-turk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort Turkish channels alphabetically
        run: python v2/sort_new_turk_alphabetically.py
      - name: Commit sorted playlist
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Alphabetize YENI TURK channel entries'
          git push
