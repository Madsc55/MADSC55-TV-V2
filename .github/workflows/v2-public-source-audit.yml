name: V2 Parolasiz Gercek Kaynak Denetimi
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-public-source-audit.yml'
      - 'v2/public_source_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner import dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Fetch actual IPTV sources and count TR/AZ candidates
        run: python v2/public_source_audit.py
      - name: Preserve source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-public-real-network-source-audit
          path: v2/reports/public-source-audit.json
          if-no-files-found: warn
          retention-days: 30
