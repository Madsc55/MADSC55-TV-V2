name: V2 Logo Backup (manual read-only export)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-logo-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror logos
        run: python v2/mirror_logos.py
      - name: Protect immutable IBO before delivering read-only artifact
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
      - name: Upload local output for manual review (never publish to main)
        uses: actions/upload-artifact@v4
        with:
          name: v2-logo-backup-read-only-preview
          path: |
            v2/logos/
          if-no-files-found: warn
          retention-days: 14
