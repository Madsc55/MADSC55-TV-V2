name: V2 Turkish TV Health and Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/turkish_tv_health.py'
      - 'master.py'
      - 'v2/test_offline.py'
      - 'v2/discover.py'
      - 'v2/assets_health.py'
      - 'v2/logo_attribution.py'
      - 'v2/epg_integrity.py'
      - '.github/workflows/v2-turkish-tv-health.yml'
  schedule:
    - cron: '23 4,16 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube metadata verifier
        run: python -m pip install "yt-dlp>=2026.1"
      - name: Syntax validation
        run: python -m py_compile master.py v2/discover.py v2/turkish_tv_health.py v2/assets_health.py v2/logo_attribution.py v2/epg_integrity.py v2/test_offline.py
      - name: Offline regression tests
        run: python3 v2/test_offline.py
      - name: Audit live channels and discover Turkish TV (read only)
        run: python3 master.py --run
      - name: Upload private run artifact (not committed to playlist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-turkish-tv-health
          path: |
            v2/reports/turkish-tv-health.json
            v2/reports/assets-health.json
            v2/reports/logo-attribution.json
            v2/reports/epg-integrity.json
          if-no-files-found: warn
          retention-days: 30
