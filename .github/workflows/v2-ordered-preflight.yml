name: V2 Sirali Hazirlik Testleri
on:
  push:
    branches: [main, madsc/v2-discovery-bulk-20261031]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ordered-preflight.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ordered-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-ordered-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q v2
  protect:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2/test_playlist_invariants.py
  discovery-tests:
    needs: protect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2/test_discovery_offline_regressions.py
      - run: python v2/test_source_provenance.py
      - run: python v2/test_public_metadata_redaction.py
      - run: python v2/test_source_inventory_contract.py
      - run: python v2/test_source_loss_audit.py
      - run: python v2/test_webpage_source_discovery.py
      - run: python v2/test_run_webpage_playlist_discovery.py
      - run: python v2/test_gist_filename_discovery.py
      - run: python v2/test_github_partial_discovery.py
      - run: python v2/test_partial_source_coverage.py
      - run: python v2/test_reference_classifier.py
      - run: python v2/test_forge_source_discovery.py
      - run: python v2/test_forge_source_review.py
      - run: python v2/test_forge_api_safety.py
      - run: python v2/test_source_availability_audit.py
      - run: python v2/test_run_public_inventory.py
      - run: python v2/test_fetch_source_gate.py
      - name: Grouped Scribd SlideShare Internet Archive and coordinator regressions
        run: |
          PYTHONPATH=v2 python -m unittest -v test_document_platform_discovery test_run_all_discovery
      - run: python v2/test_github_source_safety.py
      - run: python v2/test_github_source_approval.py
      - run: python v2/test_partial_scan_fail_closed.py
      - run: python v2/test_restore_evidence_safety.py
      - run: python v2/test_run_live_page_discovery.py
      - run: python v2/test_cross_source_archive_parity.py
      - run: python v2/test_live_page_discovery.py
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python v2/test_archive_incremental_dedup.py
      - run: python v2/test_archive_backup_restore_drill.py
      - run: python v2/test_encrypted_archive.py
      - run: python v2/test_archive_acceptance_gate.py
  safety:
    needs: discovery-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2/test_unified_safety_contract.py
      - name: Verify all Actions permissions and triggers with pinned parser
        run: |
          python -m pip install PyYAML==6.0.2
          python v2/actions_trigger_protection_audit.py --workflows .github/workflows


  document-platform-live-audit:
    name: Read-only live public Scribd SlideShare Internet Archive audit in one job
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'test(v2): grouped public document adapter acceptance'
    needs: safety
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeat all three adapters only as one grouped regression suite
        run: |
          PYTHONPATH=v2 python -m unittest -v test_document_platform_discovery test_run_all_discovery test_run_webpage_playlist_discovery test_webpage_source_discovery test_source_inventory_contract
          python v2/test_playlist_invariants.py
      - name: Scan all three public reference sources, no login or stream promotion
        run: |
          PYTHONPATH=v2 python v2/document_platform_discovery.py --scan-public-documents
          PYTHONPATH=v2 python -c "from document_platform_discovery import accepted_sources; print('Safe document source handoff:', len(accepted_sources()))"
      - name: Upload anonymous adapter coverage and errors only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-public-document-source-acceptance-${{ github.run_id }}
          path: v2/reports/document-platform-references.json
          if-no-files-found: warn
          retention-days: 30
