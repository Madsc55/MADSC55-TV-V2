name: V2 Sirali Hazirlik Testleri
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ordered-preflight.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: v2-ordered-preflight
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all V2 Python sources
        run: python -m compileall -q v2
      - name: Confirm playlist safety test compiles
        run: python -m py_compile v2/test_playlist_invariants.py v2/real_ibo_scan.py
  protect:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2/test_playlist_invariants.py
  discovery-tests:
    needs: protect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Required test_discovery_offline_regressions.py
        run: python v2/test_discovery_offline_regressions.py
      - name: Required test_source_provenance.py
        run: python v2/test_source_provenance.py
      - name: Required test_source_inventory_contract.py
        run: python v2/test_source_inventory_contract.py
      - name: Required test_source_loss_audit.py
        run: python v2/test_source_loss_audit.py
      - name: Required test_archive_acceptance_gate.py
        run: python v2/test_archive_acceptance_gate.py
  safety:
    needs: discovery-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python v2/test_unified_safety_contract.py
