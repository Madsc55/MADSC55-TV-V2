name: V2 Stage A Checkpoint Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/scan_checkpoint.py'
      - 'v2/test_scan_checkpoint.py'
      - 'v2/real_ibo_scan.py'
      - 'v2/secure_archive.py'
      - '.github/workflows/v2-stage-a-checkpoint-acceptance.yml'
permissions:
  contents: read
jobs:
  checkpoint-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted checkpoint dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile real scanner and checkpoint modules
        run: python -m py_compile v2/real_ibo_scan.py v2/scan_checkpoint.py v2/test_scan_checkpoint.py
      - name: Verify encrypted checkpoint resume, failure and stale-evidence rejection
        run: PYTHONPATH=v2 python -m unittest -v test_scan_checkpoint
      - name: Verify real scan offline invariants
        run: PYTHONPATH=v2 python -m unittest -v test_real_ibo_scan_offline
      - name: Acceptance boundary
        run: |
          echo 'Checkpoint regression is offline evidence only.'
          echo 'Do not mark Stage A done without a complete real scan, restored checkpoint evidence and fresh video+audio decode.'
