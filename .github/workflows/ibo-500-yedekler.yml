name: Import 500 channels to IBO backups
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14136864383/zip -o /tmp/scan.zip
          unzip -p /tmp/scan.zip IBO_YENI_ADAYLAR_PART1.m3u8 > /tmp/candidates.m3u8
      - name: Preserve original and append unique 500
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          target=Path('MADSC55_TV_IBO_CALISANLAR_TEST.m3u8')
          original=target.read_text(encoding='utf-8-sig')
          candidate=Path('/tmp/candidates.m3u8').read_text(encoding='utf-8-sig')
          def parse(s):
              lines=s.splitlines()
              return [(a,b.strip()) for a,b in zip(lines,lines[1:]) if a.startswith('#EXTINF:') and b.strip() and not b.startswith('#')]
          current=parse(original)
          assert len(current)==876, f'Expected 876, got {len(current)}'
          seen={u for _,u in current}
          added=[]
          for meta,url in parse(candidate):
              if url in seen: continue
              seen.add(url)
              if 'group-title="' in meta:
                  meta=re.sub(r'group-title="[^"]*"', 'group-title="🗂️ YEDEKLER (500 YENİ)"',meta)
              else:
                  meta=meta.replace(',', ' group-title="🗂️ YEDEKLER (500 YENİ)",',1)
              added.extend([meta,url])
              if len(added)==1000:break
          assert len(added)==1000, f'Only {len(added)//2} distinct channels'
          shutil.copyfile(target,'MADSC55_TV_IBO_CALISANLAR_ONCE_500_YEDEK.m3u8')
          target.write_text(original.rstrip()+'\n'+'\n'.join(added)+'\n',encoding='utf-8')
          assert len(parse(target.read_text()))==1376
          PY
      - name: Submit safe update through pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b ibo-500-generated-${{ github.run_id }}
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 MADSC55_TV_IBO_CALISANLAR_ONCE_500_YEDEK.m3u8
          git commit -m 'Add 500 scanned channels to YEDEKLER preserving original 876'
          git push -u origin HEAD
          gh pr create --base main --head ibo-500-generated-${{ github.run_id }} --title 'IBO: Add 500 channels to YEDEKLER' --body 'Preserves all 876 original entries and adds 500 unique scan candidates. Requires protected-branch checks.'
