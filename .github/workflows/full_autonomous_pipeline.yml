name: Full Autonomous Discovery and Acceptance
on:
  workflow_dispatch:
    inputs:
      source_feed:
        description: 'Approved public M3U/M3U8 feed URL (optional)'
        required: false
        type: string
      max_candidates:
        description: 'Maximum new candidates per run'
        default: '30'
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: autonomous-playlist
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded local-media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify existing playlist and safely discover/validate
        env:
          SOURCE_FEED: ${{ inputs.source_feed }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
        run: |
          python3 -m v2.full_autonomous_pipeline
      - name: Upload evidence (never publish stream URLs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-acceptance-evidence
          path: autonomous-evidence.json
      - name: Open review-only playlist pull request
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          playlist=MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          if git diff --quiet -- "$playlist"; then
            echo "No verified playlist additions; no PR needed"
            exit 0
          fi
          branch="autonomous/verified-candidates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$playlist"
          git commit -m "chore: propose verified stream candidates for review"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore: review verified AV stream candidates ($GITHUB_RUN_ID)" --body "Automated proposal only. Existing main playlist was not directly changed. Review source provenance, 685 locked-channel preservation, AV evidence, and language classifications before merging."
