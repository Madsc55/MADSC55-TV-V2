name: Full Autonomous Discovery and Acceptance
on:
  workflow_dispatch:
    inputs:
      source_feed:
        description: 'Approved public M3U/M3U8 feed URL (optional)'
        required: false
        type: string
      max_candidates:
        description: 'Maximum new candidates per run'
        default: '30'
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: autonomous-playlist
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded local-media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify existing playlist and safely discover/validate
        env:
          SOURCE_FEED: ${{ inputs.source_feed }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
        run: |
          python3 v2/full_autonomous_pipeline.py
      - name: Upload evidence (never publish stream URLs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-acceptance-evidence
          path: autonomous-evidence.json
      - name: Create playlist PR only when verified entries changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8; then
            echo "No AV-verified additions; no playlist PR."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="automation/verified-streams-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m "playlist: add independently decoded AV-verified streams"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "playlist: verified live AV additions (${GITHUB_RUN_ID})" --body "Automated fail-closed AV evidence; existing entries, categories and 685 protected channels unchanged. Review security gate before merge."
