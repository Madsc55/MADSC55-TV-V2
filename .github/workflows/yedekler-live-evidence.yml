name: YEDEKLER live AV evidence pilot
on:
  workflow_dispatch:
    inputs:
      secure_egress_attested:
        description: 'Confirm independently audited public-only egress is enforced on runner'
        required: true
        type: boolean
        default: false
      sample_limit:
        description: 'Number of unique streams (1-100)'
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  live-evidence:
    if: ${{ inputs.secure_egress_attested == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-tur
      - name: Verify playlist and run bounded read-only live sample
        env:
          MADSC55_SECURE_EGRESS_CONFIRMED: '1'
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
        run: |
          test -s YEDEKLER_PLAYLISTESI.m3u8
          python v2/yedekler_live_sample.py --playlist YEDEKLER_PLAYLISTESI.m3u8 --output "$RUNNER_TEMP/yedekler-live-results.jsonl" --limit "$SAMPLE_LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yedekler-live-evidence
          path: |
            ${{ runner.temp }}/yedekler-live-results.jsonl
            ${{ runner.temp }}/sample-*.json
          retention-days: 7
