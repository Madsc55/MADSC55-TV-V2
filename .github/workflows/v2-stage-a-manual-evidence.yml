name: V2 Stage A Manual Evidence Scan
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify Stage A
        id: verify
        continue-on-error: true
        run: bash v2/scripts/stage_A_verify.sh
      - name: Upload Stage A evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-stage-a-evidence
          path: |
            v2/evidence/av_report.csv
            v2/evidence/recovery.csv
            v2/evidence/epg_gap.csv
            v2/evidence/input_sha256.json
            v2/evidence/stage_A_acceptance.md
            v2/evidence/stage_A_errors.log
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when verification fails
        if: steps.verify.outcome != 'success'
        run: exit 1
