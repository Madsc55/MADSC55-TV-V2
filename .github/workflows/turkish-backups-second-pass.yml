name: Turkish backups second pass
on:
  push:
    paths:
      - '.github/workflows/turkish-backups-second-pass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move overlooked Turkish live channels
        run: python v2/turkish_backups_second_pass.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Move more Turkish channels to YENI TURK'
          git push
