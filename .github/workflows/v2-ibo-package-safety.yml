name: V2 IBO 1000-2000 Package Safety
on:
  push:
    branches:
      - v2/ibo-packages-28-30-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile package builder and acceptance tests
        run: python -m py_compile v2/build_verified_ibo_packages.py v2/test_build_verified_ibo_packages.py v2/test_ibo_production_guard.py
      - name: Verify fail-closed package safety
        run: python -m unittest discover -s v2 -p 'test_*ibo*package*.py' -v && python v2/test_ibo_production_guard.py

      - name: Confirm stage-4 setup without scanning old channels
        run: |
          python v2/build_verified_ibo_packages.py --check-setup > /tmp/v2-stage4-setup.json
          python -c 'import json; r=json.load(open("/tmp/v2-stage4-setup.json")); assert r["package_targets"] == [1000, 2000]; assert r["m3u_integrity_checks"] == "CONFIGURED_NOT_EXECUTED"; assert r["production_packages_created"] is False; assert r["final_av_acceptance"] == "DEFERRED_UNTIL_POST_34_DISCOVERY"'
          test ! -e IBO_AV_VERIFIED_1000.m3u8
          test ! -e IBO_AV_VERIFIED_2000.m3u8
