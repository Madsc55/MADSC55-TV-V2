name: V2 Stage 4 Independent S3 Restore
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful live Stage 4 Actions run ID"
        required: true
        type: string
      receipt_sha256:
        description: "SHA256 of receipt.json from that run"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  s3-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require configured independent S3 destination
        env:
          BUCKET: ${{ secrets.V2_S3_BUCKET }}
          REGION: ${{ secrets.V2_S3_REGION }}
          ACCESS: ${{ secrets.V2_S3_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.V2_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" && test -n "$REGION" && test -n "$ACCESS" && test -n "$SECRET"
          [[ "${{ inputs.source_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.receipt_sha256 }}" =~ ^[0-9a-f]{64}$ ]]
      - name: Download original sealed live archive from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/source"
          gh run download "${{ inputs.source_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "stage4-live-inventory-${{ inputs.source_run_id }}-1" --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/inventory.enc"
          test -s "$RUNNER_TEMP/source/receipt.json"
          echo "${{ inputs.receipt_sha256 }}  $RUNNER_TEMP/source/receipt.json" | sha256sum -c -
      - name: Upload original encrypted archive and receipt to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.V2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.V2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.V2_S3_REGION }}
          BUCKET: ${{ secrets.V2_S3_BUCKET }}
        run: |
          set -euo pipefail
          prefix="stage4-24/${{ inputs.source_run_id }}/${{ github.run_id }}"
          aws s3 cp "$RUNNER_TEMP/source/inventory.enc" "s3://$BUCKET/$prefix/inventory.enc" --sse AES256 --no-progress
          aws s3 cp "$RUNNER_TEMP/source/receipt.json" "s3://$BUCKET/$prefix/receipt.json" --sse AES256 --no-progress
  s3-restore:
    needs: s3-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 5a1766dfcd5e37eca0cfcaf9e10129116c67db2e
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==44.0.2
      - name: Download sealed archive from S3 into an independent runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.V2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.V2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.V2_S3_REGION }}
          BUCKET: ${{ secrets.V2_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" && test -n "$AWS_DEFAULT_REGION" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          mkdir -m 700 -p "$RUNNER_TEMP/s3-restore"
          prefix="stage4-24/${{ inputs.source_run_id }}/${{ github.run_id }}"
          aws s3 cp "s3://$BUCKET/$prefix/inventory.enc" "$RUNNER_TEMP/s3-restore/inventory.enc" --no-progress
          aws s3 cp "s3://$BUCKET/$prefix/receipt.json" "$RUNNER_TEMP/s3-restore/receipt.json" --no-progress
          test -s "$RUNNER_TEMP/s3-restore/inventory.enc"
          echo "${{ inputs.receipt_sha256 }}  $RUNNER_TEMP/s3-restore/receipt.json" | sha256sum -c -
      - name: Authenticate S3-restored bytes, decrypt and verify original history and AV
        working-directory: engine
        env:
          CONFIGURED_ARCHIVE_KEY: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
          CONFIGURED_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
          EXPECTED_RECEIPT: ${{ inputs.receipt_sha256 }}
          GITHUB_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          umask 077
          PYTHONPATH=v2 python ../v2/stage4_live_acceptance.py verify "$RUNNER_TEMP/s3-restore"
          test "$(git -C .. hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = 165c726cd9211f9f51c31f1c718e0911bab79e1b
