name: V2 Actions Trigger & Protected Playlist Gate (58 workflows)
on:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - '.github/workflows/**'
      - 'v2/actions_trigger_protection_audit.py'
      - 'v2/test_actions_trigger_protection_audit.py'
      - 'v2/actions_default_branch_audit.py'
      - 'v2/test_actions_default_branch_audit.py'
      - 'v2/document_platform_discovery.py'
      - 'v2/test_document_platform_discovery.py'
      - 'v2/run_all_discovery.py'
      - 'v2/discover.py'
      - 'v2/final_batch_acceptance.py'
      - 'v2/historical_targeted_playback.py'
      - 'v2/test_historical_targeted_playback.py'
      - 'v2/orphan_m3u_recovery.py'
      - 'v2/test_orphan_m3u_recovery.py'
      - 'v2/orphan_resolution_gate.py'
      - 'v2/test_orphan_resolution_gate.py'
      - 'v2/main_playlist_candidate_bridge.py'
      - 'v2/test_main_playlist_candidate_bridge.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-actions-trigger-protection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  grouped-protection-check:
    name: All Actions triggers, write permissions, protected playlist, and history
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin offline YAML workflow parser
        run: python -m pip install PyYAML==6.0.2 cryptography==44.0.2
      - name: Verify protected original playlist and history fingerprints
        shell: bash
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Fetch exact default-branch workflow snapshot without checkout or push
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main^{commit}
      - name: All 58 workflows and related protections validated in one batch
        shell: bash
        run: |
          set -o pipefail
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python -m unittest -v \
            test_actions_trigger_protection_audit \
            test_actions_default_branch_audit \
            test_actions_monitor \
            test_source_loss_audit \
            test_document_platform_discovery \
            test_run_all_discovery \
            test_orphan_baseline_guard \
            test_run60_source_ledger \
            2>&1 | tee v2/reports/ci/actions-trigger-protection-tests.log
          PYTHONPATH=v2 python v2/test_playlist_invariants.py \
            2>&1 | tee -a v2/reports/ci/actions-trigger-protection-tests.log
          python v2/actions_trigger_protection_audit.py \
            --workflows .github/workflows \
            --output v2/reports/ci/actions-trigger-protection.json
      - name: Inspect real default-branch Actions permissions and active workflow states
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=v2 python v2/actions_default_branch_audit.py \
            --revision refs/remotes/origin/main \
            --output v2/reports/ci/main-default-branch-risk.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('v2/reports/ci/main-default-branch-risk.json').read_text())
          message=(
              "Default-branch readiness: " + report["readiness"] +
              " | main revision: " + report["main_revision"] +
              " | workflow files: " + str(report["source_files"]) +
              " | write/push definitions: " + str(report["counts"]["writable_publisher"]) +
              " | schedules: " + str(report["counts"]["scheduled"]) +
              " | branch protected: " + str(report["branch_protected"]) +
              "\n"
          )
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("### V2 main runtime readiness (read-only)\n\n" + message)
          PY
      - name: Save only anonymous guard result and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-actions-trigger-protection-${{ github.run_id }}
          path: |
            v2/reports/ci/actions-trigger-protection.json
            v2/reports/ci/actions-trigger-protection-tests.log
            v2/reports/ci/main-default-branch-risk.json
          if-no-files-found: warn
          retention-days: 30

  final-worldwide-acceptance:
    name: One-time worldwide M3U AV decode, metadata routing and RSA sealed evidence
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'feat(v2): execute final read-only worldwide AV acceptance scan'
    needs: grouped-protection-check
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned crypto and local video audio decoders
        run: |
          python -m pip install cryptography==44.0.2 PyYAML==6.0.2
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe && command -v ffmpeg
      - name: Grouped read-only scanner, orphan, language and historic protection regressions
        shell: bash
        run: |
          PYTHONPATH=v2 python -m unittest -v test_final_batch_acceptance test_final_worldwide_report_gate test_orphan_m3u_recovery test_orphan_baseline_guard test_m3u_source_content_audit test_historical_targeted_playback test_source_loss_audit test_language_evidence_functional
          python v2/test_playlist_invariants.py
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: Expand approved GitHub and GitLab Codeberg discovery references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python v2/github_source_discovery.py || echo 'GitHub reference discovery unavailable; audited fixed sources continue'
          python v2/run_forge_source_discovery.py || echo 'Forge reference discovery unavailable; audited fixed sources continue'
      - name: Read-only public Scribd SlideShare Internet Archive source intake
        run: |
          PYTHONPATH=v2 python v2/document_platform_discovery.py --scan-public-documents
          PYTHONPATH=v2 python -c "from document_platform_discovery import accepted_sources; print('Validated document source feeds:', len(accepted_sources()))"
      - name: All approved URL identities and AV decode in bounded parallel batches
        shell: bash
        run: |
          PYTHONPATH=v2 python v2/final_batch_acceptance.py --workers 24 --budget-seconds 14400
      - name: Verify full worldwide AV coverage and RSA sealed manifests in one audit
        run: PYTHONPATH=v2 python v2/final_worldwide_report_gate.py --report v2/reports/ci/final-worldwide-acceptance.json
      - name: Preserve only anonymous report and private RSA encrypted stream candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-final-worldwide-acceptance-${{ github.run_id }}
          path: |
            v2/reports/ci/final-worldwide-acceptance.json
            v2/reports/ci/final-worldwide-*.sealed
          if-no-files-found: warn
          retention-days: 30

  document-platform-live-audit:
    name: Three public document adapters, one batch plus anonymous live coverage
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'feat(v2): integrate Scribd SlideShare Internet Archive source adapters'
    needs: grouped-protection-check
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grouped source adapter and source handoff offline safety tests
        run: |
          PYTHONPATH=v2 python -m unittest -v test_document_platform_discovery test_run_all_discovery test_run_webpage_playlist_discovery test_webpage_source_discovery test_source_inventory_contract
          python v2/test_playlist_invariants.py
      - name: Real anonymous public-document discovery, no playlist writing
        run: |
          PYTHONPATH=v2 python v2/document_platform_discovery.py --scan-public-documents
          PYTHONPATH=v2 python -c "from document_platform_discovery import accepted_sources; print('Safe source handoff:', len(accepted_sources()))"
      - name: Save anonymous coverage only, no source URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-public-document-adapters-${{ github.run_id }}
          path: v2/reports/document-platform-references.json
          if-no-files-found: warn
          retention-days: 30

  orphan-46-live-recovery:
    name: Exact original 50 identities and 46 missing AV streams — one guarded batch
    if: >-
      github.event_name == 'push' && github.event.head_commit.message == 'feat(v2): run exact 46 orphan AV rescue with pinned public registry'
    needs: grouped-protection-check
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned crypto and safe read-only video audio verifier
        run: |
          python -m pip install cryptography==44.0.2 PyYAML==6.0.2
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Verify original IBO and all 4955 historical identity fingerprints
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = '4b1c3cea4b5107a425abab60f62d41f9f81e05a7'
          test "$(sha256sum v2/history/stage3-4955-hash-only.jsonl | cut -d' ' -f1)" = 'ee00a844a028e3410715d411467a2d3306f5f5cc4565766140b6438e786cdd27'
      - name: One grouped offline regression suite for 50 identities and loss guards
        run: |
          PYTHONPATH=v2 python -m unittest -v test_orphan_m3u_recovery test_orphan_iptv_org_registry test_orphan_source_expansion test_main_playlist_candidate_bridge test_orphan_resolution_gate test_orphan_baseline_guard test_m3u_source_content_audit test_historical_targeted_playback test_source_loss_audit test_document_platform_discovery
      - name: Collect vetted public Scribd SlideShare Internet Archive M3U sources
        run: |
          PYTHONPATH=v2 python v2/document_platform_discovery.py --scan-public-documents
      - name: Discover bounded public source references for exact orphan identity recovery only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=v2 python - <<'PY'
          import github_source_discovery as source
          source.QUERIES = ["turkish iptv m3u", "azerbaijan iptv m3u", "tr iptv playlist"]
          source.MAX_REPOS = 45
          source.MAX_FILES = 60
          source.main()
          PY
          PYTHONPATH=v2 python v2/run_forge_source_discovery.py --scan-public-forges
      - name: Inspect pinned main 38 YEDEKLER and separate 3964 foreign archive read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
          mkdir -p "$RUNNER_TEMP/v2-protected-source-snapshots"
          git show 'refs/remotes/origin/main:MADSC55_TV_IBO_CALISANLAR_TEST.m3u8' > "$RUNNER_TEMP/v2-protected-source-snapshots/main-ibo.m3u8"
          git show 'refs/remotes/origin/main:v2/arsiv/yabanci_yedekler_2026-11-02_3964.m3u8' > "$RUNNER_TEMP/v2-protected-source-snapshots/foreign-archive.m3u8"
          PYTHONPATH=v2 python - <<'PY'
          import os
          from pathlib import Path
          from main_playlist_candidate_bridge import validated_v2_main_catalog
          parent = Path(os.environ["RUNNER_TEMP"]) / "v2-protected-source-snapshots"
          _, report = validated_v2_main_catalog(parent / "main-ibo.m3u8", parent / "foreign-archive.m3u8")
          print("Protected V2 source-only identity bridge:", report)
          PY
      - name: Fetch real publisher history and IPTV-org registry and probe all exact candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v2/reports/ci
          PYTHONPATH=v2 python v2/orphan_m3u_recovery.py \
            --history-revisions 300 \
            --include-public-registry \
            --include-public-discovery \
            --v2-main-playlist-snapshot "$RUNNER_TEMP/v2-protected-source-snapshots/main-ibo.m3u8" \
            --v2-main-foreign-archive-snapshot "$RUNNER_TEMP/v2-protected-source-snapshots/foreign-archive.m3u8" \
            --public-key v2/config/stage3_transit_public.pem \
            --report v2/reports/ci/orphan-46-exact-recovery-anonymous.json \
            --sealed v2/reports/ci/orphan-46-live-av.sealed \
            --all-candidates-sealed v2/reports/ci/orphan-46-all-exact-candidates.sealed \
            --immutable-orphan-baseline v2/history/m3u-orphan-50-hash-baseline.json
      - name: Separate real AV, 32-candidate and 13-missing-source identity counts
        shell: bash
        run: |
          PYTHONPATH=v2 python v2/orphan_resolution_gate.py \
            --report v2/reports/ci/orphan-46-exact-recovery-anonymous.json \
            --output v2/reports/ci/orphan-50-resolution-anonymous.json
      - name: Fail closed if any of the 46 still lacks video and audio proof
        shell: bash
        run: |
          PYTHONPATH=v2 python - <<'PY'
          import json
          from pathlib import Path
          f=Path('v2/reports/ci/orphan-46-exact-recovery-anonymous.json')
          d=json.loads(f.read_text(encoding='utf-8'))
          assert d.get('protected_playlist_modified') is False
          assert d.get('plain_stream_urls_reported') is False
          guard=d.get('immutable_orphan_identity_guard',{})
          assert guard.get('original_source_occurrences') == 55
          assert guard.get('original_distinct_extinf_identities') == 50
          assert guard.get('original_occurrences_missing_metadata') == 0
          assert d.get('all_proven_url_candidates_sealed_for_future_retest') == d.get(
             'unique_candidate_urls_historically_or_officially_proven')
          found={row['extinf_sha256'] for row in d['records']
                 if any(c.get('video_stream') and c.get('audio_stream') for c in row['candidates'])}
          missing=50-len(found)
          assert len({r['extinf_sha256'] for r in d['records']}) == 50
          print('REAL_RESCUED_IDENTITIES',len(found))
          print('REAL_UNRESOLVED_IDENTITIES',missing)
          print('ALL_PROVEN_CANDIDATES_RSA_SEALED',d.get(
              'all_proven_url_candidates_sealed_for_future_retest'))
          print('PUBLIC_IPTV_ORG_REGISTRY',d.get('public_iptv_org_registry_reconciliation',{}).get('status'))
          if missing:
              raise SystemExit('RECOVERY_INCOMPLETE_REAL_VIDEO_AUDIO_REQUIRED: '+str(missing))
          PY
      - name: Preserve anonymous hashes and private encrypted recovery only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-orphan-46-one-batch-${{ github.run_id }}
          path: |
            v2/reports/ci/orphan-46-exact-recovery-anonymous.json
            v2/reports/ci/orphan-50-resolution-anonymous.json
            v2/reports/ci/orphan-46-live-av.sealed
            v2/reports/ci/orphan-46-all-exact-candidates.sealed
            v2/reports/document-platform-references.json
          if-no-files-found: warn
          retention-days: 30
