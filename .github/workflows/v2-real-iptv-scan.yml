name: V2 Gercek IPTV Tarama ve IBO Paketleri
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-real-network-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AV verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'cryptography>=42,<47'
      - name: Require encrypted archive key
        run: |
          if [ -z "$V2_ARCHIVE_PASSPHRASE" ]; then
            echo "::error::Missing V2_ARCHIVE_PASSPHRASE GitHub Actions secret; real scan cannot safely persist inventory"
            exit 1
          fi
      - name: Discover new GitHub M3U sources before AV scanning
        run: |
          python v2/github_source_discovery.py
      - name: Install YouTube discovery dependency
        run: python -m pip install 'yt-dlp>=2026.1'
      - name: Discover worldwide repository metadata from GitHub GitLab Codeberg
        continue-on-error: true
        run: python v2/discovery_34.py --network
      - name: Discover official broadcaster directory references
        continue-on-error: true
        run: python v2/official_sites_discovery.py --worldwide
      - name: Discover YouTube Live candidates and verify live metadata
        continue-on-error: true
        run: python v2/youtube_discovery.py
      - name: Discover parsed M3U files in GitLab and Codeberg repositories
        continue-on-error: true
        run: python v2/federated_m3u_source_discovery.py
      - name: Integrate six discovery adapters into unified candidate report
        run: python v2/discovery_34_integrate.py
      - name: Resolve official and YouTube live pages to encrypted direct HLS candidates
        run: python v2/direct_stream_resolver.py --input v2/reports/discovery-34-integrated.json --output v2/reports/resolved-direct-streams.jsonl.enc
      - name: Read-only live EPG source and schedule integrity audit
        continue-on-error: true
        run: |
          # Advisory evidence only: this never modifies madsc-epg.xml.
          python v2/epg_integrity.py
      - name: Generate separate EPG candidate from actual XMLTV feeds for review
        continue-on-error: true
        run: |
          # Save in v2/reports; the protected root EPG remains untouched.
          timeout --signal=TERM 180s python v2/build_epg.py --candidate-only
      - name: Restore authenticated progress from the latest completed real scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-resume
          # A prior partial-discovery scan may exit success while preserving
          # observations. Searching only FAILED runs loses its newer checkpoint.
          # Current running/queued jobs must never be selected as resume input.
          PREVIOUS_RUNS="$(gh run list --workflow v2-real-iptv-scan.yml --branch main --limit 12 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' || true)"
          for PREVIOUS_RUN in $PREVIOUS_RUNS; do
            RESUME_DIR="/tmp/v2-resume/$PREVIOUS_RUN"
            mkdir -p "$RESUME_DIR"
            if ! gh run download "$PREVIOUS_RUN" --name v2-real-scan-evidence --dir "$RESUME_DIR" 2>/dev/null; then
              continue
            fi
            if [ -f "$RESUME_DIR/ibo-scan-progress.enc" ] && [ ! -L "$RESUME_DIR/ibo-scan-progress.enc" ]; then
              install -m 600 "$RESUME_DIR/ibo-scan-progress.enc" v2/reports/ibo-scan-resume.enc
              echo "Encrypted checkpoint recovered from completed run $PREVIOUS_RUN; scanner checks identity and freshness."
              break
            fi
            if [ -f "$RESUME_DIR/ibo-candidate-inventory.jsonl.pending.enc" ] && [ ! -L "$RESUME_DIR/ibo-candidate-inventory.jsonl.pending.enc" ] && [ -f "$RESUME_DIR/ibo-real-scan-report.json" ]; then
              if ! STARTED_AT="$(gh run view "$PREVIOUS_RUN" --json createdAt --jq '.createdAt')"; then
                echo "::warning::Cannot verify previous run creation time; skipping candidate."
                continue
              fi
              if python v2/bootstrap_pending_checkpoint.py --inventory "$RESUME_DIR/ibo-candidate-inventory.jsonl.pending.enc" --report "$RESUME_DIR/ibo-real-scan-report.json" --observed-at "$STARTED_AT" --output v2/reports/ibo-scan-progress.enc; then
                install -m 600 v2/reports/ibo-scan-progress.enc v2/reports/ibo-scan-resume.enc
                echo "Legacy encrypted inventory converted from completed run $PREVIOUS_RUN."
                break
              else
                echo "::warning::Completed run $PREVIOUS_RUN pending evidence is not eligible; checking older evidence."
              fi
            fi
          done
          # No matching completed artifact means a clean scan; never invent
          # prior AV or mark an untested stream as verified.
      - name: Real network discovery and AV probe including discovered sources
        run: |
          CMD=(python v2/real_ibo_scan.py --worldwide --workers 12 --timeout 12 --limit 3000 --fail-fast-source-errors --tolerate-optional-discovery-failures --checkpoint-every 100 --retry-failed-limit 300 --resume-checkpoint v2/reports/ibo-scan-resume.enc --dynamic-sources v2/reports/github-source-discovery.json --integrated-candidates v2/reports/discovery-34-integrated.json --resolved-streams v2/reports/resolved-direct-streams.jsonl.enc)
          if [ -s v2/reports/stage-a-epg-candidate.xml ]; then
            CMD+=(--epg v2/reports/stage-a-epg-candidate.xml)
            echo "Real XMLTV candidate provided; only unique IDs with valid programmes can match"
          else
            echo "::warning::No current EPG candidate; #19 EPG acceptance remains open"
          fi
          "${CMD[@]}"
      - name: Export 1000 and 2000 real verified new URL batches only when discovery is complete
        run: |
          if python -c 'import json,sys; d=json.load(open("v2/reports/ibo-real-scan-report.json", encoding="utf-8")); sys.exit(0 if d.get("full_discovery_acceptance") is True else 1)'; then
            python v2/export_ibo_batches.py v2/reports/ibo-candidate-inventory.jsonl.enc v2/reports --live MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          else
            echo "::warning::Optional discovered feeds incomplete; accepted 1000/2000 packages intentionally withheld"
          fi
      - name: Require complete discovered-source evidence before green workflow status
        run: |
          # Partial discovery intentionally remains red even if the scanner
          # preserved its AES-authenticated observations successfully.
          python v2/validate_real_scan_acceptance.py --report v2/reports/ibo-real-scan-report.json
      - name: Audit remaining A-stage acceptance blockers separately from green scan
        if: always()
        run: |
          if [ -f v2/reports/ibo-real-scan-report.json ]; then
            # This never updates task statuses or any protected M3U. Even a
            # successful core scan must not imply source-ownership/EPG/device
            # and worldwide discovery adapter acceptance.
            python v2/stage_a_evidence_review.py \
              --scan v2/reports/ibo-real-scan-report.json \
              --epg v2/reports/stage-a-epg-build-report.json \
              --epg-integrity v2/reports/epg-integrity.json \
              --youtube v2/reports/youtube-live-candidates.json \
              --gitlab v2/reports/gitlab-m3u-source-discovery.json \
              --codeberg v2/reports/codeberg-m3u-source-discovery.json \
              --output v2/reports/stage-a-evidence-review.json
          else
            echo "::warning::No actual scan report available; A-stage acceptance remains open"
          fi
      - name: Upload reports and encrypted inventory even on scan failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-scan-evidence
          path: |
            v2/reports/epg-integrity.json
            v2/reports/stage-a-epg-candidate.xml
            v2/reports/stage-a-epg-build-report.json
            v2/reports/stage-a-evidence-review.json
            v2/reports/ibo-real-scan-report.json
            v2/reports/github-source-discovery.json
            v2/reports/gitlab-m3u-source-discovery.json
            v2/reports/codeberg-m3u-source-discovery.json
            v2/reports/discovery-34-candidates.json
            v2/reports/discovery-34-integrated.json
            v2/reports/resolved-direct-streams.jsonl.enc
            v2/reports/official-tv-sites.json
            v2/reports/youtube-live-candidates.json
            v2/reports/ibo-candidate-inventory.jsonl.enc
            v2/reports/ibo-candidate-inventory.jsonl.pending.enc
            v2/reports/ibo-scan-progress.enc
            v2/reports/IBO_AV_VERIFIED_*_PART*.m3u8
            v2/reports/IBO_YENI_ADAYLAR_PART*.m3u8
          if-no-files-found: warn
          retention-days: 30
