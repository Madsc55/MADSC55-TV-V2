name: Autonomous Discovery Read Only
on:
  workflow_dispatch:
    inputs:
      source_feed:
        description: 'Approved HTTPS M3U feed URL; empty means inventory-only report'
        required: false
        type: string
      locked_manifest_path:
        description: 'Optional reviewed 685-entry manifest path in repository'
        required: false
        type: string
      max_candidates:
        description: 'Maximum bounded candidate checks'
        default: '30'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  readonly-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local-only AV tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch immutable historical 685 manifest from Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery"
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path
          api = "https://api.github.com/repos/Madsc55/MADSC55-TV-V2/actions/artifacts/14681083208/zip"
          req = urllib.request.Request(api, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=60) as response:
              archive = response.read(8_000_001)
          if len(archive) > 8_000_000:
              raise ValueError("Historical artifact exceeds size limit")
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              manifest = z.read("manifest.json")
          expected = "b001bf48f07437e9ae67ed9f73b12ea9cfcab653523973435cf3b1cee3c31fcc"
          if hashlib.sha256(manifest).hexdigest() != expected:
              raise ValueError("Historical 685 manifest SHA-256 mismatch")
          data = json.loads(manifest)
          if len(data.get("retry_queue", [])) != 685:
              raise ValueError("Historical manifest is not 685 entries")
          Path(os.environ["RUNNER_TEMP"], "discovery", "locked_685_manifest.json").write_bytes(manifest)
          PY
      - name: Run bounded candidate discovery in disposable directory
        env:
          SOURCE_FEED: ${{ inputs.source_feed }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          PYTHONPATH: ${{ github.workspace }}
          LOCKED_MANIFEST_PATH: ${{ runner.temp }}/discovery/locked_685_manifest.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery"
          cp MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 "$RUNNER_TEMP/discovery/"
          cd "$RUNNER_TEMP/discovery"
          python3 -m v2.full_autonomous_pipeline
          python3 - <<'PY'
          import json
          from pathlib import Path
          SourcePath = Path
          p = Path("autonomous-evidence.json")
          data = json.loads(p.read_text())
          data["readonly_workflow"] = True
          data["canonical_playlist_unchanged"] = True
          import os
          from v2.ibo_single_playlist_transfer import parse
          from v2.full_autonomous_pipeline import (
              verify_685_locked_channels, classify_and_merge_to_main_playlist)
          manifest = os.environ.get("LOCKED_MANIFEST_PATH", "").strip()
          if manifest:
              from pathlib import Path as SourcePath
              root = SourcePath(os.environ["PYTHONPATH"]).resolve()
              selected = SourcePath(manifest).resolve()
              allowed = SourcePath(os.environ["RUNNER_TEMP"], "discovery").resolve()
              if not selected.is_relative_to(allowed) or not selected.is_file():
                  raise ValueError("Locked manifest must be downloaded into runner temporary directory")
              _, blocks = parse(SourcePath("MADSC55_TV_IBO_CALISANLAR_TEST.m3u8").read_bytes())
              verified, quarantined = verify_685_locked_channels(selected, blocks)
              data["locked_685_live_retry_executed"] = True
              data["locked_685_verified_av_count"] = len(verified)
              data["locked_685_quarantine_count"] = len(quarantined)
              data["locked_685_verified_evidence"] = verified
              data["locked_685_quarantine_evidence"] = quarantined
          else:
              data["locked_685_live_retry_executed"] = False
              data["locked_685_manifest_required"] = True
          _, blocks = parse(SourcePath("MADSC55_TV_IBO_CALISANLAR_TEST.m3u8").read_bytes())
          classified = classify_and_merge_to_main_playlist([], blocks)
          data["language_classification_executed"] = True
          data["language_verified_additions"] = len(classified)
          data["language_evidence_missing"] = True
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY
      - name: Publish discovery results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: ${{ runner.temp }}/discovery/autonomous-evidence.json
          if-no-files-found: warn
