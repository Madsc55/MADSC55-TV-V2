name: Kanalları ara — Tek Birleşik Görev
on:
  workflow_dispatch:
concurrency:
  group: v2-turkish-stream-review-main
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover GitHub sources once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python v2/github_source_discovery.py
      - name: Fetch and deduplicate all M3U candidates once
        run: python v2/discover.py --snapshot-output
      - name: Share safe candidate report
        uses: actions/upload-artifact@v4
        with:
          name: unified-source-candidates
          path: v2/reports/candidates.json
          if-no-files-found: error
      - name: Share private playback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: unified-private-playback-snapshot
          path: v2/reports/private-playback-snapshot.json
          retention-days: 1
          if-no-files-found: error
      - name: Share immutable discovery result
        uses: actions/upload-artifact@v4
        with:
          name: unified-source-snapshot
          path: v2/reports/github-source-discovery.json
          if-no-files-found: error

  playback:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        page: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Protect live playlist
        run: python v2/test_playlist_invariants.py
      - name: Download shared source discovery
        uses: actions/download-artifact@v4
        with:
          name: unified-source-snapshot
          path: v2/reports
      - name: Download private candidate snapshot
        uses: actions/download-artifact@v4
        with:
          name: unified-private-playback-snapshot
          path: v2/reports
      - name: Verify candidate playback in bounded batch
        env:
          PLAYBACK_PER_SOURCE: '500'
          PLAYBACK_PAGE: ${{ matrix.page }}
          PLAYBACK_SHARD_COUNT: '4'
          PLAYBACK_SHARD_INDEX: ${{ matrix.shard }}
        run: python v2/all_source_playback.py
      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-playback-page-${{ matrix.page }}-shard-${{ matrix.shard }}
          path: v2/reports/all-source-playback.json
          if-no-files-found: ignore

  review:
    needs: [sources, playback]
    if: ${{ needs.sources.result == 'success' && needs.playback.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install YouTube discovery dependency
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Validate scripts
        run: python -m py_compile v2/discover.py v2/stream_url_collisions.py v2/quality_upgrades.py v2/turkish_stream_catalog.py v2/turkish_stream_probe.py v2/turkish_stream_decode.py v2/turkish_stream_review.py v2/candidate_assets.py v2/frame_collisions.py v2/current_stream_resolution.py v2/stream_stability.py v2/test_playlist_invariants.py v2/final_validation_summary.py v2/newlisttr_extract.py v2/build_newlisttr_ibo_test.py
      - name: Download shared source discovery
        uses: actions/download-artifact@v4
        with:
          name: unified-source-snapshot
          path: v2/reports
      - name: Download shared candidate report
        uses: actions/download-artifact@v4
        with:
          name: unified-source-candidates
          path: v2/reports
      - name: Download all playback batch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: unified-playback-page-*-shard-*
          path: v2/reports/shards
      - name: Merge all playback evidence
        run: python v2/aggregate_playback_shards.py
      - name: Audit same URL across different channels
        run: python v2/stream_url_collisions.py
      - name: Refresh candidates
        run: python v2/turkish_stream_catalog.py
      - name: Find quality upgrades for existing channels
        run: python v2/quality_upgrades.py
      - name: HTTP candidate probe
        run: python v2/turkish_stream_probe.py
      - name: Short decoder verification
        run: python v2/turkish_stream_decode.py
      - name: Extract verified NewlistTR channels separately
        run: python v2/newlisttr_extract.py
      - name: Measure current playlist stream resolutions in batches
        run: |
          for batch in $(seq 0 9); do
            python v2/current_stream_resolution.py --batch "$batch" --batch-size 120
            cp v2/reports/current-stream-resolution.json "v2/reports/current-stream-resolution-batch-${batch}.json"
          done
      - name: Merge baseline batches
        run: |
          python - <<'PY'
          import glob, json
          from pathlib import Path
          files = sorted(glob.glob('v2/reports/current-stream-resolution-batch-*.json'))
          batches = [json.loads(Path(p).read_text()) for p in files]
          merged = dict(batches[0])
          merged['results'] = [x for batch in batches for x in batch['results']]
          merged['selected'] = len(merged['results'])
          merged['measured'] = sum(x['status'] == 'MEASURED' for x in merged['results'])
          merged['batches'] = len(batches)
          Path('v2/reports/current-stream-resolution.json').write_text(json.dumps(merged, ensure_ascii=False, indent=2) + chr(10))
          print('Baseline coverage:', merged['selected'], 'of', merged['distinct_channel_ids'])
          PY
      - name: Attach measured quality to upgrade report
        run: python v2/quality_upgrades.py
      - name: Build manual review queue
        run: python v2/turkish_stream_review.py
      - name: Build isolated provisional IBO review playlist
        run: python v2/build_verified_test_playlist.py
      - name: Map candidate EPG and logo metadata
        run: python v2/candidate_assets.py
      - name: Compare short video frames for possible duplicates
        run: python v2/frame_collisions.py
      - name: Repeated stream stability samples
        run: python v2/stream_stability.py --rounds 3 --interval 90 --limit 32
      - name: Validate playlist EPG XMLTV sources
        run: python v2/epg_integrity.py
      - name: Check playlist logos and EPG URLs
        run: python v2/assets_health.py
      - name: Audit logo formats and attribution
        run: python v2/logo_attribution.py
      - name: Discover official broadcaster sites
        continue-on-error: true
        run: |
          python v2/official_sites_discovery.py
          python v2/official_site_gap.py
      - name: Discover YouTube live candidates
        continue-on-error: true
        run: python v2/youtube_discovery.py
      - name: Final playlist and backup safety invariants
        run: python v2/test_playlist_invariants.py
      - name: Generate final evidence summary
        run: python v2/final_validation_summary.py
      - name: Save final diagnostic evidence even when validation rejects incomplete coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-stream-review
          path: |
            v2/reports/github-source-discovery.json
            v2/reports/candidates.json
            v2/reports/all-source-playback-aggregate.json
            v2/reports/stream-url-collisions.json
            v2/reports/quality-upgrades.json
            v2/reports/current-stream-resolution.json
            v2/reports/current-stream-resolution-batch-*.json
            v2/reports/candidate-assets.json
            v2/reports/frame-collisions.json
            v2/reports/stream-stability.json
            v2/reports/final-validation-summary.json
            v2/reports/newlisttr-check.json
            v2/reports/newlisttr-decoded-only.m3u8
            MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
            v2/reports/turkish-stream-candidates.json
            v2/reports/turkish-stream-probe.json
            v2/reports/turkish-stream-decode.json
            v2/reports/turkish-stream-review-queue.json
            v2/reports/short-decoded-review-only.m3u8
            v2/reports/short-decoded-playlist-summary.json
            v2/reports/epg-integrity.json
            v2/reports/assets-health.json
            v2/reports/logo-attribution.json
            v2/reports/official-tv-sites.json
            v2/reports/official-tv-gap.json
            v2/reports/youtube-live-candidates.json
          if-no-files-found: ignore
