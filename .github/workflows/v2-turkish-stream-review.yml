name: V2 Turkish Stream End-to-End Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'v2/turkish_stream_review.py'
      - 'v2/stream_url_collisions.py'
      - 'v2/config/sources.json'
      - 'v2/turkish_stream_catalog.py'
      - 'v2/turkish_stream_probe.py'
      - 'v2/turkish_stream_decode.py'
      - 'v2/epg_integrity.py'
      - 'v2/assets_health.py'
      - 'v2/logo_attribution.py'
      - '.github/workflows/v2-turkish-stream-review.yml'
  schedule:
    - cron: '10 6 * * 2,5'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validate scripts
        run: python -m py_compile v2/turkish_stream_catalog.py v2/turkish_stream_probe.py v2/turkish_stream_decode.py v2/turkish_stream_review.py
      - name: Search all configured M3U sources
        run: python v2/discover.py
      - name: Audit same URL across different channels
        run: python v2/stream_url_collisions.py
      - name: Refresh candidates
        run: python v2/turkish_stream_catalog.py
      - name: HTTP candidate probe
        run: python v2/turkish_stream_probe.py
      - name: Short decoder verification
        run: python v2/turkish_stream_decode.py
      - name: Build manual review queue
        run: python v2/turkish_stream_review.py
      - name: Validate playlist EPG XMLTV sources
        run: python v2/epg_integrity.py
      - name: Check playlist logos and EPG URLs
        run: python v2/assets_health.py
      - name: Audit logo formats and attribution
        run: python v2/logo_attribution.py
      - name: Save review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-stream-review
          path: |
            v2/reports/candidates.json
            v2/reports/stream-url-collisions.json
            v2/reports/turkish-stream-candidates.json
            v2/reports/turkish-stream-probe.json
            v2/reports/turkish-stream-decode.json
            v2/reports/turkish-stream-review-queue.json
            v2/reports/epg-integrity.json
            v2/reports/assets-health.json
            v2/reports/logo-attribution.json
          if-no-files-found: ignore
