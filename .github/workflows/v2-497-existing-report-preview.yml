name: "497 Existing Reports (offline only)"
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing run containing 1792-entry report.json"
        required: true
        type: string
      artifact_name:
        description: "Exact existing artifact name"
        required: true
        type: string
      report_sha256:
        description: "Canonical JSON SHA256"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s v2 -p test_ibo_test_result_reconcile.py
      - name: Fetch existing evidence (never start scanner)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          REPORT_SHA: ${{ inputs.report_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$ARTIFACT_NAME" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
          [[ "$REPORT_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/497"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/497"
          test -f "$RUNNER_TEMP/497/report.json"
          test ! -L "$RUNNER_TEMP/497/report.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"497/report.json"
          report=json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(report,dict) or report.get("schema")!=1 or not isinstance(report.get("entries"),list) or len(report["entries"])!=1792:
              raise SystemExit("Wrong report schema or count")
          canonical=json.dumps(report,sort_keys=True,ensure_ascii=False,separators=(",",":")).encode()
          if hashlib.sha256(canonical).hexdigest()!=os.environ["REPORT_SHA"]:
              raise SystemExit("Report digest mismatch")
          PY
      - name: Match identities and generate safe preview only
        env:
          REPORT_SHA: ${{ inputs.report_sha256 }}
        run: |
          set -euo pipefail
          PLAYLIST=MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          SHA="$(sha256sum "$PLAYLIST" | cut -d' ' -f1)"
          python v2/ibo_test_result_reconcile.py --playlist "$PLAYLIST" --report "$RUNNER_TEMP/497/report.json" --playlist-sha256 "$SHA" --report-sha256 "$REPORT_SHA" --out "$RUNNER_TEMP/497/preview.m3u8"
      - name: Upload manifest only (no playlist publication)
        uses: actions/upload-artifact@v4
        with:
          name: v2-497-reconciliation-manifest
          path: ${{ runner.temp }}/497/preview.json
          if-no-files-found: error
          retention-days: 30
