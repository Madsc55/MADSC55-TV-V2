name: V2 Offline Inventory Integrity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-offline-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile inventory modules
        run: python -m py_compile v2/consolidate_inventory.py v2/test_consolidate_inventory.py v2/real_ibo_scan.py v2/test_secure_archive_roundtrip.py v2/secure_archive.py v2/test_real_ibo_scan_offline.py
      - name: Test encrypted archive backup and recovery
        run: python v2/test_secure_archive_roundtrip.py
      - name: Test offline encrypted inventory restoration
        run: python v2/test_consolidate_inventory.py
      - name: Test scanner behavior without network
        run: python v2/test_real_ibo_scan_offline.py
      - name: Test IBO packaging and final acceptance offline
        run: |
          python -m py_compile v2/ibo_package_acceptance.py v2/test_ibo_package_acceptance.py v2/ibo_final_acceptance.py v2/test_ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
