name: V2 Offline Inventory Integrity
on:
  workflow_dispatch:
  push:
    branches:
      - madsc/v2-discovery-bulk-20261031
    paths:
      - 'v2/**'
      - '.github/workflows/v2-offline-inventory.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-offline-inventory.yml'

# Prevent overlapping runs on the same branch from competing for acceptance evidence.
concurrency:
  group: v2-offline-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile inventory modules
        run: python -m py_compile v2/consolidate_inventory.py v2/test_consolidate_inventory.py v2/real_ibo_scan.py v2/test_secure_archive_roundtrip.py v2/test_real_ibo_scan_offline.py v2/independent_s3_restore.py v2/test_independent_s3_restore.py v2/historical_targeted_playback.py v2/test_historical_targeted_playback.py v2/test_stage3_identity_integrity.py v2/epg_integrity.py v2/test_stage3_epg_timezone.py v2/quality_upgrades.py v2/test_stage3_quality_measurements.py
      - name: Test encrypted archive backup and recovery
        run: python v2/test_secure_archive_roundtrip.py
      - name: Test offline encrypted inventory restoration
        run: python v2/test_consolidate_inventory.py
      - name: Test scanner behavior without network
        run: python v2/test_real_ibo_scan_offline.py
      - name: Test independent S3 restore safety (mocked remote; not live S3 acceptance)
        run: python v2/test_independent_s3_restore.py
      - name: Test historical playback safety (offline; not live AV acceptance)
        run: python v2/test_historical_targeted_playback.py
      - name: Test Stage 3 URL/SHA identity and TR/AZ classification (offline)
        run: python v2/test_stage3_identity_integrity.py
      - name: Test Stage 3 EPG timezone parsing (offline)
        run: python v2/test_stage3_epg_timezone.py
      - name: Test Stage 3 measured quality evidence (offline)
        run: python v2/test_stage3_quality_measurements.py
