name: V2 Stage 6 Live Discovery Evidence (Read Only)
on:
  workflow_dispatch:
    inputs:
      approve_live_discovery:
        description: Start the new channel discovery after successful system verification
        type: boolean
        default: false
concurrency:
  group: stage6-live-discovery-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  discover:
    if: >-
      github.repository_id == '1435646455' &&
      github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_live_discovery == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approval and a successful system test on the exact source tree
        env:
          APPROVED: ${{ inputs.approve_live_discovery }}
          PUSH_BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tested_sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$PUSH_BASE" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD^)" = "$PUSH_BASE"
            git diff --quiet "$PUSH_BASE" HEAD
            tested_sha="$PUSH_BASE"
          else
            test "$APPROVED" = true
          fi
          python v2/tasks/task_engine.py --check-discovery-prerequisites --approve-live-discovery
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/v2-eight-stage-verification.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$tested_sha" -f status=success --jq '.workflow_runs | length' \
            | grep -Eq '^[1-9][0-9]*$'
      - name: Read-only source coverage preflight
        run: |
          mkdir -p v2/reports
          python v2/stage6_source_inventory.py --strict > v2/reports/stage6-preflight.json
      - name: Install discovery dependencies
        run: python -m pip install cryptography==44.0.2 'yt-dlp>=2025.1'
      - name: Discover new public source references and channel candidates
        timeout-minutes: 75
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python v2/run_all_discovery.py --run-all --source-only --include-world
      - name: Check protected playlist and history
        if: always()
        run: |
          git diff --exit-code -- MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/history/stage3-4955-hash-only.jsonl
      - name: Upload source preflight and hash-only candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-stage6-source-discovery-evidence
          path: |
            v2/reports/stage6-preflight.json
            v2/reports/candidates.json
          if-no-files-found: ignore
          retention-days: 14
