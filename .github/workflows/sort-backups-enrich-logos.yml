name: Sort backups and enrich missing logos
on:
  push:
    paths:
      - '.github/workflows/sort-backups-enrich-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alphabetize backups and match logos
        run: python v2/sort_and_enrich_logos.py
      - name: Commit playlist
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git diff --cached --quiet || (git commit -m 'Alphabetize backups and fill verified channel logos' && git push)
