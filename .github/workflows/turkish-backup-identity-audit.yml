name: Turkish backup identity audit
on:
  push:
    paths:
      - '.github/workflows/turkish-backup-identity-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move verified Turkish station identities
        run: python v2/turkish_backups_identity_audit.py
      - name: Commit audited playlist
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
          git commit -m 'Move identified Turkish backup channels'
          git push
