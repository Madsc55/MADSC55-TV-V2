name: V2 manual source discovery audit
on:
  workflow_dispatch:
    inputs:
      check_sources:
        description: "Check public M3U source availability, not stream playback"
        type: boolean
        default: true
      search_github:
        description: "Opt in to public GitHub/Gist playlist reference discovery"
        type: boolean
        default: false
      search_forges:
        description: "Search public GitLab and Codeberg source references"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: v2-manual-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-adapter-batch:
    name: Bulk adapter regressions and opted-in source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all related source adapter regressions together, offline
        shell: bash
        run: |
          mkdir -p v2/reports/ci
          set -o pipefail
          PYTHONPATH=v2 python -m unittest -v \
            test_source_adapter_matrix \
            test_source_adapters_batch \
            test_forge_adapter_integration \
            test_forge_source_runner \
            test_forge_source_discovery \
            test_forge_source_review \
            test_forge_api_safety \
            test_github_source_safety \
            test_github_source_approval \
            test_github_partial_discovery \
            test_gist_filename_discovery \
            test_source_inventory_contract \
            test_webpage_source_discovery \
            2>&1 | tee v2/reports/ci/source-adapters-batch.log
      - name: Check source availability (opt-in)
        if: inputs.check_sources
        run: python v2/source_availability_audit.py --audit-public-sources
      - name: Discover GitHub/Gist references (opt-in)
        if: inputs.search_github
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python v2/github_source_discovery.py
      - name: Discover GitLab/Codeberg references (opt-in)
        if: inputs.search_forges
        run: python v2/run_forge_source_discovery.py --scan-public-forges
      - name: Upload grouped source adapter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-adapters-batch-${{ github.run_id }}
          path: |
            v2/reports/ci/source-adapters-batch.log
            v2/reports/source-availability-audit.json
            v2/reports/github-source-discovery.json
            v2/reports/forge-source-discovery.json
          retention-days: 30
          if-no-files-found: warn
