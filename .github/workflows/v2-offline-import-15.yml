name: V2 Offline Import 15 Existing Observations
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      V2_ARCHIVE_PASSPHRASE: ${{ secrets.V2_ARCHIVE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted archive dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Require archive key without exposing it
        run: |
          test -n "$V2_ARCHIVE_PASSPHRASE" || { echo "::error::Missing archive key"; exit 1; }
      - name: Download only existing authenticated source artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-offline-source
          gh run download 43608247496 --repo Madsc55/MADSC55-TV-V2 --name v2-real-scan-evidence --dir /tmp/v2-offline-source
          test -f /tmp/v2-offline-source/ibo-scan-progress.enc
          test ! -L /tmp/v2-offline-source/ibo-scan-progress.enc
          install -m 600 /tmp/v2-offline-source/ibo-scan-progress.enc /tmp/ibo-scan-progress.enc
      - name: Validate report and dry-run import
        run: |
          set -euo pipefail
          PYTHONPATH=v2 python -m unittest -v test_merge_bounded_retry_checkpoint
          python v2/merge_bounded_retry_checkpoint.py --checkpoint /tmp/ibo-scan-progress.enc --report v2/reports/task17-18-20-bounded-retry-20261118.json
      - name: Import existing 15 observations and verify encrypted readback
        run: python v2/merge_bounded_retry_checkpoint.py --checkpoint /tmp/ibo-scan-progress.enc --report v2/reports/task17-18-20-bounded-retry-20261118.json --apply
      - name: Upload only encrypted checkpoint and original backup
        uses: actions/upload-artifact@v4
        with:
          name: v2-bounded-retry-15-merged-checkpoint
          path: |
            /tmp/ibo-scan-progress.enc
            /tmp/ibo-scan-progress.enc.pre-bounded-retry.bak
          if-no-files-found: error
          retention-days: 30
