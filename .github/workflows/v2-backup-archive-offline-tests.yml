name: V2 Backup Archive Offline Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/backup_*.py"
      - "v2/spoken_language_sample_review.py"
      - "v2/test_backup_*.py"
      - "v2/test_spoken_language_sample_review.py"
      - "v2/run_backup_archive_tests.py"
      - ".github/workflows/v2-backup-archive-offline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-backup-archive-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete backup archive regression suite
        run: python v2/run_backup_archive_tests.py --verbose
