name: V2 Independent Google Drive Archive Restore
on:
  workflow_dispatch:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - 'v2/independent_drive_restore.py'
      - '.github/workflows/v2-independent-drive-restore.yml'
permissions:
  contents: read
jobs:
  drive-restore:
    if: >-
      github.repository_id == '1435646455' &&
      github.repository_owner_id == '263524426' &&
      (github.ref == 'refs/heads/madsc/v2-discovery-bulk-20261031' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install archive verification dependency
        run: python -m pip install --disable-pip-version-check cryptography==44.0.2
      - name: Authenticate the Google Drive reader with GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/144234728376/locations/global/workloadIdentityPools/madsc55-v2-github/providers/github-actions
          service_account: madsc55-v2-drive-backup@madsc55-tv-v2-backup.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify the independent Drive archive and restore the original AES records
        env:
          V2_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          V2_PRODUCTION_AES_KEY_METADATA_B64: ${{ secrets.V2_PRODUCTION_AES_KEY_METADATA_B64 }}
        shell: bash
        run: |
          set -o pipefail
          umask 077
          python v2/independent_drive_restore.py | tee -a "$GITHUB_STEP_SUMMARY"
