name: V2 Independent Google Drive Archive Restore
on:
  workflow_dispatch:
  push:
    branches: [madsc/v2-discovery-bulk-20261031]
    paths:
      - 'v2/independent_drive_restore.py'
      - 'v2/archive_acceptance_gate.py'
      - '.github/workflows/v2-independent-drive-restore.yml'
jobs:
  drive-restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      V2_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.V2_DRIVE_SERVICE_ACCOUNT_JSON }}
      V2_ARCHIVE_KEY_HEX: ${{ secrets.V2_ARCHIVE_KEY_HEX }}
      V2_DRIVE_ARCHIVE_FILE_ID: ${{ secrets.V2_DRIVE_ARCHIVE_FILE_ID }}
      V2_ARCHIVE_EXPECTED_SHA256: "38db9b094c48e49eb0b5b1234ddc6a109f215d6d9fa732a1a4d0cf592673fe4c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify secret provisioning without exposing values
        shell: bash
        run: |
          test -n "$V2_DRIVE_SERVICE_ACCOUNT_JSON" || { echo "Missing V2_DRIVE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$V2_ARCHIVE_KEY_HEX" || { echo "Missing V2_ARCHIVE_KEY_HEX"; exit 1; }
          test -n "$V2_DRIVE_ARCHIVE_FILE_ID" || { echo "Missing V2_DRIVE_ARCHIVE_FILE_ID"; exit 1; }
      - name: Install authenticated Drive client and archive dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests cryptography
      - name: Verify independent Drive AES restore and immutable history
        working-directory: v2
        run: python independent_drive_restore.py
