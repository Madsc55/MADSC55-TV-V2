name: Alphabetize backups and audit logos
on:
  push:
    paths:
      - '.github/workflows/backups-logo-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort backups and resolve trustworthy logos
        run: python v2/sort_backups_and_logo_audit.py
      - name: Commit playlist and unresolved-logo report
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/reports/logo-audit.json
          git commit -m 'Sort backups and apply verified channel logos'
          git push
