name: V2 Stage B Package Gate Tests
on:
  pull_request:
    paths:
      - 'v2/verify_ibo_package_evidence.py'
      - 'v2/test_verify_ibo_package_evidence.py'
      - 'v2/export_ibo_batches.py'
      - 'v2/secure_archive.py'
      - '.github/workflows/v2-stage-b-package-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-b-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify Stage B positive and fail-closed cases
        run: python -m unittest discover -s v2 -p 'test_verify_ibo_package_evidence.py' -v
