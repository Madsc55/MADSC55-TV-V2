name: MADSC TV — Eski ve Yeni Tarama Kurtarma Kontrolü
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v2-historical-recovery.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect IBO and permanent backups
        run: |
          test "$(git hash-object MADSC55_TV_IBO_CALISANLAR_TEST.m3u8)" = "4b1c3cea4b5107a425abab60f62d41f9f81e05a7"
          python v2/test_playlist_invariants.py
      - name: Download existing #60 and #72 evidence without rescanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/madsc-60 /tmp/madsc-72
          gh run download 40743765437 -n turkish-stream-review -D /tmp/madsc-60
          gh run download 40948768782 -n turkish-stream-review -D /tmp/madsc-72
      - name: Compare historical candidates and preserve missing decoded identities
        run: |
          python v2/compare_historical_playback.py \
            --old /tmp/madsc-60/v2/reports/all-source-playback-aggregate.json \
            --new /tmp/madsc-72/v2/reports/all-source-playback-aggregate.json \
            --output v2/reports/historical-recovery
      - name: Recover latest GitHub-discovered M3U source catalog when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/madsc-dynamic
          RUN_ID="$(gh run list --workflow v2-github-source-discovery.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n github-turkish-m3u-source-discovery -D /tmp/madsc-dynamic || echo "Dynamic catalog artifact unavailable; report will show incomplete coverage"
          else
            echo "No successful dynamic source discovery run found"
          fi
      - name: Rediscover historical decoded identities from current configured sources without full playback scan
        run: |
          python v2/rediscover_historical_candidates.py \
            --old /tmp/madsc-60/v2/reports/all-source-playback-aggregate.json \
            --new /tmp/madsc-72/v2/reports/all-source-playback-aggregate.json \
            --sources v2/config/sources.json \
            --dynamic-sources /tmp/madsc-dynamic/v2/reports/github-source-discovery.json \
            --output v2/reports/historical-recovery/rediscovered-current-sources.json
      - name: Show recovery counts in GitHub Actions summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('v2/reports/historical-recovery/rediscovered-current-sources.json').read_text())
          lines = [
              '## Historical #60–#72 source rediscovery',
              '',
              '| Metric | Count |',
              '|---|---:|',
              f"| Previously decoded, absent from #72 | {report['old_decoded_missing_from_new']} |",
              f"| URL identities rediscovered | {report['rediscovered_count']} |",
              f"| Still unmatched | {report['still_unmatched']} |",
              '',
              '**Rediscovered is not playback-tested or Turkish-speech verified.**',
              '',
              '### Source audit',
              '| Source | Parsed | Matched | Status |',
              '|---|---:|---:|---|',
          ]
          for s in report['sources']:
              lines.append(f"| {s['source']} | {s.get('parsed', 0)} | {s.get('matched', 0)} | {s['status']} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n'.join(lines) + '\\n')
          print('Rediscovered:', report['rediscovered_count'], 'Still unmatched:', report['still_unmatched'])
          PY
      - name: Publish anonymous recovery evidence only
        uses: actions/upload-artifact@v4
        with:
          name: historical-60-vs-72-recovery
          path: v2/reports/historical-recovery/
          if-no-files-found: error
          retention-days: 30
