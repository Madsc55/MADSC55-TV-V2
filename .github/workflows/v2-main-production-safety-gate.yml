name: V2 Main Production Security Gate
on:
  push:
    branches:
      - main
      - madsc/v2-production-actions-lock-20261103
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-lock:
    name: Verify suspended publishers, no cron and immutable IBO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Grouped safety regression tests
        run: PYTHONPATH=v2 python -m unittest -v test_main_actions_security_gate
      - name: Fail closed on changes to production trigger/write policy
        run: PYTHONPATH=v2 python v2/main_actions_security_gate.py
      - name: Preserve original IBO category and backup invariants
        run: python v2/test_playlist_invariants.py
      - name: Historical task ledger integrity
        run: PYTHONPATH=v2 python -m unittest -v test_task_ledger_integrity
      - name: Stage 2 identity recovery metadata integration acceptance
        run: |
          python -m pip install 'cryptography>=42,<47'
          python -m py_compile v2/stage2_integration.py v2/identity_metadata.py v2/recovery_queue.py v2/real_ibo_scan.py
          python v2/test_recovery_identity.py
          python v2/test_recovery_queue.py
          python v2/test_identity_metadata.py
          python v2/test_stage2_integration.py
      - name: Stage 6 offline package and archive acceptance regressions
        run: |
          python -m pip install 'cryptography>=42,<47'
          python v2/test_secure_archive_roundtrip.py
          python v2/test_consolidate_inventory.py
          echo 'Recheck Stage 3 scanner dynamic-source validation'
          python v2/test_real_ibo_scan_offline.py
          python -m py_compile v2/real_ibo_scan.py v2/consolidate_inventory.py v2/ibo_package_acceptance.py v2/ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
      - name: Stage 2 and Stage 3 offline identity, EPG and recovery acceptance
        run: |
          echo 'Stage 2/3 grouped acceptance includes current-main scanner and probe integration'
          PYTHONPATH=v2 python -m unittest -v test_identity_metadata test_recovery_identity test_recovery_queue test_stage2_integration test_stage3_identity_recovery test_stage3_metadata_acceptance test_stage3_recovery_queue test_stage3_scanner_integration
          PYTHONPATH=v2 python -m unittest -v test_epg_integrity
          python -m py_compile v2/epg_integrity.py
          python -m py_compile v2/identity_metadata.py v2/recovery_queue.py v2/stage2_integration.py v2/stage3_identity_recovery.py v2/stage3_metadata_acceptance.py v2/stage3_recovery_queue.py v2/real_ibo_scan.py v2/discover.py v2/consolidate_inventory.py
      - name: Discovery 34 offline adapter and integration acceptance
        run: |
          PYTHONPATH=v2 python -m unittest -v test_discovery_34 test_discovery_34_integrate test_discovery_34_live_contract
          python -m py_compile v2/discovery_34.py v2/discovery_34_integrate.py v2/discovery_34_live_contract.py
          PYTHONPATH=v2 python v2/discovery_34.py --output /tmp/discovery-34-offline.json
          PYTHONPATH=v2 python v2/discovery_34_integrate.py --output /tmp/discovery-34-integrated.json

  live-discovery-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '#34 live probe')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe all six discovery terms on GitHub, GitLab and Codeberg
        run: PYTHONPATH=v2 python v2/discovery_34_live_contract.py
