name: V2 Main Production Security Gate
on:
  push:
    branches:
      - main
      - madsc/v2-production-actions-lock-20261103
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-lock:
    name: Verify suspended publishers, no cron and immutable IBO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Grouped safety regression tests
        run: PYTHONPATH=v2 python -m unittest -v test_main_actions_security_gate
      - name: Fail closed on changes to production trigger/write policy
        run: PYTHONPATH=v2 python v2/main_actions_security_gate.py
      - name: Preserve original IBO category and backup invariants
        run: python v2/test_playlist_invariants.py
      - name: Historical task ledger integrity
        run: PYTHONPATH=v2 python -m unittest -v test_task_ledger_integrity
      - name: Stage 2 identity recovery metadata integration acceptance
        run: |
          python -m pip install 'cryptography>=42,<47'
          python -m py_compile v2/stage2_integration.py v2/identity_metadata.py v2/recovery_queue.py v2/real_ibo_scan.py
          python v2/test_recovery_identity.py
          python v2/test_recovery_queue.py
          python v2/test_identity_metadata.py
          python v2/test_stage2_integration.py
      - name: Stage 6 offline package and archive acceptance regressions
        run: |
          python -m pip install 'cryptography>=42,<47'
          python v2/test_secure_archive_roundtrip.py
          python v2/test_consolidate_inventory.py
          echo 'Recheck Stage 3 scanner dynamic-source validation'
          python v2/test_real_ibo_scan_offline.py
          PYTHONPATH=v2 python -m unittest -v test_scan_checkpoint
          python -m py_compile v2/scan_checkpoint.py v2/bootstrap_pending_checkpoint.py v2/test_scan_checkpoint.py
          python -m py_compile v2/real_ibo_scan.py v2/consolidate_inventory.py v2/ibo_package_acceptance.py v2/ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
          PYTHONPATH=v2 python -m unittest -v test_export_ibo_batches
      - name: Stage 2 and Stage 3 offline identity, EPG and recovery acceptance
        run: |
          echo 'Stage 2/3 grouped acceptance includes current-main scanner and probe integration'
          PYTHONPATH=v2 python -m unittest -v test_identity_metadata test_recovery_identity test_recovery_queue test_stage2_integration test_stage3_identity_recovery test_stage3_metadata_acceptance test_stage3_recovery_queue test_stage3_scanner_integration
          PYTHONPATH=v2 python -m unittest -v test_epg_integrity test_build_epg
          python -m py_compile v2/epg_integrity.py v2/build_epg.py v2/test_build_epg.py
          PYTHONPATH=v2 python -m unittest -v test_official_sites_discovery test_direct_stream_resolver test_youtube_discovery
          python -m py_compile v2/official_sites_discovery.py v2/direct_stream_resolver.py v2/test_official_sites_discovery.py v2/test_direct_stream_resolver.py v2/youtube_discovery.py v2/test_youtube_discovery.py
          python -m py_compile v2/identity_metadata.py v2/recovery_queue.py v2/stage2_integration.py v2/stage3_identity_recovery.py v2/stage3_metadata_acceptance.py v2/stage3_recovery_queue.py v2/real_ibo_scan.py v2/discover.py v2/consolidate_inventory.py
      - name: Ensure FFmpeg is available for real local decoded-media regression
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
      - name: Stage 5 evidence-gated export and final acceptance regressions
        run: |
          python -m py_compile v2/stage5_acceptance_gate.py v2/stage5_evidence_export.py v2/test_stage5_acceptance_gate.py v2/test_stage5_evidence_export.py
          python v2/test_stage5_acceptance_gate.py
          PYTHONPATH=v2 python -m unittest -v test_stage5_evidence_export
      - name: Discovery 34 offline adapter and integration acceptance
        run: |
          PYTHONPATH=v2 python -m unittest -v test_discovery_34 test_discovery_34_integrate test_discovery_34_integrate_acceptance test_discovery_34_live_contract
          PYTHONPATH=v2 python -m unittest -v test_github_source_discovery
          PYTHONPATH=v2 python -m unittest -v test_federated_m3u_source_discovery
          python -m py_compile v2/federated_m3u_source_discovery.py v2/test_federated_m3u_source_discovery.py
          python -m py_compile v2/github_source_discovery.py v2/test_github_source_discovery.py
          python -m py_compile v2/discovery_34.py v2/discovery_34_integrate.py v2/discovery_34_live_contract.py
          PYTHONPATH=v2 python v2/discovery_34.py --output /tmp/discovery-34-offline.json
          # The checked-in inputs are intentionally incomplete; preserve the partial report,
          # and assert the CLI fails closed rather than treating missing sources as success.
          if PYTHONPATH=v2 python v2/discovery_34_integrate.py --output /tmp/discovery-34-integrated.json; then
            python -c 'import json; d=json.load(open("/tmp/discovery-34-integrated.json")); assert not d["errors"], "Unexpected success with missing sources"'
          else
            python -c 'import json; d=json.load(open("/tmp/discovery-34-integrated.json")); assert d["errors"] and d["verified_av"] == 0, "Failed CLI must preserve missing-source evidence"'
          fi

  live-discovery-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '#34 live probe')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe all six discovery terms on GitHub, GitLab and Codeberg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=v2 python v2/discovery_34_live_contract.py
