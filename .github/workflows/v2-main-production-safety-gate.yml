name: V2 Main Production Security Gate
on:
  push:
    branches:
      - main
      - madsc/v2-production-actions-lock-20261103
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      discovery_provider:
        description: 'Read-only #34 diagnostic provider (all or one)'
        required: true
        type: choice
        default: all
        options:
          - all
          - github
          - gitlab
          - codeberg
permissions:
  contents: read
  actions: read
jobs:
  production-lock:
    name: Verify suspended publishers, no cron and immutable IBO
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Grouped safety regression tests
        run: PYTHONPATH=v2 python -m unittest -v test_main_actions_security_gate
      - name: Issue 497 existing-audit adapter offline regression (no scan)
        run: |
          PYTHONPATH=v2 python -m unittest -v test_ibo_test_result_reconcile test_ibo_497_audit_adapter test_ibo_497_existing_artifact
          python -m py_compile v2/ibo_test_result_reconcile.py v2/ibo_497_audit_adapter.py v2/ibo_497_existing_artifact.py
      - name: Check whether historical #497 preview can be rebound
        id: historical
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          text = Path('MADSC55_TV_IBO_CALISANLAR_TEST.m3u8').read_text(encoding='utf-8-sig')
          blocks = re.findall(r'^#EXTINF:.*group-title="[^"]*YEDEKLER[^\"]*"', text, re.M)
          print('exact=' + ('true' if len(blocks) == 1792 else 'false'))
          PY
      - name: Build #497 preview from exact historical artifact (no scan, no playlist write)
        if: steps.historical.outputs.exact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python v2/ibo_497_existing_artifact.py --output-dir /tmp/v2-497-existing-audit-preview
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/v2-497-existing-audit-preview")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          playlist = Path("MADSC55_TV_IBO_CALISANLAR_TEST.m3u8").read_bytes()
          preview = (root / "preview.m3u8").read_bytes()
          assert preview == playlist, "preview changed canonical playlist bytes"
          assert manifest["counts"] == {"verified": 1107, "uncertain": 685}
          assert manifest["ordered_yedekler_blocks_identical"] is True
          assert manifest["canonical_playlist_written"] is False
          assert manifest["new_scan_started"] is False
          assert manifest["source_report_file_sha256"] == "30de600eca7d8e3140f423bb3fc248dc2f57df6ff031b0bf97276a9a861dba2c"
          print(json.dumps({"preview_byte_identical": True, "counts": manifest["counts"],
                            "source_run_id": manifest["source_run_id"],
                            "source_artifact_id": manifest["source_artifact_id"],
                            "playlist_sha256": hashlib.sha256(playlist).hexdigest()}))
          PY
      - name: Upload immutable #497 historical reconciliation preview
        if: steps.historical.outputs.exact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v2-497-existing-audit-preview
          path: /tmp/v2-497-existing-audit-preview/
          if-no-files-found: error
          retention-days: 90
      - name: Generate SHA-bound 685 uncertain retry plan (offline; no network probes)
        if: steps.historical.outputs.exact == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=v2 python v2/ibo_497_retry_plan.py \
            --playlist MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 \
            --initial-manifest /tmp/v2-497-existing-audit-preview/manifest.json \
            --output /tmp/v2-497-685-retry-plan.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          output = Path("/tmp/v2-497-685-retry-plan.json")
          plan = json.loads(output.read_text(encoding="utf-8"))
          assert plan["schema_version"] == 1
          assert plan["plan_type"] == "READ_ONLY_UNCERTAIN_RETRY_PLAN"
          assert plan["plan_status"] == "PENDING_FINAL_TEST_AUTHORIZATION"
          assert plan["plan_sha256"] == "0ea6f56d9bd599a6f7d5c287296f16a08701ac320c2377e095d6f227296c439a"
          assert plan["playlist_sha256"] == hashlib.sha256(
              Path("MADSC55_TV_IBO_CALISANLAR_TEST.m3u8").read_bytes()).hexdigest()
          assert plan["initial_manifest_sha256"] == "b001bf48f07437e9ae67ed9f73b12ea9cfcab653523973435cf3b1cee3c31fcc"
          assert len(plan["items"]) == plan["uncertain_retry_plan_count"] == 685
          assert len({x["channel_sha256"] for x in plan["items"]}) == 685
          assert len({x["url_sha256"] for x in plan["items"]}) == 685
          assert all(x["source_status"] == "uncertain" and
                     x["live_retry_authorized"] is False and
                     x["next_attempt_number"] == 2 for x in plan["items"])
          assert plan["historically_verified_count"] == 1107
          assert plan["network_attempts"] == 0 and plan["new_scan_started"] is False
          assert plan["live_retry_authorized"] is False
          assert plan["playlist_write_allowed"] is False
          assert plan["archive_write_allowed"] is False
          assert plan["category_mutation_allowed"] is False
          print(json.dumps({
              "plan_sha256": plan["plan_sha256"],
              "plan_file_sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
              "retry_rows": len(plan["items"]),
              "new_scan_started": False,
              "playlist_modified": False}, sort_keys=True))
          PY
      - name: Publish 685 retry plan artifact on main only (read-only)
        if: ${{ steps.historical.outputs.exact == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-497-685-readonly-retry-plan
          path: /tmp/v2-497-685-retry-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Stage 5 historical worldwide URL hash crosswalk offline regression
        run: |
          PYTHONPATH=v2:. python -m unittest -v v2.test_yedekler_worldwide_crosswalk
          python -m py_compile v2/yedekler_worldwide_crosswalk.py v2/test_yedekler_worldwide_crosswalk.py
      - name: Build Stage 5 historical crosswalk from exact old artifact (no scan)
        if: steps.historical.outputs.exact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=v2 python v2/yedekler_worldwide_crosswalk.py --output-dir /tmp/v2-stage5-worldwide-crosswalk
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/v2-stage5-worldwide-crosswalk")
          summary = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          rows = json.loads((root / "crosswalk.json").read_text(encoding="utf-8"))["entries"]
          c = summary["counts"]
          assert c["archive_total"] == 18074
          assert len(rows) == 18074
          assert summary["main_inventory"] == {
              "YEDEKLER": 1792, "ANA": 15574, "TURK": 424,
              "YABANCI": 284, "OTHER": 838, "TOTAL": 18912,
          }
          assert summary["batch_state_counts"] == {
              "TEST": 1792, "TURK": 424, "YABANCI": 284,
          }
          assert c["worldwide_exact_hash_matches"] + c["worldwide_not_found"] == 18074
          assert summary["new_scan_started"] is False
          assert summary["playlist_written"] is False
          assert summary["raw_urls_in_report"] is False
          print(json.dumps({"counts": c, "source_run_id": summary["source_run_id"],
                            "new_scan_started": False, "playlist_written": False}))
          PY
      - name: Upload Stage 5 unchanged historical hash crosswalk evidence
        if: steps.historical.outputs.exact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v2-stage5-historical-worldwide-crosswalk
          path: /tmp/v2-stage5-worldwide-crosswalk/
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed on changes to production trigger/write policy
        run: PYTHONPATH=v2 python v2/main_actions_security_gate.py
      - name: Preserve original IBO category and backup invariants
        run: python v2/test_playlist_invariants.py
      - name: Historical task ledger integrity
        run: PYTHONPATH=v2 python -m unittest -v test_task_ledger_integrity
      - name: Stage 2 identity recovery metadata integration acceptance
        run: |
          python -m pip install 'cryptography>=42,<47'
          python -m py_compile v2/stage2_integration.py v2/identity_metadata.py v2/recovery_queue.py v2/real_ibo_scan.py
          python v2/test_recovery_identity.py
          python v2/test_recovery_queue.py
          python v2/test_identity_metadata.py
          python v2/test_stage2_integration.py
      - name: Stage 6 offline package and archive acceptance regressions
        run: |
          python -m pip install 'cryptography>=42,<47'
          python v2/test_secure_archive_roundtrip.py
          python -m unittest -v v2.test_stage4_historical_restore_verify
          python -m unittest -v v2.test_turk_authorized_vault
          python -m py_compile v2/authorized_vault_external_restore_acceptance.py v2/test_authorized_vault_external_restore_acceptance.py
          python -m unittest -v v2.test_authorized_vault_external_restore_acceptance
          PYTHONPATH=v2 python -m unittest -v test_stage_c_verify_retrieved_archive
          PYTHONPATH=v2 python -m unittest -v test_archive_format_preflight
          python -m py_compile v2/stage_c_verify_retrieved_archive.py v2/test_stage_c_verify_retrieved_archive.py
          python v2/test_consolidate_inventory.py
          echo 'Recheck Stage 3 scanner dynamic-source validation'
          python v2/test_real_ibo_scan_offline.py
          PYTHONPATH=v2 python -m unittest -v test_scan_checkpoint
          PYTHONPATH=v2 python -m unittest -v test_validate_real_scan_acceptance
          PYTHONPATH=v2 python -m unittest -v test_stage_a_evidence_review
          PYTHONPATH=v2 python -m unittest -v test_real_scan_workflow_resume
          python -m py_compile v2/scan_checkpoint.py v2/bootstrap_pending_checkpoint.py v2/test_scan_checkpoint.py
          python -m py_compile v2/validate_real_scan_acceptance.py v2/test_validate_real_scan_acceptance.py
          python -m py_compile v2/stage_a_evidence_review.py v2/test_stage_a_evidence_review.py
          python -m py_compile v2/test_real_scan_workflow_resume.py
          python -m py_compile v2/real_ibo_scan.py v2/consolidate_inventory.py v2/ibo_package_acceptance.py v2/ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
          python -m py_compile v2/ibo_device_acceptance.py v2/test_ibo_device_acceptance.py
          python v2/test_ibo_device_acceptance.py
          PYTHONPATH=v2 python -m unittest -v test_verify_external_archive_bytes
          PYTHONPATH=v2 python -m unittest -v test_export_ibo_batches
      - name: Stage 2 and Stage 3 offline identity, EPG and recovery acceptance
        run: |
          echo 'Stage 2/3 grouped acceptance includes current-main scanner and probe integration'
          PYTHONPATH=v2 python -m unittest -v test_identity_metadata test_recovery_identity test_recovery_queue test_stage2_integration test_stage3_identity_recovery test_stage3_metadata_acceptance test_stage3_recovery_queue test_stage3_scanner_integration
          PYTHONPATH=v2 python -m unittest -v test_epg_integrity test_build_epg
          python -m py_compile v2/epg_integrity.py v2/build_epg.py v2/test_build_epg.py
          PYTHONPATH=v2 python -m unittest -v test_official_sites_discovery test_direct_stream_resolver test_youtube_discovery
          python -m py_compile v2/official_sites_discovery.py v2/direct_stream_resolver.py v2/test_official_sites_discovery.py v2/test_direct_stream_resolver.py v2/youtube_discovery.py v2/test_youtube_discovery.py
          python -m py_compile v2/identity_metadata.py v2/recovery_queue.py v2/stage2_integration.py v2/stage3_identity_recovery.py v2/stage3_metadata_acceptance.py v2/stage3_recovery_queue.py v2/real_ibo_scan.py v2/discover.py v2/consolidate_inventory.py
      - name: Ensure FFmpeg is available for real local decoded-media regression
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! tesseract --list-langs 2>/dev/null | grep -qx tur; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-tur fonts-dejavu-core
          fi
          command -v ffprobe
          command -v ffmpeg
      - name: Issue 497 targeted uncertain retry offline regressions (no live scan)
        run: |
          python -m py_compile v2/ibo_495_yedekler_av_audit.py v2/ibo_497_retry_reconcile.py v2/ibo_497_retry_plan.py v2/test_ibo_495_yedekler_av_audit.py v2/test_ibo_497_retry_reconcile.py v2/test_ibo_497_retry_plan.py
          PYTHONPATH=v2 python -m unittest -v v2.test_ibo_495_yedekler_av_audit v2.test_ibo_497_retry_reconcile v2.test_ibo_497_retry_plan
          python -m py_compile v2/stream_probe.py v2/test_stream_probe_public_target.py
          PYTHONPATH=v2 python -m unittest -v test_stream_probe_public_target
      - name: Stage 5 evidence-gated export and final acceptance regressions
        run: |
          python -m py_compile v2/stage5_acceptance_gate.py v2/stage5_evidence_export.py v2/test_stage5_acceptance_gate.py v2/test_stage5_evidence_export.py
          python v2/test_stage5_acceptance_gate.py
          PYTHONPATH=v2 python -m unittest -v test_stage5_evidence_export
      - name: Turkish channel triage offline regression (no playlist writes)
        run: |
          python -m py_compile v2/turkish_channel_triage.py v2/test_turkish_channel_triage.py
          python -m unittest -v v2.test_turkish_channel_triage
          python -m unittest -v v2.test_turkish_evidence_ingest
          python -m unittest -v v2.test_turkish_probe_evidence
          python -m unittest -v v2.test_turkish_webvtt_evidence
          python -m unittest -v v2.test_turkish_asr_ocr_evidence
          python -m unittest -v v2.test_turkish_media_sample_capture
          python -m unittest -v v2.test_turkish_safe_dns_capture
          python -m py_compile v2/turkish_hls_safe_segments.py v2/test_turkish_hls_safe_segments.py
          python -m unittest -v v2.test_turkish_hls_safe_segments
          python -m unittest -v v2.test_turkish_subtitle_track_review
          python -m unittest -v v2.test_turkish_iso639_review
          python -m unittest -v v2.test_turkish_local_media_probe
          python -m unittest -v v2.test_backup_text_evidence v2.test_turkish_sample_review
      - name: Task 34 FFmpeg decoded audio/video regression (offline fixtures only)
        run: |
          python -m py_compile v2/turkish_stream_decode.py v2/test_turkish_local_media_probe.py v2/test_turkish_stream_decode.py
          python -m unittest -v v2.test_turkish_local_media_probe v2.test_turkish_stream_decode
      - name: Discovery 34 offline adapter and integration acceptance
        run: |
          PYTHONPATH=v2 python -m unittest -v test_discovery_34 test_discovery_34_integrate test_discovery_34_integrate_acceptance test_discovery_34_live_contract
          PYTHONPATH=v2 python -m unittest -v test_github_source_discovery
          PYTHONPATH=v2 python -m unittest -v test_federated_m3u_source_discovery
          python -m py_compile v2/federated_m3u_source_discovery.py v2/test_federated_m3u_source_discovery.py
          python -m py_compile v2/github_source_discovery.py v2/test_github_source_discovery.py
          python -m py_compile v2/discovery_34.py v2/discovery_34_integrate.py v2/discovery_34_live_contract.py
          PYTHONPATH=v2 python v2/discovery_34.py --output /tmp/discovery-34-offline.json
          # The checked-in inputs are intentionally incomplete; preserve the partial report,
          # and assert the CLI fails closed rather than treating missing sources as success.
          if PYTHONPATH=v2 python v2/discovery_34_integrate.py --output /tmp/discovery-34-integrated.json; then
            python -c 'import json; d=json.load(open("/tmp/discovery-34-integrated.json")); assert not d["errors"], "Unexpected success with missing sources"'
          else
            python -c 'import json; d=json.load(open("/tmp/discovery-34-integrated.json")); assert d["errors"] and d["verified_av"] == 0, "Failed CLI must preserve missing-source evidence"'
          fi

  live-discovery-diagnostic:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '#34 live probe'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe all six discovery terms on GitHub, GitLab and Codeberg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=v2 python v2/discovery_34_live_contract.py --provider "${{ inputs.discovery_provider || 'all' }}" --output /tmp/v2-discovery-34-live-diagnostic.json
      - name: Upload read-only provider diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-discovery-34-live-diagnostic
          path: /tmp/v2-discovery-34-live-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
