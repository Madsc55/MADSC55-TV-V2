name: V2 Main Production Security Gate
on:
  push:
    branches:
      - main
      - madsc/v2-production-actions-lock-20261103
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-lock:
    name: Verify suspended publishers, no cron and immutable IBO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Grouped safety regression tests
        run: PYTHONPATH=v2 python -m unittest -v test_main_actions_security_gate
      - name: Fail closed on changes to production trigger/write policy
        run: PYTHONPATH=v2 python v2/main_actions_security_gate.py
      - name: Preserve original IBO category and backup invariants
        run: python v2/test_playlist_invariants.py
      - name: Stage 6 offline package and archive acceptance regressions
        run: |
          python -m pip install 'cryptography>=42,<47'
          python v2/test_secure_archive_roundtrip.py
          python v2/test_consolidate_inventory.py
          python v2/test_real_ibo_scan_offline.py
          python -m py_compile v2/real_ibo_scan.py v2/consolidate_inventory.py
          python -m py_compile v2/ibo_package_acceptance.py v2/ibo_final_acceptance.py
          python v2/test_ibo_package_acceptance.py
          python v2/test_ibo_final_acceptance.py
