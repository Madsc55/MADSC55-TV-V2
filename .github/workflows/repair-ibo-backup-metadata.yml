name: Diagnose and repair IBO backup category metadata
on:
  pull_request:
    paths:
      - 'v2/tools/repair_backup_group_metadata.py'
      - '.github/workflows/repair-ibo-backup-metadata.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Inspect 18122 backups and repair existing playlist on PR branch
        run: python3 v2/tools/repair_backup_group_metadata.py
      - name: Commit reviewed source playlist changes and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MADSC55_TV_IBO_CALISANLAR_TEST.m3u8 v2/archives/test001_backup_metadata_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Repair backup metadata in existing playlist"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Upload report and corrected source playlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibo-backup-test001-diagnosis
          path: |
            MADSC55_TV_IBO_CALISANLAR_TEST.m3u8
            v2/archives/test001_backup_metadata_report.json
          if-no-files-found: warn
